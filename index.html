<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Central de Operações · Valenro</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --ink:#1b2333; --mute:#677086; --line:#e2e6ed;
    --pri:#02285a; --pri2:#0b3a78; --acc:#02285a; --amarelo:#f1c300; --full:#a9b6c8; --serie:#02285a;
    --ok:#1f9d6b; --warn:#d99a00; --bad:#d14b4b; --sombra:0 1px 3px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:var(--pri);color:#fff;padding:12px 24px;border-bottom:3px solid var(--amarelo);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{opacity:.75;font-size:12px}
  header .esp{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--acc)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
  header .btn:hover{border-color:#fff}
  .usuario{font-size:13px;display:flex;gap:10px;align-items:center}
  .login{max-width:360px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--sombra)}
  .login h2{margin:0 0 2px}
  .login form{display:flex;flex-direction:column;gap:14px;margin:18px 0 10px}
  .login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
  .login input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  .login .btn{padding:11px;font-size:15px}
  .demo{background:var(--warn);color:#1b1b1b;font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px}
  .corpo{display:flex;align-items:stretch;min-height:calc(100vh - 71px)}
  main{flex:1;min-width:0;max-width:1320px;margin:0 auto;padding:20px 20px 48px}
  .btn-menu{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;line-height:1}
  .btn-menu:hover{border-color:#fff}
  aside#menu{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:14px 0 20px;position:sticky;top:0;align-self:flex-start;height:calc(100vh - 71px);overflow-y:auto;display:flex;flex-direction:column;transition:margin-left .18s ease}
  body.menu-fechado aside#menu{margin-left:-251px}
  .m-grupo{margin-bottom:6px}
  .m-cab{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--pri);padding:9px 18px;cursor:pointer;text-align:left}
  .m-cab .seta{margin-left:auto;font-size:10px;color:var(--mute);transition:transform .15s}
  .m-grupo.fechado > .m-cab .seta{transform:rotate(-90deg)}
  .m-grupo.fechado > .m-filhos{display:none}
  .m-sub > .m-cab{text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--ink);padding:7px 18px 7px 28px}
  .m-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:8px 18px 8px 40px;cursor:pointer;text-align:left;border-left:3px solid transparent}
  .m-item:hover{background:#f1f4f9}
  .m-item.ativo{background:#eef2f8;border-left-color:var(--amarelo);font-weight:700;color:var(--pri)}
  .m-item.off,.m-cab.off{color:#9aa2b1;cursor:default}
  .m-item.off:hover{background:none}
  .m-tag{margin-left:auto;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:#eef0f4;color:var(--mute);white-space:nowrap;text-transform:none;letter-spacing:0}
  .m-rodape{margin-top:auto;padding:16px 18px 0;border-top:1px solid var(--line)}
  .m-rodape .rot{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .m-rodape .logos{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .m-rodape img{display:block;width:auto}
  .veu{display:none}
  .rodape{position:relative;z-index:21;width:100%;box-sizing:border-box;background:var(--pri);color:#e6ebf3;font-size:12px;padding:10px 24px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;border-top:3px solid var(--amarelo)}
  .rodape b{color:#fff}
  @media (max-width:900px){
    aside#menu{position:fixed;top:71px;left:0;z-index:20;box-shadow:4px 0 18px rgba(20,30,50,.18)}
    body:not(.menu-fechado) .veu{display:block;position:fixed;inset:71px 0 0 0;background:rgba(10,20,40,.25);z-index:19}
  }

  /* Home */
  .grade-blocos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .bloco{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--sombra);cursor:pointer;transition:.15s}
  .bloco:hover{border-color:var(--acc);transform:translateY(-2px)}
  .bloco h3{margin:0 0 6px;font-size:16px}
  .bloco p{margin:0;color:var(--mute);font-size:13px;line-height:1.45}
  .bloco .tag{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#e8f1fd;color:var(--acc)}
  .bloco.off{opacity:.55;cursor:default}
  .bloco.off:hover{transform:none;border-color:var(--line)}
  .bloco.off .tag{background:#eef0f4;color:var(--mute)}

  /* Barra de filtros */
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .barra h2{margin:0;font-size:18px;margin-right:auto}
  .barra select,.barra input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .info{color:var(--mute);font-size:12px}
  .erro{background:#fdecec;border:1px solid #f3c2c2;color:#8a1f1f;padding:12px 14px;border-radius:10px;margin-bottom:16px}
  .aviso{background:#fff7e0;border:1px solid #f1dd9c;color:#6d5300;padding:10px 14px;border-radius:10px;font-size:13px}

  /* Cartões */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra)}
  .kpi .rot{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .det{color:var(--mute);font-size:12px;margin-top:2px}
  .kpi.destaque{border-left:4px solid var(--amarelo)}

  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media (max-width:900px){.grade2{grid-template-columns:1fr}}
  .painel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sombra);margin-bottom:16px;min-width:0}
  .grade2 .painel{margin-bottom:0}
  .painel h3{margin:0 0 4px;font-size:15px}
  .painel .leg{color:var(--mute);font-size:12px;margin-bottom:12px}

  /* Funil */
  .funil .linha{display:grid;grid-template-columns:170px 1fr 60px;align-items:center;gap:10px;margin:7px 0}
  .funil .trilho{background:#eef1f5;border-radius:6px;height:22px;overflow:hidden}
  .funil .enche{height:100%;border-radius:6px;background:var(--acc)}
  .funil .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .funil .pend .enche{background:var(--warn)}
  .funil .feito .enche{background:var(--ok)}

  /* Gráfico por hora */
  .horas{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:200px;align-items:end;position:relative;padding-top:18px}
  .hcol{display:flex;flex-direction:column-reverse;height:100%;position:relative}
  .hcol .seg{width:100%}
  .hcol .seg.p{background:var(--acc);border-radius:0 0 3px 3px}
  .hcol .seg.f{background:var(--full);border-radius:3px 3px 0 0}
  .hcol .seg.s{background:var(--acc);border-radius:3px}
  .hcol .seg.e{background:var(--ok);border-radius:3px}
  .hcol:hover{outline:1px solid var(--line);outline-offset:1px}
  .hcol.corte::after{content:"corte 11h";position:absolute;left:-2px;top:-18px;font-size:10px;color:var(--bad);white-space:nowrap;font-weight:600}
  .hcol.corte{border-left:2px dashed var(--bad);padding-left:1px}
  .eixo{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;font-size:10px;color:var(--mute);text-align:center;margin-top:4px}
  .duplas{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:160px;align-items:end;padding-top:18px}
  .duplas .hcol{flex-direction:row;align-items:flex-end;gap:1px}
  .duplas .hcol .seg{width:50%}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  /* Gráfico com drill-down */
  .trilha{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
  .trilha a{color:var(--acc);cursor:pointer;text-decoration:none}
  .trilha a:hover{text-decoration:underline}
  .trilha .sep{color:var(--mute)}
  .nivel{display:inline-flex;gap:6px}
  .nivel .btn{font-size:13px;padding:6px 10px}
  .btn:disabled{opacity:.45;cursor:default}
  .abas{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .abas button{border:0;background:#fff;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
  .abas button.on{background:var(--pri);color:#fff;box-shadow:inset 0 -3px 0 var(--amarelo)}
  .dgraf{display:grid;gap:2px;align-items:end;height:240px;padding-top:22px;border-bottom:1px solid var(--line)}
  .dcol{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;min-width:0}
  .dcol .bar{width:100%;max-width:56px;background:var(--serie);border-radius:4px 4px 0 0;min-height:0;transition:filter .1s;box-sizing:border-box}
  .dcol .bar.parcial,.dcol .seg.parcial{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 3px,transparent 3px 7px)}
  .dcol .pilha{width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .dcol .seg{width:100%;box-sizing:border-box;min-height:0}
  .dcol .seg + .seg{margin-top:2px}
  .dcol .seg:first-child{border-radius:4px 4px 0 0}
  .dcol:hover .seg{filter:brightness(.9)}
  .logo-topo{height:44px;width:auto;display:block}
  .chip-loja{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:4px solid;border-radius:8px;padding:4px 10px;background:#fff}
  .chip-loja img{height:22px;width:auto;display:block}
  .faixa-lojas{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:-4px 0 18px;color:var(--mute);font-size:12px}
  .faixa-lojas img{height:28px;width:auto;display:block}
  .dcol .bar.media{background:#b9c7da}
  .dcol:hover .bar{filter:brightness(.85)}
  .dcol.sel .bar,.dcol.sel .seg{filter:brightness(.6)}
  .dcol.nao{cursor:default}
  .dcol .aviso-barra{color:#b07a00;font-weight:700}
  .dcol .rotv{position:absolute;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .deixo{display:grid;gap:2px;font-size:11px;color:var(--mute);text-align:center;margin-top:4px}
  .deixo span{overflow:hidden;white-space:nowrap}
  .linha-media{position:relative}
  .dica{position:fixed;pointer-events:none;background:#1b2333;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:10;display:none;white-space:nowrap}

  /* Tabelas */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.tot td{font-weight:650;border-top:2px solid var(--line)}
  .vazio{color:var(--mute);font-size:13px;padding:12px 0}
  .carregando{color:var(--mute);padding:40px;text-align:center}

  /* Pessoas e acessos */
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e8eef7;color:var(--pri);margin:1px 4px 1px 0;white-space:nowrap;border:1px solid transparent}
  .pill.nao{background:#f3f4f6;color:var(--mute);text-decoration:line-through}
  .pill.exc{border-color:var(--amarelo);background:#fff8dc;color:#6d5300}
  tr.inativo td{color:var(--mute)}
  code{font-family:Consolas,monospace;font-size:12px;background:#f3f5f8;padding:1px 5px;border-radius:4px}
  .btn.mini{padding:4px 10px;font-size:12px}
  .form-pes{border-color:var(--pri);border-top:3px solid var(--amarelo)}
  .form-pes h4{margin:18px 0 2px;font-size:14px}
  .grade-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 18px;margin-top:12px}
  .grade-form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
  .grade-form input,.grade-form select,.campo,.perm select,td select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;min-width:0}
  .grade-form input:disabled{background:#f3f5f8}
  .campo{font-size:13px;padding:6px 9px}
  label.chk{flex-direction:row !important;align-items:center;gap:8px !important;color:var(--ink) !important;font-size:13px}
  label.chk input[type=checkbox]{width:auto !important;flex:none;margin:0}
  select.exc{border-color:var(--amarelo);background:#fff8dc}
  table.perm{max-width:760px}
  /* Envios Full */
  .st-full{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .kpi.alerta{border-left:4px solid var(--bad)} .kpi.alerta .val{color:var(--bad)}
  .tab-full tbody tr{cursor:pointer} .tab-full tbody tr:hover td{background:#f6f8fb} .tab-full tr.sel td{background:#fff8dc}
  .tab-full td{white-space:nowrap}
  .tab-full th,.tab-full td{text-align:center}
  .tab-full th.pct,.tab-full td.pct{text-align:right;width:118px}
  .pct-cel{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;width:100%}
  .pct-cel .mini-barra{margin:0;flex:0 0 46px} .pct-n{display:inline-block;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .tab-full tr.subtot td{background:#eef2f8;color:var(--pri);font-weight:700;border-bottom:2px solid var(--pri);font-variant-numeric:tabular-nums}
  .tab-full tr.subtot td:first-child{border-radius:8px 0 0 0} .tab-full tr.subtot td:nth-child(2){text-align:left}
  .tab-full tr.subtot small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
  .btn.imp{padding:3px 8px;font-size:14px;line-height:1}
  .tab-full th.chk,.tab-full td.chk{width:34px;padding-left:4px;padding-right:4px}
  .tab-full input[type=checkbox],.cf-chk{width:18px;height:18px;accent-color:var(--pri);cursor:pointer;vertical-align:middle}
  .tab-full tr.marcado td{background:#fff8dc} .card-full.marcado{background:#fffbea;outline:2px solid var(--amarelo)}
  .cf-chk{width:22px;height:22px;margin-right:2px}
  .barra-sel{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--pri);color:#fff;border-top:3px solid var(--amarelo);display:flex;align-items:center;gap:10px;padding:10px 24px;box-shadow:0 -4px 16px rgba(0,0,0,.18);flex-wrap:wrap}
  .barra-sel .bs-txt{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
  .barra-sel .bs-txt b{font-size:15px} .barra-sel .bs-aviso{color:#ffd96a}
  .barra-sel .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
  .barra-sel .btn.pri{background:var(--amarelo);color:#1b2333;border-color:var(--amarelo);font-weight:700;padding:9px 16px}
  body.com-barra-sel main{padding-bottom:120px}
  @media (max-width:560px){ .barra-sel{padding:10px 14px} .barra-sel .btn.pri{flex:1} }
  .chip-rom{font:inherit;font-size:11px;font-weight:700;color:#0b4fa8;background:#e3eefc;border:1px solid #b9d0f2;border-radius:20px;padding:1px 7px;margin-left:6px;cursor:pointer;white-space:nowrap}
  .chip-rom:hover{background:#d2e3fa}
  .foto-bts{display:flex;gap:8px;flex-wrap:wrap} .foto-bt{cursor:pointer;font-weight:600;border-radius:8px 0 0 8px} .foto-par{display:inline-flex} .foto-gal{cursor:pointer;border-radius:0 8px 8px 0;border-left:0;padding-left:10px;padding-right:10px}
  .rc-dois{display:flex;gap:18px;align-items:flex-end;margin:2px 0} .rc-dois div{display:flex;flex-direction:column} .rc-dois b{font-size:24px;line-height:1.1} .rc-dois small{font-size:11px;color:var(--mute)}
  .rc-tot{background:#f3f6fb}
  .grade-form .lab{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
  .ab-graf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px} @media (max-width:900px){ .ab-graf{grid-template-columns:1fr} }
  .ab-h{margin:0 0 8px;font-size:14px}
  .ab-bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0} .ab-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ab-bar i{display:block;height:9px;border-radius:5px;background:var(--pri)} .ab-bar b{text-align:right}
  .tab-ab{font-size:12.5px} .tab-ab th,.tab-ab td{padding-left:6px;padding-right:6px}
  .tab-ab tr.pend td{background:#fffbea} .ab-card{display:flex;flex-direction:column;gap:3px}
  .oo-inativos{margin:10px 0 4px;font-size:13px} .oo-inativos summary{cursor:pointer;color:var(--mute)} .oo-inativos > div{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .rc-col{display:block;font-size:10.5px;font-style:italic;color:var(--mute);font-weight:400;line-height:1.1}
  .leg-full b{color:var(--ink)} .leg-full .prev,.leg-full .dif{font-weight:600}
  .tag-jan{display:block;font-size:10.5px;font-weight:700;border-radius:10px;padding:0 6px;margin-top:2px;width:max-content;margin-left:auto;margin-right:auto} .tag-jan.fora{background:#fbe9e9;color:#8a1f1f} .tag-jan.antes{background:#e3eefc;color:#0b4fa8} .tag-jan.ok{background:#e2f5e8;color:#1a7a3e}
  .tab-rom tr.subtot td{background:#eef2f8;color:var(--pri);font-weight:700;border-bottom:2px solid var(--pri)} .tab-rom tr.subtot td:first-child{text-align:left} .tab-rom tr.subtot small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
  .cod-in{font-size:18px !important;font-weight:700;letter-spacing:1px}
  .cod-card{background:#fff8dc;border:1px solid #f1d98a;border-radius:6px;padding:0 6px}
  .avatar{border-radius:50%;object-fit:cover;flex:0 0 auto;vertical-align:middle;background:#e8eef7}
  .avatar.ini{display:inline-flex;align-items:center;justify-content:center;background:#f1c300;color:#02285a;font-weight:800}
  .usr-btn{font:inherit;color:inherit;background:none;border:0;display:inline-flex;gap:8px;align-items:center;cursor:pointer;padding:2px 6px;border-radius:20px} .usr-btn:hover{background:rgba(255,255,255,.12)}
  .nome-av{display:inline-flex;gap:8px;align-items:center}
  .oo-foto{position:relative;border:0;background:none;padding:0;margin-right:12px;cursor:pointer;flex:0 0 68px;width:68px;height:68px;display:inline-flex;align-items:center;justify-content:center} .oo-foto:disabled{cursor:default} .oo-foto span{position:absolute;right:-4px;bottom:-2px;background:#fff;border-radius:50%;font-size:13px;padding:2px;box-shadow:0 1px 3px rgba(0,0,0,.2)}

  <span>🔒 <b>Informação confidencial.</b> Uso exclusivo e interno do Grupo Valenro. É proibido copiar, fotografar, encaminhar ou divulgar estes dados sem autorização da Gerência de Operações.</span>
  <span id="rodape-acesso"></span>
</footer>

<script>
/* =================== CONFIGURAÇÃO =================== */
// Cole aqui o endereço do seu Worker (sem barra no final).
// Enquanto estiver vazio, o portal roda em modo demonstração.
// Endereço da Edge Function operacoes-api (sem barra no final), por exemplo:
// 'https://abcdefghijkl.supabase.co/functions/v1/operacoes-api'
const API_URL = 'https://tmfhizqwrznlqvdndeig.supabase.co/functions/v1/operacoes-api';
const ATUALIZA_MIN = 5;
/* ==================================================== */

const params = new URLSearchParams(location.search);
const DEMO = !API_URL || params.has('demo');

const ST = { 3:'Pagamento aprovado', 18:'Aguardando separação', 12:'Aguardando envio', 13:'Enviado', 15:'Entregue', 17:'Cancelado' };
const FUNIL = [
  { cods:[3],  rot:'Pagamento aprovado',   cls:'pend' },
  { cods:[18], rot:'Aguardando separação', cls:'pend' },
  { cods:[12], rot:'Aguardando envio',     cls:'pend' },
  { cods:[13], rot:'Enviado',              cls:'feito' },
  { cods:[15], rot:'Entregue',             cls:'feito' },
];
const PENDENTE = new Set([3, 18, 12]);
const CANCELADO = 17;
// Vazão: mudanças de status entre duas fotos consecutivas
const SEP_DE = new Set([3, 18]), SEP_PARA = new Set([12, 13, 15]);
const EXP_DE = new Set([3, 18, 12]), EXP_PARA = new Set([13, 15]);

const fmtN = n => (n ?? 0).toLocaleString('pt-BR');
const fmtR = n => (n ?? 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const fmtP = (a, b) => b ? (a / b * 100).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + '%' : '–';
const hojeBRT = () => new Date(Date.now() - 3*3600e3).toISOString().slice(0, 10);
const addDias = (d, n) => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const dataBR = d => d.split('-').reverse().join('/');
const horaBR = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const state = { view:'home', data:hojeBRT(), cnpj:'todos', cnpjs:[], timer:null };
const $app = document.getElementById('app');

/* =================== ACESSO À API (login via Supabase) =================== */
const SESSAO_KEY = 'valenro_sessao';
function lerSessao(){ try { return JSON.parse(localStorage.getItem(SESSAO_KEY) || 'null'); } catch(e) { return state._sessao || null; } }
function gravarSessao(s){ state._sessao = s; try { s ? localStorage.setItem(SESSAO_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSAO_KEY); } catch(e) {} }

class SemSessao extends Error {}

async function chamar(path, { metodo = 'GET', corpo, token } = {}){
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(API_URL + path, { method: metodo, headers, body: corpo ? JSON.stringify(corpo) : undefined });
  let j = null; try { j = await r.json(); } catch(e) {}
  return { r, j };
}

async function renovar(){
  const s = lerSessao(); if (!s?.refresh_token) return null;
  const { r, j } = await chamar('/refresh', { metodo:'POST', corpo:{ refresh_token: s.refresh_token } });
  if (!r.ok) { gravarSessao(null); return null; }
  gravarSessao(j); return j;
}

async function api(path, { metodo = 'GET', corpo } = {}){
  let s = lerSessao();
  if (!s) throw new SemSessao('Faça login');
  if (s.expires_at && s.expires_at * 1000 < Date.now() + 60e3) s = await renovar();
  if (!s) throw new SemSessao('Sessão expirada');
  let { r, j } = await chamar(path, { metodo, corpo, token: s.access_token });
  if (r.status === 401) {
    s = await renovar();
    if (!s) throw new SemSessao('Sessão expirada');
    ({ r, j } = await chamar(path, { metodo, corpo, token: s.access_token }));
  }
  if (r.status === 401) { gravarSessao(null); throw new SemSessao('Sessão expirada'); }
  if (!r.ok) throw new Error((j && j.error) || ('Erro ' + r.status));
  return j;
}

function telaLogin(msg){
  clearInterval(state.timer);
  document.getElementById('btn-home').hidden = true;
  const _m = document.getElementById('menu'); if (_m) _m.hidden = true;
  mostrarUsuario(null);
  $app.innerHTML = `
    <div class="login">
      <h2>Entrar</h2>
      <p class="info">Central de Operações · Valenro</p>
      ${msg ? `<div class="erro">${esc(msg)}</div>` : ''}
      <form id="f-login" autocomplete="on">
        <label>Usuário ou e-mail<input id="l-user" name="username" autocomplete="username" autocapitalize="none" required></label>
        <label>Senha ou PIN<input id="l-senha" name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn pri" type="submit" id="l-btn">Entrar</button>
      </form>
      <p class="info">Esqueceu a senha? Fale com a Gerência de Operações.</p>
    </div>`;
  const f = document.getElementById('f-login');
  document.getElementById('l-user').focus();
  f.onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('l-btn'); btn.disabled = true; btn.textContent = 'Entrando…';
    const { r, j } = await chamar('/login', { metodo:'POST', corpo:{ login: document.getElementById('l-user').value, senha: document.getElementById('l-senha').value } })
      .catch(() => ({ r:{ ok:false, status:0 }, j:{ error:'Sem conexão com o servidor' } }));
    if (!r.ok) return telaLogin((j && j.error) || 'Não foi possível entrar');
    gravarSessao(j);
    iniciar();
  };
}

function marcarRodape(u){
  const el = document.getElementById('rodape-acesso'); if (!el) return;
  el.textContent = u ? `Acesso de ${u.nome} em ${new Date().toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', dateStyle:'short', timeStyle:'short' })}` : '';
}
function mostrarUsuario(u){
  marcarRodape(u);
  const el = document.getElementById('usuario');
  if (!el) return;
  el.hidden = !u;
  if (u) el.innerHTML = `<button class="usr-btn" id="btn-perfil" title="Trocar minha foto">${avatar(u.nome, u.foto, 30)}<span>${esc(u.nome)}</span></button> <button class="btn" id="btn-sair">Sair</button>`;
  const bp = document.getElementById('btn-perfil'); if (bp) bp.onclick = minhaFoto;
  const b = document.getElementById('btn-sair');

/* =================== MODO DEMONSTRAÇÃO =================== */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PESO_HORA = [3,2,1,1,1,1,2,3,4,5,6,6,6,6,6,6,6,6,6,7,8,8,7,5];
function sorteiaHora(r){ const tot = PESO_HORA.reduce((a,b)=>a+b); let x = r()*tot; for (let h=0; h<24; h++){ x -= PESO_HORA[h]; if (x<0) return h; } return 23; }

function demoPedidos(c, d){
  const hoje = hojeBRT(), agora = new Date(Date.now()-3*3600e3).getUTCHours();
  const dias = d === hoje ? [0,1,2,3].map(i => addDias(hoje, -i)) : [d];
  const pedidos = []; let id = 17950000;
  for (const dia of dias){
    const r = rng(Number(dia.replaceAll('-','')));
    const n = 700 + Math.floor(r()*200);
    for (let i=0; i<n; i++){
      const h = sorteiaHora(r);
      if (dia === hoje && h > agora) continue;
      const ml = r() < .8, full = ml && r() < .6;
      const entrega = full ? 'Mercado Envios (Full)' : ml ? (r()<.65 ? 'Mercado Envios (Coleta)' : 'Mercado Envios (Flex)') : (r()<.85 ? 'Shopee Xpress' : 'Shopee Entrega Direta');
      let st;
      if (r() < .02) st = 17;
      else if (full) st = dia === hoje ? (r()<.7 ? 3 : 13) : 15;
      else if (dia !== hoje) st = r() < .9 ? (r()<.6 ? 15 : 13) : (r()<.5 ? 12 : 18);
      else { const idade = agora - h; st = idade < 1 ? 3 : idade < 3 ? (r()<.6 ? 18 : 12) : (h < 11 && agora >= 12 ? (r()<.85 ? 13 : 12) : (r()<.5 ? 12 : 18)); }
      pedidos.push({ id:id++, st, status:ST[st], canal: ml ? 'Mercado Livre' : 'Shopee', conta: ml ? 'MLB_DIGOS' : 'SHO_DIGOS', entrega, full,
        valor: Math.round((50 + r()*150)*100)/100, uf:'SP', dia, aprov: `${dia}T${String(h).padStart(2,'0')}:${String(Math.floor(r()*60)).padStart(2,'0')}`, nf:null });
    }
  }
  return Promise.resolve({ cnpj:c.id, nome:c.nome, ini:dias.at(-1), fim:dias[0], geradoEm:new Date().toISOString(), pedidos });
}
function demoVazao(c, d){
  const r = rng(7), agora = new Date(Date.now()-3*3600e3).getUTCHours(), horas = {};
  for (let h=7; h<=Math.min(agora,18); h++){
    horas[h] = { '18>12': 35 + Math.floor(r()*35), '3>18': 20 + Math.floor(r()*30) };
    if (h===11 || h===12 || h>=16) horas[h]['12>13'] = 60 + Math.floor(r()*80);
  }
  return Promise.resolve({ data:d, horas, coletas: 40 });
}

async function apiPessoas(path, corpo){
  if (!DEMO) return api(path, corpo ? { metodo:'POST', corpo } : {});
  const D = DEMO_PESSOAS, por = 'demonstracao';
  if (path === '/pessoas') return JSON.parse(JSON.stringify(D));
  if (path === '/pessoas/usuario') {
    const login = corpo.login.includes('@') ? corpo.login.toLowerCase() : `${corpo.login.toLowerCase()}@${D.dominio}`;
    const i = D.usuarios.findIndex(u => u.login === login);
    if (corpo.novo && i >= 0) throw new Error('Já existe um acesso com esse login. Use Editar.');
    if (corpo.novo && !corpo.senha) throw new Error('Defina a senha inicial');
    const novo = { login, nome:corpo.nome, perfil:corpo.perfil, ativo:corpo.ativo, permissoes:corpo.permissoes, colaborador_wms:corpo.colaborador_wms, ultimo_acesso:i >= 0 ? D.usuarios[i].ultimo_acesso : null, atualizado_por:por };
    D.historico.unshift({ em:new Date().toISOString(), por, acao: corpo.novo ? 'usuario.criar' : 'usuario.alterar', alvo:login, antes: i >= 0 ? D.usuarios[i] : null, depois:novo });
    if (corpo.senha && !corpo.novo) D.historico.unshift({ em:new Date().toISOString(), por, acao:'usuario.senha', alvo:login, antes:null, depois:{ senha:'redefinida' } });
    i >= 0 ? (D.usuarios[i] = novo) : D.usuarios.push(novo);
    return { ok:true };
  }
  if (path === '/pessoas/colaborador') {
    const c = D.colaboradores.find(x => x.usuario === corpo.usuario);
    D.historico.unshift({ em:new Date().toISOString(), por, acao:'colaborador.alterar', alvo:corpo.usuario, antes:{ funcao:c.funcao, obs:c.obs }, depois:{ funcao:corpo.funcao, obs:corpo.obs } });
    Object.assign(c, { funcao:corpo.funcao, obs:corpo.obs });
    return { ok:true };
  }
}

        if (!fun[y][x] && k < final.length * 8) { m[y][x] = ((final[k >>> 3] >>> (7 - (k & 7))) & 1) === 1; k++; } } }
    const MASK = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,

      for (let y = 0; y < n; y++) for (const lin of [0, 1]) { let run = 0, cor = null; for (let x = 0; x < n; x++) { const c = lin ? m[x][y] : m[y][x]; if (c === cor) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else { cor = c; run = 1; } } }

function apiRomDemo(path, corpo){

  if (path.startsWith('/full/romaneio/historico')) return { eventos: R.eventos.filter(e => e.romaneio_id === q.get('id')) };
  if (path === '/full/romaneio') {
    const ids = [...new Set(corpo.envio_ids)];

    if (outros.length) throw new Error('Já estão em outro romaneio: ' + outros.map(e => `${e.pedido} (${nRom(e.romaneio_id)})`).join(', '));
    const canc = ids.map(i => D.envios.find(e => e.id === i)).filter(e => e.status === 'cancelado');
    if (canc.length) throw new Error('Coleta cancelada não entra em romaneio: ' + canc.map(e => e.pedido).join(', '));
    const cab = { data:corpo.data, janela_ini:corpo.janela_ini || null, janela_fim:corpo.janela_fim || null, lacre:(corpo.lacre || '').trim().toUpperCase() || null, ml_coleta:(corpo.ml_coleta || '').replace(/\s+/g, '').toUpperCase() || null, motorista:caixaAltaTxt(corpo.motorista || '').trim() || null, motorista_tel:String(corpo.motorista_tel || '').replace(/\D/g, '') || null,

      veiculo:caixaAltaTxt(corpo.veiculo || '').trim() || null, responsavel:caixaAltaTxt(corpo.responsavel || '').trim() || null, observacao:corpo.observacao || null };
    let m = cab.motorista ? DEMO_CROSS.motoristas.find(x => x.nome === cab.motorista) : null;
    if (cab.motorista && !m) { m = { id:String(DEMO_CROSS.motoristas.length + 1), nome:cab.motorista, telefone:cab.motorista_tel, documento:null, veiculo:cab.veiculo, placa:cab.placa, transportadora:cab.transportadora, ativo:true }; DEMO_CROSS.motoristas.push(m); }
    cab.motorista_id = m?.id || null;
    let r;
    if (!corpo.id) { r = { id:String(++R.seq), status:'aberto', chegada_em:null, saida_em:null, criado_em:ag, criado_por:'demonstracao', envio_ids:[], ...cab }; R.romaneios.push(r); ev(r.id, 'criar', null, { ...cab, envio_ids:ids }); }

function diffItensDemo(a, b){

  ma.forEach((i, c) => { if (!mb.has(c)) L.push(`− ${r(i)}: ${paresIt(i)} pares`); });
  mb.forEach((n, c) => { const o = ma.get(c); if (!o) return; const nums = [...new Set([...Object.keys(o.q), ...Object.keys(n.q)])].sort((x, y) => x - y);

}

      acao(en, 'enviar', {}, vazias ? `Enviada para o gestor validar (${vazias} linha(s) sem quantidade foram tiradas)` : 'Enviada para o gestor validar'); };

// pop-up: cores (e produtos) do mesmo anúncio, para escolher quais entram na coleta
function escolherCores(mlb, opc, ja, atual, ok){
  if (document.querySelector('.pl-modal')) return;   // já está aberto (o change pode disparar duas vezes)
  const d = document.createElement('div'); d.className = 'pl-modal';
  const variosProd = new Set(opc.map(e => e.produto)).size > 1;
  d.innerHTML = `<div class="painel pl-cores"><h3>Quais cores entram na coleta?</h3><div class="info">Anúncio <b>${esc(mlb)}</b>${variosProd ? '' : ` · ${esc(opc[0].produto)}`}</div>
    <div class="pl-cores-l">${opc.map((e, k) => { const key = e.produto + '|' + e.cor, tem = ja.has(key) || key === atual;
      return `<label class="pl-cor-op ${tem ? 'ja' : ''}"><input type="checkbox" data-k="${k}" ${tem ? 'checked disabled' : ''}><span class="fx-ico">${ICO_FAIXA[e.faixa] || ''}</span>
        <span style="flex:1"><b>${esc(e.cor || '(sem cor)')}</b>${variosProd ? `<small>${esc(e.produto)}</small>` : ''}</span><small>${tem ? 'já na coleta' : e.vezes ? `usada ${e.vezes}x` : ''}</small></label>`; }).join('')}</div>
    <div class="gv-acoes"><button class="btn" data-todas>Marcar todas</button><span style="flex:1"></span><button class="btn" data-x>Só o produto</button><button class="btn pri" data-ok>Abrir linhas</button></div></div>`;
  document.body.appendChild(d);
  const caixas = [...d.querySelectorAll('input[data-k]:not(:disabled)')];
  const conta = () => { const n = caixas.filter(c => c.checked).length; d.querySelector('[data-ok]').textContent = n ? `Abrir ${n} linha(s)` : 'Abrir linhas'; };
  caixas.forEach(c => c.onchange = conta); caixas[0]?.focus();
  d.querySelector('[data-todas]').onclick = () => { const marcar = caixas.some(c => !c.checked); caixas.forEach(c => { c.checked = marcar; }); conta(); };
  const fim = sel => { d.remove(); document.removeEventListener('keydown', tecla); ok(sel); };
  const tecla = ev => { if (ev.key === 'Escape') fim([]); };
  document.addEventListener('keydown', tecla);
  d.querySelector('[data-x]').onclick = () => fim([]);
  d.onclick = ev => { if (ev.target === d) fim([]); };
  d.querySelector('[data-ok]').onclick = () => fim(caixas.filter(c => c.checked).map(c => opc[+c.dataset.k]));
}
function pedirComentario(titulo, rotulo, obrigatorio, ok){

// botão que pede um segundo clique para confirmar (sem diálogo do navegador)
function confirmaDupla(btn, txt){

  btn.dataset.conf = '1'; const orig = btn.textContent; btn.textContent = txt;

}

async function carregarTempos(){
  const s = state.full, h = hojeBRT(), ini = s.tPer === 'mes' ? h.slice(0, 8) + '01' : addDias(h, -Number(s.tPer) + 1);
  try { state.temposDados = await apiFull(`/full/produtividade?ini=${ini}&fim=${h}`); renderTempos(); }
  catch (e) { if (e instanceof SemSessao) throw e; const $t = document.getElementById('tempos'); if ($t) $t.innerHTML = `<div class="erro">${esc(e.message)}</div>`; }
}
function calcTempos(aps){
  const et = {}, pes = {}, porAlvo = {};
  let semHora = 0;
  aps.forEach(a => {
    const etapa = a.etapa || 'separacao', t = tempoColeta(a), n = a.coletadores.length;
    if (!t.min) { semHora++; return; }
    const padrao = etapa === 'carregamento' ? a.rom_pares : (a.pares_envio ?? a.pares_plan);
    const pares = Number(paresAp(a, padrao)) || 0;
    const x = et[etapa] ||= { aps:0, min:0, pmin:0, pares:0, pessoas:0, alvos:new Set() };
    x.aps++; x.min += t.min; x.pmin += t.min * n; x.pares += pares; x.pessoas += n; x.alvos.add(a.envio_id || 'r' + a.romaneio_id);
    const k = etapa + '|' + (a.envio_id || 'r' + a.romaneio_id); porAlvo[k] = (porAlvo[k] || 0) + t.min;
    a.coletadores.forEach(p => { const y = pes[p + '|' + etapa] ||= { pessoa:p, etapa, aps:0, min:0, pares:0 }; y.aps++; y.min += t.min; y.pares += pares / n; });
  });
  Object.entries(et).forEach(([k, x]) => { const v = Object.entries(porAlvo).filter(([a]) => a.startsWith(k + '|')).map(([, m]) => m); x.porPedido = v.reduce((a, b) => a + b, 0) / v.length; x.ritmo = x.pmin ? x.pares / (x.pmin / 60) : null; x.equipe = x.pessoas / x.aps; });
  return { et, pes: Object.values(pes), semHora };
}
function renderTempos(){
  const s = state.full, d = state.temposDados, $t = document.getElementById('tempos');
  if (!$t || !d) return;
  const { et, pes, semHora } = calcTempos(d.apontamentos);
  const ordem = Object.keys(ETAPAS_TRAB).filter(k => k !== 'etiquetagem' || et[k]);
  const lista = pes.filter(p => s.tEtapa === 'todas' || p.etapa === s.tEtapa)
    .sort((a, b) => ordem.indexOf(a.etapa) - ordem.indexOf(b.etapa) || nomeWms(a.pessoa).localeCompare(nomeWms(b.pessoa)));
  const tile = k => { const E = ETAPAS_TRAB[k], x = et[k];
    return `<button class="rr-tile tp-tile ${s.tEtapa === k ? 'on' : ''}" data-te="${k}" style="--c:${E.cor}"><span>${esc(E.rot)}${k === 'carregamento' ? ' <i class="info" style="font-style:normal;text-transform:none">por veículo</i>' : ''}</span>
      ${x ? `<b>${fmtN(Math.round(x.ritmo || 0))} <small style="font-size:12px;font-weight:400">pares/h por pessoa</small></b>
        <small>${x.aps} apontamento(s) · ${fmtDur(x.pmin)} pessoa · equipe média ${x.equipe.toLocaleString('pt-BR', { maximumFractionDigits:1 })}</small>
        <small>tempo médio por ${k === 'carregamento' ? 'veículo' : 'pedido'}: <b style="font-size:inherit">${fmtDur(x.porPedido)}</b></small>` : '<b>–</b><small>sem apontamento com horário no período</small>'}</button>`; };
  $t.innerHTML = `
    <div class="rr-res tp-res">${ordem.map(tile).join('')}</div>
    <div class="painel">
      <div class="abas tp-abas" style="margin-bottom:10px">${[['todas','Todas as etapas'], ...ordem.map(k => [k, ETAPAS_TRAB[k].rot])].map(([k, t]) => `<button data-te="${k}" class="${s.tEtapa === k ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>
      ${lista.length ? `<div style="overflow-x:auto"><table class="tab-full"><thead><tr><th style="text-align:left">Pessoa</th><th>Etapa</th><th>Apontamentos</th><th>Horas na etapa</th><th>Pares (parte da pessoa)</th><th>Pares/h</th><th>vs. média da etapa</th></tr></thead><tbody>
      ${lista.map(p => { const r = p.min ? p.pares / (p.min / 60) : null, m = et[p.etapa]?.ritmo, v = r && m ? r / m - 1 : null;
        return `<tr><td style="text-align:left"><b>${esc(nomeWms(p.pessoa))}</b></td><td><span class="st-full" style="color:${ETAPAS_TRAB[p.etapa].cor};background:#f3f5f8">${esc(ETAPAS_TRAB[p.etapa].rot)}</span></td>
          <td>${p.aps}</td><td>${fmtDur(p.min)}</td><td>${fmtN(Math.round(p.pares))}</td><td><b>${r ? fmtN(Math.round(r)) : '–'}</b></td>
          <td class="${v === null ? '' : v < -0.2 ? 'dif' : ''}">${v === null ? '–' : (v >= 0 ? '+' : '') + Math.round(v * 100) + '%'}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="vazio">Nenhum apontamento com horário no período. Os apontamentos são lançados na gaveta de cada envio (separação, conferência, etiquetagem) e no romaneio (carregamento).</div>'}
      <div class="info" style="margin-top:10px;line-height:1.5">
        <b>Como ler:</b> pares/h por pessoa = pares da etapa ÷ (horas × pessoas da equipe). Quem trabalhou em equipe recebe a parte dele (pares ÷ tamanho da equipe).
        Pares e caixas em branco na conferência e na etiquetagem contam o pedido inteiro; no carregamento, o romaneio inteiro.
        ${semHora ? `<br>${semHora} apontamento(s) sem horário ou ainda em andamento ficaram fora do cálculo.` : ''}
        <br>Não compare etapas entre si (conferir 1 par não é o mesmo esforço que separar 1 par) nem pessoas com poucos apontamentos: o mix de pedidos pesa muito. Use como conversa, não como ranking.</div>
    </div>`;
  $t.querySelectorAll('[data-te]').forEach(b => b.onclick = () => { s.tEtapa = s.tEtapa === b.dataset.te && b.classList.contains('tp-tile') ? 'todas' : b.dataset.te; renderTempos(); });
}

function calcResumoFull(){
  const s = state.full, d = state.resumoFull, ini = d._ini, fim = d._fim;

  const rot = k => s.rfGrao === 'ano' ? k : s.rfGrao === 'mes' ? `${MESES_CURTO[+k.slice(5, 7) - 1]}/${k.slice(2, 4)}` : `${k.slice(8)}/${k.slice(5, 7)}`;

  const chaves = []; for (let x = ini; x <= fim; x = addDias(x, 1)) { const k = chave(x); if (!chaves.includes(k)) chaves.push(k); }
  const novo = () => ({ ped:0, pares:0, pedPlano:0, plano:0, porLoja:Object.fromEntries(lojas.map(l => [l, { ped:0, pares:0 }])) });
  const B = Object.fromEntries(chaves.map(k => [k, novo()])), T = novo();
  env.forEach(e => { const b = B[chave(e.data_expedicao)]; if (!b) return;
    [b, T].forEach(x => { x.pedPlano++; x.plano += Number(e.pares_plan) || 0;
      if (e.status === 'expedido') { x.ped++; x.pares += Number(e.pares_envio ?? e.pares_plan) || 0; x.porLoja[e.cnpj_id].ped++; x.porLoja[e.cnpj_id].pares += Number(e.pares_envio ?? e.pares_plan) || 0; } }); });
  const planoExp = env.filter(e => e.status === 'expedido').reduce((t, e) => t + (Number(e.pares_plan) || 0), 0);
  return { lojas, linhas: chaves.map(k => ({ k, rot: rot(k), ...B[k] })), T, planoExp, abertos: env.filter(e => e.status !== 'expedido').length };
}
function graficoFull(linhas, met, tipo){
  const v = x => met === 'pares' ? x.pares : x.ped, vp = x => met === 'pares' ? x.plano : x.pedPlano;
  const max = Math.max(1, ...linhas.map(x => Math.max(v(x), vp(x)))), n = linhas.length, P = n <= 16 ? 56 : n <= 31 ? 34 : n <= 60 ? 20 : 14, W = Math.max(n * P, 300), H = 170, base = 140, alt = 125;
  const y = val => base - val / max * alt;
  let corpo = '';
  if (tipo === 'barra') corpo = linhas.map((x, i) => { const bw = Math.min(P - 6, 34), x0 = i * P + (P - bw) / 2;
    return `<rect x="${x0}" y="${y(vp(x))}" width="${bw}" height="${base - y(vp(x))}" fill="#dfe5ef"><title>${x.rot} · plano: ${fmtN(vp(x))}</title></rect>
      <rect x="${x0 + bw * 0.18}" y="${y(v(x))}" width="${bw * 0.64}" height="${base - y(v(x))}" fill="#02285a"><title>${x.rot} · expedido: ${fmtN(v(x))}</title></rect>
      ${v(x) && P >= 30 ? `<text x="${i * P + P / 2}" y="${y(Math.max(v(x), vp(x))) - 3}" text-anchor="middle" font-size="9" fill="#566074">${fmtN(v(x))}</text>` : ''}`; }).join('');
  else { const pts = f => linhas.map((x, i) => `${i * P + P / 2},${y(f(x))}`).join(' ');
    corpo = `<polyline points="${pts(vp)}" fill="none" stroke="#b9c3d3" stroke-width="2" stroke-dasharray="4 3"/><polyline points="${pts(v)}" fill="none" stroke="#02285a" stroke-width="2.5"/>
      ${linhas.map((x, i) => `<circle cx="${i * P + P / 2}" cy="${y(v(x))}" r="3" fill="#02285a"><title>${x.rot} · expedido: ${fmtN(v(x))} · plano: ${fmtN(vp(x))}</title></circle>${v(x) && P >= 30 ? `<text x="${i * P + P / 2}" y="${y(v(x)) - 6}" text-anchor="middle" font-size="9" fill="#566074">${fmtN(v(x))}</text>` : ''}`).join('')}`; }
  const passo = Math.ceil(n / Math.floor(W / 34));
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="rc-graf" role="img" aria-label="${met} por período">${corpo}
    <line x1="0" y1="${base + 0.5}" x2="${W}" y2="${base + 0.5}" stroke="#d5dae3"/>${linhas.map((x, i) => i % passo ? '' : `<text x="${i * P + P / 2}" y="${H - 14}" text-anchor="middle" font-size="9" fill="#8a93a5">${x.rot}</text>`).join('')}</svg>`;
}

function resumoColeta(cs){

  const pessoas = new Set(cs.flatMap(c => c.coletadores)).size;

const DIAS_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function periodoCross(op){

  $c.querySelectorAll('[data-cn]').forEach(b => b.onclick = () => { s.canal = s.canal === b.dataset.cn ? 'todos' : b.dataset.cn; renderCross(); });

}

// ---- pad de assinatura (dedo ou mouse)
function padAssinatura(canvas){
  const ctx = canvas.getContext('2d'); let des = false, tinta = false, ult = null;
  const ajustar = () => { const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; tinta = false; };
  const pos = ev => { const r = canvas.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  canvas.addEventListener('pointerdown', ev => { ev.preventDefault(); canvas.setPointerCapture(ev.pointerId); des = true; ult = pos(ev); ctx.beginPath(); ctx.arc(ult[0], ult[1], 1.2, 0, 7); ctx.fill(); tinta = true; canvas.dispatchEvent(new Event('tinta')); });
  canvas.addEventListener('pointermove', ev => { if (!des) return; ev.preventDefault(); const p = pos(ev); ctx.beginPath(); ctx.moveTo(ult[0], ult[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ult = p; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { des = false; }));
  ajustar();
  return {
    limpar(){ ctx.clearRect(0, 0, canvas.width, canvas.height); tinta = false; canvas.dispatchEvent(new Event('tinta')); },
    temTinta: () => tinta,
    // PNG pequeno (600x200, fundo branco) para guardar
    png(){ const o = document.createElement('canvas'); o.width = 600; o.height = 200; const c2 = o.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, 600, 200);
      c2.drawImage(canvas, 0, 0, 600, 200); return o.toDataURL('image/png'); },
  };
}

const FOTO_TIPOS = {
  comprovante: { rot:'App do motorista', ico:'📱', dica:'tela do app com a quantidade de volumes coletados' },
  veiculo:     { rot:'Veículo carregado', ico:'🚚', dica:'veículo com a carga e a placa visível' },
  lacre:       { rot:'Lacre', ico:'🔒', dica:'lacre fechado, com o número legível' },
  carga:       { rot:'Carga / palete', ico:'📦', dica:'palete, caixas, avaria' },
  outra:       { rot:'Outra', ico:'📷', dica:'' },

const DEMO_FOTOS = {};   // demonstração: fotos só na memória do navegador
// reduz a foto do celular (12 MP, 4 MB) para ~1600 px em JPEG: sobe rápido no 4G e ocupa pouco espaço
// Carimbo: faixa no rodapé, abaixo da imagem (não cobre nada da foto), com hora, coleta, quem tirou e GPS
const horaCarimbo = ms => new Date(ms).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }).replace(',', '');
function linhasCarimbo(m){
  const gps = m.lat !== undefined && m.lat !== null ? `GPS ${m.lat.toFixed(5)}, ${m.lng.toFixed(5)} (±${m.precisao} m)` : 'GPS indisponível';
  return m.origem === 'galeria'
    ? [`GALERIA · arquivo de ${horaCarimbo(Date.parse(m.tirada_em))} · ${m.contexto}`, `Enviada em ${horaCarimbo(m.agora)} · ${gps} no envio · ${m.quem} · Valenro`]
    : [`${horaCarimbo(Date.parse(m.tirada_em))} · ${m.contexto}`, `${gps} · ${m.quem} · Valenro`];
}
let _geo = { pos:null, em:0, prom:null };
function pedirGeo(){   // pede a localização uma vez e guarda por 2 minutos; nunca trava a foto
  if (!navigator.geolocation) return Promise.resolve(null);
  if (_geo.pos && Date.now() - _geo.em < 120e3) return Promise.resolve(_geo.pos);
  return _geo.prom ||= new Promise(res => navigator.geolocation.getCurrentPosition(
    p => { _geo = { pos:{ lat:p.coords.latitude, lng:p.coords.longitude, precisao:Math.round(p.coords.accuracy) }, em:Date.now(), prom:null }; res(_geo.pos); },
    () => { _geo.prom = null; res(null); }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }));
}
const comPrazo = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
async function comprimirFoto(arq, carimbo){
  try {
    const img = await createImageBitmap(arq);
    const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    const w = Math.round(img.width * k), h = Math.round(img.height * k), linhas = carimbo ? linhasCarimbo(carimbo) : [];
    const fs = Math.max(13, Math.round(w * 0.024)), lh = Math.round(fs * 1.4), faixa = linhas.length ? linhas.length * lh + Math.round(fs * 0.8) : 0;
    cv.width = w; cv.height = h + faixa;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    if (faixa) {
      ctx.fillStyle = '#02285a'; ctx.fillRect(0, h, w, faixa);
      ctx.fillStyle = '#ffd200'; ctx.fillRect(0, h, w, Math.max(2, Math.round(fs * 0.15)));
      linhas.forEach((t, i) => {
        let tam = i ? Math.round(fs * 0.9) : fs;
        const fonte = () => `${i ? '' : 'bold '}${tam}px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif`;
        ctx.font = fonte(); while (tam > 9 && ctx.measureText(t).width > w - fs) { tam--; ctx.font = fonte(); }
        ctx.fillStyle = i ? '#ffffff' : (carimbo.origem === 'galeria' ? '#ff9b6b' : '#ffd200');
        ctx.textBaseline = 'middle'; ctx.fillText(t, Math.round(fs * 0.5), h + Math.round(fs * 0.4) + lh * i + lh / 2);
      });
    }
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    if (blob) return new File([blob], 'foto.jpg', { type:'image/jpeg' });
  } catch (_) {}
  if (['image/jpeg', 'image/png', 'image/webp'].includes(arq.type)) return arq;
  throw new Error('Não consegui ler essa imagem. Tente tirar a foto pela câmera do portal.');
}
async function apiFotos(path, corpo){
  if (!DEMO) return path === '/foto' ? enviarArquivoPortal(corpo, '/foto') : api(path, corpo ? { metodo:'POST', corpo } : {});
  const q = new URLSearchParams(path.split('?')[1] || '');
  if (path.startsWith('/fotos?')) return { fotos: JSON.parse(JSON.stringify(DEMO_FOTOS[q.get('alvo') + '|' + q.get('id')] || [])) };
  if (path === '/foto') { const k = corpo.get('alvo') + '|' + corpo.get('alvo_id'), L = DEMO_FOTOS[k] ||= [];
    const n = k => corpo.get(k) === null ? null : Number(corpo.get(k));
    L.push({ id:String(Date.now() + Math.random()), tipo:corpo.get('tipo'), legenda:corpo.get('legenda') || null, url:URL.createObjectURL(corpo.get('arquivo')), criado_em:new Date().toISOString(), criado_por:'demonstracao', tamanho:corpo.get('arquivo').size,
      origem:corpo.get('origem'), tirada_em:corpo.get('tirada_em'), relogio_desvio_s: corpo.get('relogio') ? Math.round((Date.now() - n('relogio')) / 1000) : null, lat:n('lat'), lng:n('lng'), precisao_m:n('precisao') }); return { ok:true }; }
  if (path === '/foto/excluir') { Object.values(DEMO_FOTOS).forEach(L => { const i = L.findIndex(f => f.id === corpo.id); if (i >= 0) L.splice(i, 1); }); return { ok:true }; }
}
// Bloco de fotos dentro de uma gaveta. Coleta ainda não salva (id null): as fotos ficam na fila e sobem ao salvar.
// Retorna { pendentes(), enviarPendentes(id) }.
function blocoFotos(el, { alvo, id, tela, tipos = ['comprovante', 'veiculo', 'outra'], editar, contexto = () => '' }){
  const fila = [];   // { arquivo, tipo, url }
  let fotos = [];
  const eu = state.usuario?.login || 'demonstracao', gerir = pode(tela, 'gerir');
  const podeTirar = f => editar && (gerir || (f.criado_por === eu && Date.now() - new Date(f.criado_em) < 24 * 3600e3));
  const desenha = () => {
    const todas = fotos.map(f => ({ ...f, salva:true })).concat(fila.map((f, i) => ({ ...f, fila:i })));
    el.innerHTML = `
      ${editar ? `<div class="foto-bts">${tipos.map(t => `<span class="foto-par"><label class="btn foto-bt" title="Abrir a câmera"><input type="file" accept="image/*" capture="environment" hidden data-ft="${t}" data-orig="camera">${FOTO_TIPOS[t].ico} ${esc(FOTO_TIPOS[t].rot)}</label><label class="btn foto-gal" title="Escolher da galeria (várias)"><input type="file" accept="image/*" multiple hidden data-ft="${t}" data-orig="galeria">🖼</label></span>`).join('')}</div>
        <div class="info" style="margin:4px 0 8px">${tipos.filter(t => FOTO_TIPOS[t].dica).map(t => `${FOTO_TIPOS[t].ico} ${FOTO_TIPOS[t].dica}`).join(' · ')}. Toque no botão para abrir a câmera; 🖼 escolhe da galeria (várias de uma vez, mas a foto fica marcada como ⚠ galeria). A foto sai com rodapé de data, hora e localização.</div>` : ''}
      ${todas.length ? `<div class="fotos">${todas.map(f => `<figure class="foto ${f.salva ? '' : 'na-fila'}">
          <img src="${esc(f.url || '')}" alt="${esc(FOTO_TIPOS[f.tipo]?.rot || 'foto')}" data-ver="${f.salva ? f.id : 'f' + f.fila}" loading="lazy">
          <figcaption>${FOTO_TIPOS[f.tipo]?.ico || ''} ${esc(FOTO_TIPOS[f.tipo]?.rot || '')}${f.salva ? `<small>${diaHora(f.criado_em)}${f.lat != null ? ` <a href="https://www.google.com/maps?q=${f.lat},${f.lng}" target="_blank" rel="noopener" title="Onde a foto foi tirada (±${f.precisao_m} m)">📍</a>` : ''}</small>` : '<small>sobe ao salvar</small>'}
            ${alertasFoto(f).map(a => `<small class="foto-alerta">⚠ ${esc(a)}</small>`).join('')}</figcaption>
          ${(f.salva ? podeTirar(f) : true) && editar ? `<button type="button" class="foto-x" data-fx="${f.salva ? f.id : 'f' + f.fila}" aria-label="Excluir foto">×</button>` : ''}</figure>`).join('')}</div>`
        : `<div class="info">${editar ? 'Nenhuma foto ainda.' : 'Sem fotos.'}</div>`}`;
    el.querySelectorAll('.foto-bt, .foto-gal').forEach(l => l.addEventListener('click', () => { pedirGeo(); }));   // já vai buscando o GPS enquanto a câmera abre
    el.querySelectorAll('[data-ft]').forEach(inp => inp.onchange = async () => {
      const arqs = [...inp.files]; inp.value = ''; if (!arqs.length) return;
      const geo = await comPrazo(pedirGeo(), 4000);
      for (const a of arqs) {
        try {
          const agora = Date.now();
          // no computador o botão da câmera abre o explorador de arquivos: arquivo antigo conta como galeria
          const origem = inp.dataset.orig === 'camera' && (!a.lastModified || Math.abs(agora - a.lastModified) < 5 * 60e3) ? 'camera' : 'galeria';
          const meta = { origem, tirada_em: new Date(origem === 'galeria' && a.lastModified ? a.lastModified : agora).toISOString(), agora,
            contexto: contexto() || '', quem: state.usuario?.nome || 'Demonstração', ...(geo || {}) };

      }

    });
    el.querySelectorAll('[data-ver]').forEach(img => img.onclick = () => verFoto(img.src, img.alt));

      if (b.dataset.conf !== '1') { b.dataset.conf = '1'; b.textContent = 'excluir?'; b.classList.add('conf'); return; }

    });
  };
  const carregar = async () => {
    if (!id) return desenha();
    try { fotos = (await apiFotos(`/fotos?alvo=${alvo}&id=${id}`)).fotos; desenha(); }
    catch (e) { if (e instanceof SemSessao) throw e; el.innerHTML = `<div class="erro">${esc(e.message)}</div>`; }
  };
  el.innerHTML = '<div class="info">Carregando fotos…</div>';
  carregar();
  return {
    pendentes: () => fila.length,
    async enviarPendentes(novoId){
      let ok = 0;
      for (const f of fila) {
        try { await apiFotos('/foto', dadosFoto(alvo, novoId, f.tipo, f.arquivo, f.meta)); ok++; } catch (e) { if (e instanceof SemSessao) throw e; avisar(`Foto não enviada: ${e.message}`, true); }

  };
}

async function apiMkt(path, corpo){
  if (!DEMO) return api(path, corpo ? { metodo:'POST', corpo } : {});
  if (path === '/marketplaces') return { marketplaces: CANAIS_DEMO.map(c => ({ ...c, n_coletas: DEMO_CROSS.coletas.filter(x => x.canal_id === c.id).length, ultima: DEMO_CROSS.coletas.filter(x => x.canal_id === c.id).map(x => x.data).sort().at(-1) || null })),
    lojas: [{ id:'DIGOS', nome:'Digos' }, { id:'CACAL', nome:'Cacal' }, { id:'DROSA', nome:"D'Rosa" }] };
  if (path === '/marketplace') {
    const nome = String(corpo.nome || '').trim(); if (!nome) throw new Error('Informe o nome do marketplace');
    if (!corpo.lojas?.length) throw new Error('Marque ao menos uma loja que vende neste marketplace');
    if (CANAIS_DEMO.some(c => c.nome.toLowerCase() === nome.toLowerCase() && c.id !== corpo.id)) throw new Error('Já existe um marketplace com esse nome');
    if (corpo.id) Object.assign(CANAIS_DEMO.find(c => c.id === corpo.id), { nome, lojas:corpo.lojas, campos:corpo.campos || [], ordem:Number(corpo.ordem) || 100, ativo:corpo.ativo !== false });
    else CANAIS_DEMO.push({ id:nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_'), nome, lojas:corpo.lojas, ordem:Number(corpo.ordem) || 100, ativo:corpo.ativo !== false });
    CANAIS_DEMO.sort((a, b) => (a.ordem ?? 100) - (b.ordem ?? 100));
    return { ok:true };
  }
  if (path === '/marketplace/excluir') { const n = DEMO_CROSS.coletas.filter(x => x.canal_id === corpo.id).length, c = CANAIS_DEMO.find(x => x.id === corpo.id);
    if (n) throw new Error(`${c.nome} já tem ${n} coleta(s) no histórico: desative em vez de excluir`); CANAIS_DEMO.splice(CANAIS_DEMO.indexOf(c), 1); return { ok:true }; }
}

// recorta no centro (quadrado) e reduz: ~20-40 KB, guardado no banco
async function fotoQuadrada(arq, tam = 320){
  const img = await createImageBitmap(arq).catch(() => null);
  if (!img) throw new Error('Não consegui ler essa imagem');
  const lado = Math.min(img.width, img.height), cv = document.createElement('canvas'); cv.width = cv.height = tam;
  cv.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, tam, tam);
  let q = 0.85, url = cv.toDataURL('image/jpeg', q);
  while (url.length > 110000 && q > 0.4) { q -= 0.1; url = cv.toDataURL('image/jpeg', q); }
  return url;
}
// miniatura (64 px, ~3 KB) para as listas; gerada a partir da foto já recortada
async function miniDe(foto){
  if (!foto) return null;
  const img = new Image(); img.src = foto; await img.decode().catch(() => null);
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; cv.getContext('2d').drawImage(img, 0, 0, 64, 64);
  return cv.toDataURL('image/jpeg', 0.8);
}

async function apiOO(path, corpo){
  if (!DEMO) return api(path, corpo ? { metodo:'POST', corpo } : {});
  const D = DEMO_OO, h = hojeBRT(), q = new URLSearchParams(path.split('?')[1] || '');
  const clone = x => JSON.parse(JSON.stringify(x));
  const resumoConv = c => { const ps = D.pontos.filter(p => p.conversa_id === c.id), ms = D.metas.filter(m => m.conversa_id === c.id && m.status !== 'cancelada'), as = D.acomps.filter(a => a.conversa_id === c.id).sort((a, b) => b.data.localeCompare(a.data));
    const abertas = ms.filter(m => ['nao_iniciada', 'em_andamento'].includes(m.status) && m.prazo).map(m => m.prazo).sort();
    return { ...c, n_pontos: ps.filter(p => p.bloco !== 'visao_lider').length, n_visao: ps.filter(p => p.bloco === 'visao_lider').length, n_metas: ms.length, n_metas_ok: ms.filter(m => m.status === 'concluida').length,
      prazo_proximo: abertas[0] || null, n_acomp: as.length, ultimo_acomp: as[0]?.data || null, proximo_acomp: as[0]?.proximo || null }; };
  if (path.startsWith('/oo/conversa')) {
    const c = D.conversas.find(x => x.rodada_id === q.get('rodada') && x.pessoa_id === q.get('pessoa'));
    const arquivos = clone(D.arquivos.filter(a => a.pessoa_id === q.get('pessoa')));
    const foto = D.pessoas.find(x => x.id === q.get('pessoa'))?.foto || null;
    if (!c) return { conversa:null, pontos:[], metas:[], acomps:[], arquivos, foto };
    return { foto, ...clone({ conversa:c, pontos:D.pontos.filter(p => p.conversa_id === c.id), metas:D.metas.filter(m => m.conversa_id === c.id), acomps:D.acomps.filter(a => a.conversa_id === c.id).sort((a, b) => b.data.localeCompare(a.data)) }), arquivos };
  }
  if (path.startsWith('/oo/compilado')) {
    const convs = D.conversas.filter(c => c.rodada_id === q.get('rodada'));
    return clone({ pontos: D.pontos.filter(p => convs.some(c => c.id === p.conversa_id)).map(p => { const c = convs.find(x => x.id === p.conversa_id), pe = D.pessoas.find(x => x.id === c.pessoa_id); return { ...p, pessoa_id:pe.id, nome:pe.nome, funcao:pe.funcao }; }),
      temas: [...new Set(D.pontos.map(p => p.tema).filter(Boolean))].sort() });
  }
  if (path.startsWith('/oo?') || path === '/oo') {
    const rid = q.get('rodada') || D.rodadas.find(r => r.ativa)?.id || D.rodadas[0]?.id;
    D.pessoas.forEach(p => { p.n_arquivos = D.arquivos.filter(a => a.pessoa_id === p.id).length; });
    D.pessoas.forEach(p => { p.avaliacoes = p.usuario_login ? demoAvaliacoesDe(p.usuario_login) : undefined; });
    return clone({ rodada:rid, rodadas:D.rodadas, areas:D.areas, setores:D.setores, pessoas:D.pessoas, usuarios:[...DEMO_PESSOAS.usuarios.filter(u => u.ativo).map(u => ({ login:u.login, nome:u.nome })), ...DEMO_USU_EXTRA], conversas:D.conversas.filter(c => c.rodada_id === rid).map(resumoConv), nivel:'gerir', hoje:h });
  }
  if (path.startsWith('/oo/arquivo?')) { const a = D.arquivos.find(x => x.id === q.get('id')); return { url: a._url || 'about:blank', nome: a.nome }; }
  if (path === '/oo/foto') { const pp = D.pessoas.find(x => x.id === String(corpo.pessoa_id)); sincronizarFotoDemo(pp.usuario_login, pp.id, corpo.foto, corpo.foto_mini); return { ok:true }; }
  if (path === '/oo/vincular') { const pp = D.pessoas.find(x => x.id === String(corpo.pessoa_id)), u = corpo.login ? DEMO_PESSOAS.usuarios.find(x => x.login === corpo.login) : null;
    if (u && D.pessoas.some(x => x.usuario_login === u.login && x.id !== pp.id)) throw new Error('Esse usuário já está ligado a outra pessoa');
    pp.usuario_login = u ? u.login : null;
    if (u && !pp.foto && u.foto) { pp.foto = u.foto; pp.foto_mini = u.foto_mini; } else if (u && pp.foto && !u.foto) { u.foto = pp.foto; u.foto_mini = pp.foto_mini; }
    return { ok:true }; }
  if (path === '/oo/arquivo') { const f = corpo.get('arquivo'), id = String(++D.seq);
    D.arquivos.unshift({ id, pessoa_id:String(corpo.get('pessoa_id')), nome:f.name, descricao:corpo.get('descricao') || null, tipo:f.type, tamanho:f.size, enviado_em:new Date().toISOString(), enviado_por:'demonstracao', _url:URL.createObjectURL(f) }); return { ok:true, id }; }
  const tab = { pessoa:'pessoas', rodada:'rodadas', conversa:'conversas', ponto:'pontos', meta:'metas', acomp:'acomps', area:'areas', setor:'setores', arquivo:'arquivos' }[corpo.registro];
  if (path === '/oo/excluir') { D[tab] = D[tab].filter(x => x.id !== String(corpo.id)); return { ok:true }; }
  if (path === '/oo/salvar') {

    ['rodada_id', 'pessoa_id', 'conversa_id', 'area_id', 'setor_id'].forEach(k => { if (k in dados && dados[k] !== null) dados[k] = String(dados[k]); });

    const id = String(++D.seq); D[tab].push({ id, fechar:{}, ativo:true, ativa:true, acao_rapida:false, status:'nao_iniciada', ...(corpo.registro === 'meta' ? { tipo:'comportamento' } : {}), ...dados }); return { ok:true, id };
  }
}

function renderAgendaOO($o){
  const r = state.ooDados, hoje = r.hoje || hojeBRT(), itens = [];
  r.conversas.forEach(c => {
    const p = r.pessoas.find(x => String(x.id) === String(c.pessoa_id)); if (!p) return;
    if (c.conversa_em && c.conversa_em >= hoje && !c.n_pontos) itens.push({ d:c.conversa_em, p, o:'Conversa da etapa 1' });
    if (c.proximo_acomp) itens.push({ d:c.proximo_acomp, p, o:'Acompanhamento do PDI' });
    if (c.prazo_proximo) itens.push({ d:c.prazo_proximo, p, o:'Prazo de meta do PDI' });
    if (c.recebido_em && !c.conversa_em) itens.push({ d:null, p, o:'Recebeu a folha e ainda não tem conversa marcada' });
  });
  r.pessoas.filter(p => p.ativo && !r.conversas.some(c => String(c.pessoa_id) === String(p.id))).forEach(p => itens.push({ d:null, p, o:'Ainda não recebeu a folha' }));
  if (vePessoalOO()) r.pessoas.filter(p => p.ativo && p.nascimento).forEach(p => { const a = aniversarioOO(p.nascimento, hoje); if (a.dias <= 30) itens.push({ d:a.data, p, o:`🎂 Aniversário · ${a.idade} anos` }); });
  for (let i = itens.length - 1; i >= 0; i--) if (!filtraPessoaOO(itens[i].p)) itens.splice(i, 1);

  if (vePessoalOO()) $o.querySelectorAll('[data-pes]').forEach(el => el.onclick = () => abrirPessoaOO(el.dataset.pes));
}

  const fechar = () => { g.hidden = true; g.innerHTML = ''; document.body.classList.remove('gaveta-aberta'); };
  document.getElementById('gv-fechar').onclick = fechar; document.getElementById('gv-fundo').onclick = fechar;

    const datas = { recebido_em: document.getElementById('pi-rec').value || null, conversa_em: document.getElementById('pi-conv').value || null };
    imprimirHtml(folhaPreparacaoHtml(p, datas));
    const sv = document.getElementById('pi-salvar');
    if (sv && sv.checked && (datas.recebido_em !== (conv?.recebido_em || null) || datas.conversa_em !== (conv?.conversa_em || null))) {
      try { await apiOO('/oo/salvar', conv?.id ? { registro:'conversa', id:conv.id, ...datas } : { registro:'conversa', rodada_id:state.oo.rodada, pessoa_id:p.id, ...datas }); await carregarOO(); }
      catch (e) { if (e instanceof SemSessao) throw e; avisar(e.message, true); }
    }
    fechar();
  };
}

// sugere o usuário do portal com o mesmo nome (ex.: "Guilherme Porto" dentro de "Guilherme Lucio Porto da Silva")
function sugerirUsuarioOO(p, usuarios){
  const pal = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/\s+/).filter(w => w.length > 2);
  const pp = pal(p.nome);
  return usuarios.find(u => { const up = pal(u.nome); return up.length && pp.length && up[0] === pp[0] && (up.every(w => pp.includes(w)) || pp.every(w => up.includes(w))); }) || null;
}

const TELA_DA_VIEW = { separados:'produtividade', pessoas:'pessoas', volume:'produtividade', full:'full', cross:'cross', oo:'oo', motoristas:'motoristas', marketplaces:'cross', abandono:'abandono', ponto:'ponto' };

const podeAbrir = tela => pode(tela, NIVEL_MIN_TELA[tela] || 'ver');
const viewLiberada = v => !TELA_DA_VIEW[v] || podeAbrir(TELA_DA_VIEW[v]);
const PREF_KEY = 'valenro_menu';
function lerPref(){ try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch(e) { return state._pref || {}; } }
function gravarPref(p){ state._pref = p; try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch(e) {} }
const telaPequena = () => matchMedia('(max-width:900px)').matches;

function renderMenu(){
  const $m = document.getElementById('menu');
  if (!$m) return;
  const pref = lerPref(), fechados = pref.fechados || [];
  const item = it => {
    const ativo = it.view && (it.view === state.view);
    if (it.soDemo && !DEMO) return '';
    if (it.tela && !podeAbrir(it.tela)) return '';
    const ok = !!it.view;
    return `<button class="m-item ${ativo ? 'ativo' : ''} ${ok ? '' : 'off'}" ${ok ? `data-view="${it.view}"` : 'disabled'}>${esc(it.titulo)}${!ok && it.tag ? `<span class="m-tag">${esc(it.tag)}</span>` : ''}</button>`;
  };
  const grupo = (g, sub) => {
    const vazio = !g.filhos.length;
    const visivel = f => f.filhos ? (f.tag || f.filhos.some(visivel)) : (!f.tela || podeAbrir(f.tela)) && (!f.soDemo || DEMO);
    if (!g.tag && !g.filhos.some(visivel)) return '';
    return `<div class="m-grupo ${sub ? 'm-sub' : ''} ${fechados.includes(g.id) ? 'fechado' : ''}" data-grupo="${g.id}">
      <button class="m-cab ${vazio ? 'off' : ''}" ${vazio ? 'disabled' : `data-alterna="${g.id}"`}>${esc(g.titulo)}${g.tag ? `<span class="m-tag">${esc(g.tag)}</span>` : `<span class="seta">▼</span>`}</button>
      <div class="m-filhos">${g.filhos.map(f => f.filhos ? grupo(f, true) : item(f)).join('')}</div>
    </div>`;
  };
  $m.innerHTML = MENU.map(g => grupo(g, false)).join('');
  $m.hidden = false;
  $m.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { irPara(el.dataset.view); if (telaPequena()) alternarMenu(false); });
  $m.querySelectorAll('[data-alterna]').forEach(el => el.onclick = () => {
    const id = el.dataset.alterna, p = lerPref(), f = new Set(p.fechados || []);
    f.has(id) ? f.delete(id) : f.add(id); p.fechados = [...f]; gravarPref(p); renderMenu();
  });
}
function alternarMenu(abrir){
  const fechar = abrir === undefined ? !document.body.classList.contains('menu-fechado') : !abrir;
  document.body.classList.toggle('menu-fechado', fechar);
  if (!telaPequena()) { const p = lerPref(); p.oculto = fechar; gravarPref(p); }
}
document.getElementById('btn-menu').onclick = () => alternarMenu();
document.getElementById('veu').onclick = () => alternarMenu(false);
if (telaPequena() || lerPref().oculto) document.body.classList.add('menu-fechado');

function irPara(view){
  if (!['separados', 'volume', 'pessoas', 'full', 'cross', 'oo', 'motoristas', 'marketplaces', 'abandono', 'ponto', 'testes', 'impressos'].includes(view) || (view === 'volume' && !DEMO)) view = 'separados';   // "prod" foi unificado em "separados"
  if (!viewLiberada(view)) view = ['separados', 'full', 'cross', 'oo', 'pessoas'].find(viewLiberada) || 'nada';
  document.body.classList.remove('gaveta-aberta');
  state.view = view;
  clearInterval(state.timer);
  renderMenu();
  if (view === 'nada') { $app.innerHTML = `<div class="painel"><h3>Bem-vindo(a)</h3><p class="info">Seu acesso ainda não tem telas liberadas. Fale com a Gerência de Operações.</p></div>`; return; }
  if (view === 'pessoas') return telaPessoas();
  if (view === 'full') return telaFull();
  if (view === 'cross') return telaCross();
  if (view === 'oo') return telaOO();
  if (view === 'motoristas') return telaMotoristas();
  if (view === 'marketplaces') return telaMarketplaces();
  if (view === 'abandono') return telaAbandono();
  if (view === 'ponto') return telaPonto();
  if (view === 'testes') return telaTestes();
  if (view === 'impressos') return telaImpressos();
  if (view === 'prod') return telaProd();
  if (view === 'separados') { telaSep(); state.timer = setInterval(() => carregarSep(true), 15*60e3); return; }
  if (view === 'volume') { telaVolume(); state.timer = setInterval(() => { if (state.data === hojeBRT()) carregarVolume(false); }, ATUALIZA_MIN*60e3); }
}
