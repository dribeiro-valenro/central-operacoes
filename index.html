<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Central de Operações · Valenro</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --ink:#1b2333; --mute:#677086; --line:#e2e6ed;
    --pri:#02285a; --pri2:#0b3a78; --acc:#02285a; --amarelo:#f1c300; --full:#a9b6c8; --serie:#02285a;
    --ok:#1f9d6b; --warn:#d99a00; --bad:#d14b4b; --sombra:0 1px 3px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:var(--pri);color:#fff;padding:12px 24px;border-bottom:3px solid var(--amarelo);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{opacity:.75;font-size:12px}
  header .esp{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--acc)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
  header .btn:hover{border-color:#fff}
  .usuario{font-size:13px;display:flex;gap:10px;align-items:center}
  .login{max-width:360px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--sombra)}
  .login h2{margin:0 0 2px}
  .login form{display:flex;flex-direction:column;gap:14px;margin:18px 0 10px}
  .login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
  .login input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  .login .btn{padding:11px;font-size:15px}
  .demo{background:var(--warn);color:#1b1b1b;font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px}
  .corpo{display:flex;align-items:stretch;min-height:calc(100vh - 71px)}
  main{flex:1;min-width:0;max-width:1320px;margin:0 auto;padding:20px 20px 48px}
  .btn-menu{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;line-height:1}
  .btn-menu:hover{border-color:#fff}
  aside#menu{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:14px 0 20px;position:sticky;top:0;align-self:flex-start;height:calc(100vh - 71px);overflow-y:auto;display:flex;flex-direction:column;transition:margin-left .18s ease}
  body.menu-fechado aside#menu{margin-left:-251px}
  .m-grupo{margin-bottom:6px}
  .m-cab{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--pri);padding:9px 18px;cursor:pointer;text-align:left}
  .m-cab .seta{margin-left:auto;font-size:10px;color:var(--mute);transition:transform .15s}
  .m-grupo.fechado > .m-cab .seta{transform:rotate(-90deg)}
  .m-grupo.fechado > .m-filhos{display:none}
  .m-sub > .m-cab{text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--ink);padding:7px 18px 7px 28px}
  .m-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:8px 18px 8px 40px;cursor:pointer;text-align:left;border-left:3px solid transparent}
  .m-item:hover{background:#f1f4f9}
  .m-item.ativo{background:#eef2f8;border-left-color:var(--amarelo);font-weight:700;color:var(--pri)}
  .m-item.off,.m-cab.off{color:#9aa2b1;cursor:default}
  .m-item.off:hover{background:none}
  .m-tag{margin-left:auto;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:#eef0f4;color:var(--mute);white-space:nowrap;text-transform:none;letter-spacing:0}
  .m-rodape{margin-top:auto;padding:16px 18px 0;border-top:1px solid var(--line)}
  .m-rodape .rot{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .m-rodape .logos{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .m-rodape img{display:block;width:auto}
  .veu{display:none}
  .rodape{position:relative;z-index:21;width:100%;box-sizing:border-box;background:var(--pri);color:#e6ebf3;font-size:12px;padding:10px 24px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;border-top:3px solid var(--amarelo)}
  .rodape b{color:#fff}
  @media (max-width:900px){
    aside#menu{position:fixed;top:71px;left:0;z-index:20;box-shadow:4px 0 18px rgba(20,30,50,.18)}
    body:not(.menu-fechado) .veu{display:block;position:fixed;inset:71px 0 0 0;background:rgba(10,20,40,.25);z-index:19}
  }

  /* Home */
  .grade-blocos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .bloco{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--sombra);cursor:pointer;transition:.15s}
  .bloco:hover{border-color:var(--acc);transform:translateY(-2px)}
  .bloco h3{margin:0 0 6px;font-size:16px}
  .bloco p{margin:0;color:var(--mute);font-size:13px;line-height:1.45}
  .bloco .tag{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#e8f1fd;color:var(--acc)}
  .bloco.off{opacity:.55;cursor:default}
  .bloco.off:hover{transform:none;border-color:var(--line)}
  .bloco.off .tag{background:#eef0f4;color:var(--mute)}

  /* Barra de filtros */
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .barra h2{margin:0;font-size:18px;margin-right:auto}
  .barra select,.barra input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .info{color:var(--mute);font-size:12px}
  .erro{background:#fdecec;border:1px solid #f3c2c2;color:#8a1f1f;padding:12px 14px;border-radius:10px;margin-bottom:16px}
  .aviso{background:#fff7e0;border:1px solid #f1dd9c;color:#6d5300;padding:10px 14px;border-radius:10px;font-size:13px}

  /* Cartões */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra)}
  .kpi .rot{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .det{color:var(--mute);font-size:12px;margin-top:2px}
  .kpi.destaque{border-left:4px solid var(--amarelo)}

  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media (max-width:900px){.grade2{grid-template-columns:1fr}}
  .painel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sombra);margin-bottom:16px;min-width:0}
  .grade2 .painel{margin-bottom:0}
  .painel h3{margin:0 0 4px;font-size:15px}
  .painel .leg{color:var(--mute);font-size:12px;margin-bottom:12px}

  /* Funil */
  .funil .linha{display:grid;grid-template-columns:170px 1fr 60px;align-items:center;gap:10px;margin:7px 0}
  .funil .trilho{background:#eef1f5;border-radius:6px;height:22px;overflow:hidden}
  .funil .enche{height:100%;border-radius:6px;background:var(--acc)}
  .funil .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .funil .pend .enche{background:var(--warn)}
  .funil .feito .enche{background:var(--ok)}

  /* Gráfico por hora */
  .horas{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:200px;align-items:end;position:relative;padding-top:18px}
  .hcol{display:flex;flex-direction:column-reverse;height:100%;position:relative}
  .hcol .seg{width:100%}
  .hcol .seg.p{background:var(--acc);border-radius:0 0 3px 3px}
  .hcol .seg.f{background:var(--full);border-radius:3px 3px 0 0}
  .hcol .seg.s{background:var(--acc);border-radius:3px}
  .hcol .seg.e{background:var(--ok);border-radius:3px}
  .hcol:hover{outline:1px solid var(--line);outline-offset:1px}
  .hcol.corte::after{content:"corte 11h";position:absolute;left:-2px;top:-18px;font-size:10px;color:var(--bad);white-space:nowrap;font-weight:600}
  .hcol.corte{border-left:2px dashed var(--bad);padding-left:1px}
  .eixo{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;font-size:10px;color:var(--mute);text-align:center;margin-top:4px}
  .duplas{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:160px;align-items:end;padding-top:18px}
  .duplas .hcol{flex-direction:row;align-items:flex-end;gap:1px}
  .duplas .hcol .seg{width:50%}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  /* Gráfico com drill-down */
  .trilha{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
  .trilha a{color:var(--acc);cursor:pointer;text-decoration:none}
  .trilha a:hover{text-decoration:underline}
  .trilha .sep{color:var(--mute)}
  .nivel{display:inline-flex;gap:6px}
  .nivel .btn{font-size:13px;padding:6px 10px}
  .btn:disabled{opacity:.45;cursor:default}
  .abas{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .abas button{border:0;background:#fff;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
  .abas button.on{background:var(--pri);color:#fff;box-shadow:inset 0 -3px 0 var(--amarelo)}
  .dgraf{display:grid;gap:2px;align-items:end;height:240px;padding-top:22px;border-bottom:1px solid var(--line)}
  .dcol{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;min-width:0}
  .dcol .bar{width:100%;max-width:56px;background:var(--serie);border-radius:4px 4px 0 0;min-height:0;transition:filter .1s;box-sizing:border-box}
  .dcol .bar.parcial,.dcol .seg.parcial{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 3px,transparent 3px 7px)}
  .dcol .pilha{width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .dcol .seg{width:100%;box-sizing:border-box;min-height:0}
  .dcol .seg + .seg{margin-top:2px}
  .dcol .seg:first-child{border-radius:4px 4px 0 0}
  .dcol:hover .seg{filter:brightness(.9)}
  .logo-topo{height:44px;width:auto;display:block}
  .chip-loja{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:4px solid;border-radius:8px;padding:4px 10px;background:#fff}
  .chip-loja img{height:22px;width:auto;display:block}
  .faixa-lojas{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:-4px 0 18px;color:var(--mute);font-size:12px}
  .faixa-lojas img{height:28px;width:auto;display:block}
  .dcol .bar.media{background:#b9c7da}
  .dcol:hover .bar{filter:brightness(.85)}
  .dcol.sel .bar,.dcol.sel .seg{filter:brightness(.6)}
  .dcol.nao{cursor:default}
  .dcol .aviso-barra{color:#b07a00;font-weight:700}
  .dcol .rotv{position:absolute;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .deixo{display:grid;gap:2px;font-size:11px;color:var(--mute);text-align:center;margin-top:4px}
  .deixo span{overflow:hidden;white-space:nowrap}
  .linha-media{position:relative}
  .dica{position:fixed;pointer-events:none;background:#1b2333;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:10;display:none;white-space:nowrap}

  /* Tabelas */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.tot td{font-weight:650;border-top:2px solid var(--line)}
  .vazio{color:var(--mute);font-size:13px;padding:12px 0}
  .carregando{color:var(--mute);padding:40px;text-align:center}

  /* Pessoas e acessos */
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e8eef7;color:var(--pri);margin:1px 4px 1px 0;white-space:nowrap;border:1px solid transparent}
  .pill.nao{background:#f3f4f6;color:var(--mute);text-decoration:line-through}
  .pill.exc{border-color:var(--amarelo);background:#fff8dc;color:#6d5300}
  tr.inativo td{color:var(--mute)}
  code{font-family:Consolas,monospace;font-size:12px;background:#f3f5f8;padding:1px 5px;border-radius:4px}
  .btn.mini{padding:4px 10px;font-size:12px}
  .form-pes{border-color:var(--pri);border-top:3px solid var(--amarelo)}
  .form-pes h4{margin:18px 0 2px;font-size:14px}
  .grade-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 18px;margin-top:12px}
  .grade-form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
  .grade-form input,.grade-form select,.campo,.perm select,td select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;min-width:0}
  .grade-form input:disabled{background:#f3f5f8}
  .campo{font-size:13px;padding:6px 9px}
  label.chk{flex-direction:row !important;align-items:center;gap:8px !important;color:var(--ink) !important;font-size:13px}
  select.exc{border-color:var(--amarelo);background:#fff8dc}
  table.perm{max-width:760px}
  /* Envios Full */
  .st-full{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .kpi.alerta{border-left:4px solid var(--bad)} .kpi.alerta .val{color:var(--bad)}
  .tab-full tbody tr{cursor:pointer} .tab-full tbody tr:hover td{background:#f6f8fb} .tab-full tr.sel td{background:#fff8dc}
  .tab-full td{white-space:nowrap}
  .tab-full th,.tab-full td{text-align:center}
  .tab-full th.pct,.tab-full td.pct{text-align:right;width:118px}
  .pct-cel{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;width:100%}
  .pct-cel .mini-barra{margin:0;flex:0 0 46px} .pct-n{display:inline-block;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .tab-full tr.subtot td{background:#eef2f8;color:var(--pri);font-weight:700;border-bottom:2px solid var(--pri);font-variant-numeric:tabular-nums}
  .tab-full tr.subtot td:first-child{border-radius:8px 0 0 0} .tab-full tr.subtot td:nth-child(2){text-align:left}
  .tab-full tr.subtot small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
  .btn.imp{padding:3px 8px;font-size:14px;line-height:1}
  .tab-full th.chk,.tab-full td.chk{width:34px;padding-left:4px;padding-right:4px}
  .tab-full input[type=checkbox],.cf-chk{width:18px;height:18px;accent-color:var(--pri);cursor:pointer;vertical-align:middle}
  .tab-full tr.marcado td{background:#fff8dc} .card-full.marcado{background:#fffbea;outline:2px solid var(--amarelo)}
  .cf-chk{width:22px;height:22px;margin-right:2px}
  .barra-sel{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--pri);color:#fff;border-top:3px solid var(--amarelo);display:flex;align-items:center;gap:10px;padding:10px 24px;box-shadow:0 -4px 16px rgba(0,0,0,.18);flex-wrap:wrap}
  .barra-sel .bs-txt{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
  .barra-sel .bs-txt b{font-size:15px} .barra-sel .bs-aviso{color:#ffd96a}
  .barra-sel .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
  .barra-sel .btn.pri{background:var(--amarelo);color:#1b2333;border-color:var(--amarelo);font-weight:700;padding:9px 16px}
  body.com-barra-sel main{padding-bottom:120px}
  @media (max-width:560px){ .barra-sel{padding:10px 14px} .barra-sel .btn.pri{flex:1} }
  .kanban{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr)) minmax(110px,.8fr);gap:10px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
  .kb{position:relative;font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sombra);color:var(--ink);min-width:0}
  .kb:hover{background:var(--f)} .kb.on{background:var(--f);outline:2px solid var(--c)}
  .kb-cab{font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.4px;display:flex;flex-direction:column}
  .kb-cab small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--mute);font-size:10px}
  .kb-n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 4px}
  .kb-n small{font-size:11px;font-weight:400;color:var(--mute);margin-left:5px}
  .kb-lin{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:3px}
  .kb-lin b{color:var(--ink);font-variant-numeric:tabular-nums}
  .kb:not(:last-child):not(:nth-last-child(2))::after{content:'›';position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:#b5bdcb;font-size:18px;z-index:1}
  .kb-canc{opacity:.8}
  .filtro-ativo{margin:-4px 0 12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute)} .filtro-ativo b{color:var(--ink)}
  .datas{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
  .subtot-cel{background:#eef2f8;color:var(--pri);font-weight:700;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:10px}
  .res-col{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .res-col div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;font-size:13px}
  .res-col span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
  .andamento{color:#0b4fa8;font-style:normal;font-weight:600}
  .periodos{display:flex;flex-direction:column;font-size:12px;color:var(--ink);margin:2px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:#e8eef7;color:var(--pri);border-radius:20px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600}
  .chip button{border:0;background:transparent;color:var(--pri);font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
  .per{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:8px}
  .per label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
  .per input{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;min-width:0;width:100%}
  .per-n{width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
  @media (max-width:560px){ .per{grid-template-columns:22px minmax(0,1fr) auto} .per label:nth-of-type(2){grid-column:2} .res-col{grid-template-columns:1fr 1fr} }
  @media (max-width:900px){ .kanban{grid-template-columns:repeat(7,150px)} }
  .marca-loja{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .prev{color:#b07a00;font-style:italic} .dif{color:var(--bad)} .atraso{color:var(--bad);font-weight:600}

<script>
/* =================== CONFIGURAÇÃO =================== */
// Cole aqui o endereço do seu Worker (sem barra no final).
// Enquanto estiver vazio, o portal roda em modo demonstração.
// Endereço da Edge Function operacoes-api (sem barra no final), por exemplo:
// 'https://abcdefghijkl.supabase.co/functions/v1/operacoes-api'
const API_URL = 'https://tmfhizqwrznlqvdndeig.supabase.co/functions/v1/operacoes-api';
const ATUALIZA_MIN = 5;
/* ==================================================== */

const params = new URLSearchParams(location.search);
const DEMO = !API_URL || params.has('demo');

const ST = { 3:'Pagamento aprovado', 18:'Aguardando separação', 12:'Aguardando envio', 13:'Enviado', 15:'Entregue', 17:'Cancelado' };
const FUNIL = [
  { cods:[3],  rot:'Pagamento aprovado',   cls:'pend' },
  { cods:[18], rot:'Aguardando separação', cls:'pend' },
  { cods:[12], rot:'Aguardando envio',     cls:'pend' },
  { cods:[13], rot:'Enviado',              cls:'feito' },
  { cods:[15], rot:'Entregue',             cls:'feito' },
];
const PENDENTE = new Set([3, 18, 12]);
const CANCELADO = 17;
// Vazão: mudanças de status entre duas fotos consecutivas
const SEP_DE = new Set([3, 18]), SEP_PARA = new Set([12, 13, 15]);
const EXP_DE = new Set([3, 18, 12]), EXP_PARA = new Set([13, 15]);

const fmtN = n => (n ?? 0).toLocaleString('pt-BR');
const fmtR = n => (n ?? 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const fmtP = (a, b) => b ? (a / b * 100).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + '%' : '–';
const hojeBRT = () => new Date(Date.now() - 3*3600e3).toISOString().slice(0, 10);
const addDias = (d, n) => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const dataBR = d => d.split('-').reverse().join('/');
const horaBR = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const state = { view:'home', data:hojeBRT(), cnpj:'todos', cnpjs:[], timer:null };
const $app = document.getElementById('app');

/* =================== ACESSO À API (login via Supabase) =================== */
const SESSAO_KEY = 'valenro_sessao';
function lerSessao(){ try { return JSON.parse(localStorage.getItem(SESSAO_KEY) || 'null'); } catch(e) { return state._sessao || null; } }
function gravarSessao(s){ state._sessao = s; try { s ? localStorage.setItem(SESSAO_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSAO_KEY); } catch(e) {} }

class SemSessao extends Error {}

async function chamar(path, { metodo = 'GET', corpo, token } = {}){
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(API_URL + path, { method: metodo, headers, body: corpo ? JSON.stringify(corpo) : undefined });
  let j = null; try { j = await r.json(); } catch(e) {}
  return { r, j };
}

async function renovar(){
  const s = lerSessao(); if (!s?.refresh_token) return null;
  const { r, j } = await chamar('/refresh', { metodo:'POST', corpo:{ refresh_token: s.refresh_token } });
  if (!r.ok) { gravarSessao(null); return null; }
  gravarSessao(j); return j;
}

async function api(path, { metodo = 'GET', corpo } = {}){
  let s = lerSessao();
  if (!s) throw new SemSessao('Faça login');
  if (s.expires_at && s.expires_at * 1000 < Date.now() + 60e3) s = await renovar();
  if (!s) throw new SemSessao('Sessão expirada');
  let { r, j } = await chamar(path, { metodo, corpo, token: s.access_token });
  if (r.status === 401) {
    s = await renovar();
    if (!s) throw new SemSessao('Sessão expirada');
    ({ r, j } = await chamar(path, { metodo, corpo, token: s.access_token }));
  }
  if (r.status === 401) { gravarSessao(null); throw new SemSessao('Sessão expirada'); }
  if (!r.ok) throw new Error((j && j.error) || ('Erro ' + r.status));
  return j;
}

function telaLogin(msg){
  clearInterval(state.timer);
  document.getElementById('btn-home').hidden = true;
  const _m = document.getElementById('menu'); if (_m) _m.hidden = true;
  mostrarUsuario(null);
  $app.innerHTML = `
    <div class="login">
      <h2>Entrar</h2>
      <p class="info">Central de Operações · Valenro</p>
      ${msg ? `<div class="erro">${esc(msg)}</div>` : ''}
      <form id="f-login" autocomplete="on">

        <label>Senha ou PIN<input id="l-senha" name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn pri" type="submit" id="l-btn">Entrar</button>
      </form>
      <p class="info">Esqueceu a senha? Fale com a Gerência de Operações.</p>
    </div>`;
  const f = document.getElementById('f-login');
  document.getElementById('l-user').focus();
  f.onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('l-btn'); btn.disabled = true; btn.textContent = 'Entrando…';
    const { r, j } = await chamar('/login', { metodo:'POST', corpo:{ login: document.getElementById('l-user').value, senha: document.getElementById('l-senha').value } })
      .catch(() => ({ r:{ ok:false, status:0 }, j:{ error:'Sem conexão com o servidor' } }));
    if (!r.ok) return telaLogin((j && j.error) || 'Não foi possível entrar');
    gravarSessao(j);
    iniciar();
  };
}

function marcarRodape(u){
  const el = document.getElementById('rodape-acesso'); if (!el) return;

}
function mostrarUsuario(u){
  marcarRodape(u);
  const el = document.getElementById('usuario');
  if (!el) return;
  el.hidden = !u;
  if (u) el.innerHTML = `${esc(u.nome)} <button class="btn" id="btn-sair">Sair</button>`;
  const b = document.getElementById('btn-sair');
  if (b) b.onclick = () => { gravarSessao(null); state.sepDados = null; telaLogin(); };
}

/* =================== MODO DEMONSTRAÇÃO =================== */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PESO_HORA = [3,2,1,1,1,1,2,3,4,5,6,6,6,6,6,6,6,6,6,7,8,8,7,5];
function sorteiaHora(r){ const tot = PESO_HORA.reduce((a,b)=>a+b); let x = r()*tot; for (let h=0; h<24; h++){ x -= PESO_HORA[h]; if (x<0) return h; } return 23; }

function demoPedidos(c, d){
  const hoje = hojeBRT(), agora = new Date(Date.now()-3*3600e3).getUTCHours();
  const dias = d === hoje ? [0,1,2,3].map(i => addDias(hoje, -i)) : [d];
  const pedidos = []; let id = 17950000;
  for (const dia of dias){
    const r = rng(Number(dia.replaceAll('-','')));
    const n = 700 + Math.floor(r()*200);
    for (let i=0; i<n; i++){
      const h = sorteiaHora(r);
      if (dia === hoje && h > agora) continue;
      const ml = r() < .8, full = ml && r() < .6;
      const entrega = full ? 'Mercado Envios (Full)' : ml ? (r()<.65 ? 'Mercado Envios (Coleta)' : 'Mercado Envios (Flex)') : (r()<.85 ? 'Shopee Xpress' : 'Shopee Entrega Direta');
      let st;
      if (r() < .02) st = 17;
      else if (full) st = dia === hoje ? (r()<.7 ? 3 : 13) : 15;
      else if (dia !== hoje) st = r() < .9 ? (r()<.6 ? 15 : 13) : (r()<.5 ? 12 : 18);
      else { const idade = agora - h; st = idade < 1 ? 3 : idade < 3 ? (r()<.6 ? 18 : 12) : (h < 11 && agora >= 12 ? (r()<.85 ? 13 : 12) : (r()<.5 ? 12 : 18)); }
      pedidos.push({ id:id++, st, status:ST[st], canal: ml ? 'Mercado Livre' : 'Shopee', conta: ml ? 'MLB_DIGOS' : 'SHO_DIGOS', entrega, full,
        valor: Math.round((50 + r()*150)*100)/100, uf:'SP', dia, aprov: `${dia}T${String(h).padStart(2,'0')}:${String(Math.floor(r()*60)).padStart(2,'0')}`, nf:null });
    }
  }
  return Promise.resolve({ cnpj:c.id, nome:c.nome, ini:dias.at(-1), fim:dias[0], geradoEm:new Date().toISOString(), pedidos });
}
function demoVazao(c, d){
  const r = rng(7), agora = new Date(Date.now()-3*3600e3).getUTCHours(), horas = {};
  for (let h=7; h<=Math.min(agora,18); h++){
    horas[h] = { '18>12': 35 + Math.floor(r()*35), '3>18': 20 + Math.floor(r()*30) };
    if (h===11 || h===12 || h>=16) horas[h]['12>13'] = 60 + Math.floor(r()*80);
  }
  return Promise.resolve({ data:d, horas, coletas: 40 });
}

function pode(tela, nivel = 'ver'){
  if (DEMO) return true;
  const u = state.usuario || {};
  let p = u.permissoes;
  if (!p) p = u.perfil === 'admin' ? { produtividade:'ver', pessoas:'editar' } : u.perfil === 'lider' ? { produtividade:'ver' } : {};   // sessão antiga
  const ordem = { nenhum:0, ver:1, editar:2, gerir:3 };
  return (ordem[p[tela] || 'nenhum'] || 0) >= ordem[nivel];
}

    if (corpo.novo && !corpo.senha) throw new Error('Defina a senha inicial');
    const novo = { login, nome:corpo.nome, perfil:corpo.perfil, ativo:corpo.ativo, permissoes:corpo.permissoes, colaborador_wms:corpo.colaborador_wms, ultimo_acesso:i >= 0 ? D.usuarios[i].ultimo_acesso : null, atualizado_por:por };
    D.historico.unshift({ em:new Date().toISOString(), por, acao: corpo.novo ? 'usuario.criar' : 'usuario.alterar', alvo:login, antes: i >= 0 ? D.usuarios[i] : null, depois:novo });
    if (corpo.senha && !corpo.novo) D.historico.unshift({ em:new Date().toISOString(), por, acao:'usuario.senha', alvo:login, antes:null, depois:{ senha:'redefinida' } });
    i >= 0 ? (D.usuarios[i] = novo) : D.usuarios.push(novo);
    return { ok:true };
  }
  if (path === '/pessoas/colaborador') {
    const c = D.colaboradores.find(x => x.usuario === corpo.usuario);
    D.historico.unshift({ em:new Date().toISOString(), por, acao:'colaborador.alterar', alvo:corpo.usuario, antes:{ funcao:c.funcao, obs:c.obs }, depois:{ funcao:corpo.funcao, obs:corpo.obs } });
    Object.assign(c, { funcao:corpo.funcao, obs:corpo.obs });
    return { ok:true };
  }
}

function renderHistorico($p, r){
  const ROT_ACAO = { 'usuario.criar':'Criou acesso', 'usuario.alterar':'Alterou acesso', 'usuario.senha':'Redefiniu senha', 'colaborador.alterar':'Função no WMS' };
  const CAMPOS = { nome:'nome', perfil:'perfil', ativo:'situação', permissoes:'telas', colaborador_wms:'nome no WMS', funcao:'função', obs:'observação' };
  const fmtV = (k, v) => k === 'ativo' ? (v ? 'ativo' : 'desativado') : k === 'perfil' ? (ROT_PERFIL[v] || v) : k === 'funcao' ? (ROT_FUNCAO_WMS[v] || v || 'sem classificação')
    : k === 'permissoes' ? (Object.entries(v || {}).map(([t, n]) => `${t}: ${ROT_NIVEL[n] || n}`).join(', ') || 'padrão do perfil') : (v || '–');
  const mudou = h => {
    if (h.acao === 'usuario.senha') return 'senha trocada';
    if (!h.antes) return `perfil ${fmtV('perfil', h.depois?.perfil)}`;
    return Object.keys(CAMPOS).filter(k => k in (h.depois || {}) && JSON.stringify(h.antes[k] ?? null) !== JSON.stringify(h.depois[k] ?? null))
      .map(k => `${CAMPOS[k]}: ${esc(fmtV(k, h.antes[k]))} → <b>${esc(fmtV(k, h.depois[k]))}</b>`).join(' · ') || 'sem mudança';
  };
  $p.innerHTML = `<div class="painel"><h3>Últimas 50 alterações</h3><div class="leg">Tudo o que é mudado nesta tela fica registrado com quem fez e quando. Senhas nunca são gravadas.</div>

}

// Barra fixa: resumo das coletas marcadas e o botão do romaneio
function renderBarraSel(){
  const s = state.full, r = state.fullDados, $b = document.getElementById('barra-sel');
  if (!$b || !r) return;
  [...s.sel].forEach(id => { if (!r.envios.some(e => e.id === id)) s.sel.delete(id); });   // excluídas ou fora do período carregado
  const L = r.envios.filter(e => s.sel.has(e.id));
  $b.hidden = !L.length; document.body.classList.toggle('com-barra-sel', !!L.length);
  if (!L.length) { $b.innerHTML = ''; return; }
  const soma = f => L.reduce((t, e) => t + (Number(f(e)) || 0), 0);
  const avisos = [];
  const prev = L.filter(e => PREVISTO_FULL.includes(e.status)).length;
  if (prev) avisos.push(`${prev} ainda antes da etiquetagem (valores previstos)`);
  const fech = L.filter(e => ['expedido', 'cancelado'].includes(e.status)).length;
  if (fech) avisos.push(`${fech} já expedida(s) ou cancelada(s)`);
  if (new Set(L.map(e => e.data_expedicao)).size > 1) avisos.push('datas de expedição diferentes');
  $b.innerHTML = `<div class="bs-txt"><b>${L.length} coleta${L.length === 1 ? '' : 's'} no romaneio</b>
      <span>${L.map(e => '#' + esc(e.pedido.slice(-3))).join(' · ')}</span>
      <span>${fmtM3(soma(e => e.m3))} m³ · ${fmtN(soma(e => e.caixas))} caixas · ${fmtN(soma(e => e.pares_envio))} pares</span>

}

/* ---- QR code (modo byte, correção nível M, versões 1 a 10) embutido, sem depender de biblioteca externa ---- */
const QR = (() => {

    for (let i = 0; i < grau; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], raiz); if (j + 1 < r.length) r[j] ^= r[j + 1]; } raiz = mul(raiz, 0x02); } return r; };

    for (const b of dados) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; };

  const alinhamentos = v => { if (v === 1) return []; const n = Math.floor(v / 7) + 2, passo = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, r = [6];
    for (let p = v * 4 + 10; r.length < n; p -= passo) r.splice(1, 0, p); return r; };
  const capacidade = v => Math.floor(modulosBrutos(v) / 8) - ECC_M[v] * BLOCOS_M[v];

  function gerar(texto){
    const bytes = [...new TextEncoder().encode(texto)];
    let v = 1; while (v <= 10 && capacidade(v) * 8 < 4 + (v < 10 ? 8 : 16) + bytes.length * 8) v++;
    if (v > 10) throw new Error('Texto longo demais para o QR');
    // dados
    const bits = []; const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));

    put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const dados = []; for (let i = 0; i < bits.length; i += 8) dados.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    // correção de erros + intercalação
    const nb = BLOCOS_M[v], ecc = ECC_M[v], brutos = Math.floor(modulosBrutos(v) / 8), curtos = nb - brutos % nb, tamCurto = Math.floor(brutos / nb), div = divisor(ecc);
    const blocos = []; for (let i = 0, k = 0; i < nb; i++) { const d = dados.slice(k, k + tamCurto - ecc + (i < curtos ? 0 : 1)); k += d.length; const e = resto(d, div); if (i < curtos) d.push(0); blocos.push(d.concat(e)); }
    const final = []; for (let i = 0; i < blocos[0].length; i++) blocos.forEach((b, j) => { if (i !== tamCurto - ecc || j >= curtos) final.push(b[i]); });
    // matriz
    const n = v * 4 + 17, m = [...Array(n)].map(() => Array(n).fill(false)), fun = [...Array(n)].map(() => Array(n).fill(false));
    const set = (x, y, d) => { m[y][x] = d; fun[y][x] = true; };
    for (let i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }

      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }

      (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const aplicar = q => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!fun[y][x] && MASK[q](x, y)) m[y][x] = !m[y][x]; };

      for (let y = 0; y < n; y++) for (const lin of [0, 1]) { let run = 0, cor = null; for (let x = 0; x < n; x++) { const c = lin ? m[x][y] : m[y][x]; if (c === cor) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else { cor = c; run = 1; } } }
      for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) { const c = m[y][x]; if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3; }
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) esc++;

  }
  return { gerar, svg };
})();

function imprimirHtml(html){
  if (telaPequena()) {   // celular: abre numa aba nova (dali dá para imprimir ou compartilhar o PDF)
    const w = window.open('', '_blank');
    if (!w) return avisar('O navegador bloqueou a nova aba. Libere pop-ups para este site.', true);
    w.document.write(html.replace('</body>', '<script>window.onload=()=>setTimeout(()=>print(),300)<\/script></body>')); w.document.close();
    return;
  }
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.onload = () => { setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 60e3); }, 250); };
  f.srcdoc = html;
}

      <div class="grade-form g2" style="margin-top:10px">
        <label>Cesto<input id="cf-cesto" value="${esc(c?.cesto || '')}" placeholder="ex.: 153"></label>
        <label>Pares coletados<input id="cf-pares" inputmode="numeric" value="${c?.pares ?? ''}" placeholder="ao terminar"></label>
      </div>
      <div class="gv-lab">Períodos de trabalho <span class="info">Pausou para almoço ou continuou em outro dia? Feche o período e abra outro.</span></div>
      <div id="cf-pers"></div>
      <button type="button" class="btn mini" id="cf-per-add" style="margin-top:6px">+ Período</button>
      <div class="gv-acoes">${c ? `<button class="btn perigo" id="cf-excluir">Excluir</button><span style="flex:1"></span>` : ''}<button class="btn" id="cf-cancelar">Cancelar</button><button class="btn pri" id="cf-salvar">${c ? 'Salvar coleta' : 'Lançar coleta'}</button></div></div>`;
    const desenhaChips = () => {
      $('cf-chips').innerHTML = quem.map((n, i) => `<span class="chip">${esc(n)}<button type="button" data-rm="${i}" aria-label="Remover">×</button></span>`).join('') || '<span class="info">ninguém ainda</span>';
      $('cf-chips').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { quem.splice(+b.dataset.rm, 1); desenhaChips(); });
    };
    const addQuem = () => { const v = $('cf-quem').value.trim().replace(/\s+/g, ' '); if (v && !quem.some(q => q.toLowerCase() === v.toLowerCase())) quem.push(nomeWms(v.toLowerCase())); $('cf-quem').value = ''; desenhaChips(); };
    $('cf-add').onclick = addQuem;
    $('cf-quem').onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); addQuem(); } };
    $('cf-quem').onchange = () => { if ((r.coletadores || []).some(n => nomeWms(n) === $('cf-quem').value)) addQuem(); };   // escolheu da lista
    const lerPers = () => { pers = [...$('cf-pers').querySelectorAll('.per')].map(el => ({ inicio: el.querySelector('[data-i]').value, fim: el.querySelector('[data-f]').value })); };
    const desenhaPers = () => {
      $('cf-pers').innerHTML = pers.map((p, i) => `<div class="per"><span class="per-n">${i + 1}</span>
        <label>Início<span class="linha-hora"><input type="datetime-local" data-i value="${p.inicio}"><button type="button" class="btn mini" data-agora-i="${i}">Agora</button></span></label>
        <label>Fim<span class="linha-hora"><input type="datetime-local" data-f value="${p.fim}"><button type="button" class="btn mini" data-agora-f="${i}">Agora</button></span></label>
        <button type="button" class="btn mini perigo" data-rmp="${i}" aria-label="Remover período">×</button></div>`).join('') || '<div class="info">Sem horário (a coleta não entra no cálculo de pares por hora).</div>';
      $('cf-pers').querySelectorAll('[data-agora-i]').forEach(b => b.onclick = () => { lerPers(); pers[+b.dataset.agoraI].inicio = agoraLocal(); desenhaPers(); });
      $('cf-pers').querySelectorAll('[data-agora-f]').forEach(b => b.onclick = () => { lerPers(); pers[+b.dataset.agoraF].fim = agoraLocal(); desenhaPers(); });
      $('cf-pers').querySelectorAll('[data-rmp]').forEach(b => b.onclick = () => { lerPers(); pers.splice(+b.dataset.rmp, 1); desenhaPers(); });
    };
    $('cf-per-add').onclick = () => { lerPers(); pers.push({ inicio: agoraLocal(), fim: '' }); desenhaPers(); };
    desenhaChips(); desenhaPers();
    $('cf-cancelar').onclick = () => { f.innerHTML = ''; $('gv-col-nova').hidden = false; };
    $('cf-salvar').onclick = async ev => {
      if ($('cf-quem').value.trim()) addQuem();
      lerPers();
      if (!quem.length) return erro('Informe quem coletou (pode ser mais de uma pessoa).');
      if (pers.some(p => !p.inicio)) return erro('Todo período precisa de início.');
      const corpo = { id: c?.id || null, envio_id: e.id, coletadores: quem, cesto: $('cf-cesto').value.trim() || null, pares: $('cf-pares').value.trim(),
        periodos: pers.map(p => ({ inicio: deLocal(p.inicio), fim: deLocal(p.fim) })) };
      ev.target.disabled = true; erro('');
      try { await apiFull('/full/coleta', corpo); avisar('Coleta salva'); g.dataset.sujo = ''; await carregarFull(); }
      catch (x) { if (x instanceof SemSessao) throw x; erro(x.message); ev.target.disabled = false; }
    };
    const ex = $('cf-excluir');
    if (ex) ex.onclick = async () => {
      if (ex.dataset.conf !== '1') { ex.dataset.conf = '1'; ex.textContent = 'Confirmar exclusão'; return; }
      try { await apiFull('/full/coleta/excluir', { id: c.id }); avisar('Coleta excluída'); await carregarFull(); }
      catch (x) { if (x instanceof SemSessao) throw x; erro(x.message); }
    };
    if (!c) $('cf-quem').focus();
  };
  const nc = $('gv-col-nova'); if (nc) nc.onclick = () => formColeta(null);
  g.querySelectorAll('[data-ec]').forEach(b => b.onclick = () => formColeta(cs.find(c => c.id === b.dataset.ec)));

  const hb = $('gv-hist-btn');
  if (hb) hb.onclick = async () => {
    const ROT = { 'envio.criar':'Cadastrou', 'envio.alterar':'Alterou', 'envio.status':'Mudou etapa', 'coleta.incluir':'Lançou coleta', 'coleta.alterar':'Alterou coleta', 'coleta.excluir':'Excluiu coleta', 'envio.excluir':'Excluiu' };
    const CAMPO = { cnpj_id:'loja', pedido:'pedido', data_expedicao:'data', hora_expedicao:'hora', pares_plan:'plano', pares_envio:'pares', pct_coleta:'% coleta', caixas:'caixas', m3:'m³', motivo_diferenca:'motivo', observacao:'obs.' };
    try {
      const { eventos } = await apiFull(`/full/eventos?id=${e.id}`);
      $('gv-hist').innerHTML = eventos.length ? `<div class="lista-col">${eventos.map(v => {
        let txt = '';
        if (v.acao === 'envio.status') txt = `${esc(ST_FULL[v.antes?.status]?.rot || v.antes?.status)} → <b>${esc(ST_FULL[v.depois?.status]?.rot || v.depois?.status)}</b>`;
        else if (v.acao === 'envio.alterar') txt = Object.keys(v.depois || {}).map(k => `${CAMPO[k] || k}: ${esc(v.antes?.[k] ?? '–')} → <b>${esc(v.depois[k] ?? '–')}</b>`).join(' · ');
        else if (v.acao.startsWith('coleta')) { const c = v.depois || v.antes || {}; txt = `${esc((c.coletadores || [c.coletador]).filter(Boolean).map(nomeWms).join(', '))} · ${c.pares === null || c.pares === undefined ? 'sem pares' : fmtN(c.pares) + ' pares'}`; }
        return `<div class="col-it"><div><b>${ROT[v.acao] || esc(v.acao)}</b> <span class="info">${quando(v.em)} · ${esc(String(v.por).split('@')[0])}</span><br><span class="info">${txt}</span></div></div>`;
      }).join('')}</div>` : '<div class="vazio">Sem alterações registradas.</div>';
    } catch (x) { if (x instanceof SemSessao) throw x; erro(x.message); }
  };
  const xb = $('gv-excluir');
  if (xb) xb.onclick = async () => {
    if (xb.dataset.conf !== '1') { xb.dataset.conf = '1'; xb.textContent = 'Clique de novo para excluir'; return; }
    try { await apiFull('/full/envio/excluir', { id: e.id }); avisar(`Envio #${e.pedido} excluído`); g.dataset.sujo = ''; fecharEnvio(); await carregarFull(); }
    catch (x) { if (x instanceof SemSessao) throw x; erro(x.message); }
  };
  if (novo) $('gv-pedido').focus();
}

const MENU = [
  { id:'logistica', titulo:'Logística', filhos:[
    { id:'ferramentas', titulo:'Ferramentas', filhos:[
      { view:'full', titulo:'Envios Full', tela:'full' },
    ]},

      { view:'separados', titulo:'Produtividade', tela:'produtividade' },
      { view:'volume',    titulo:'Volume de Pedidos', soDemo:true },
    ]},
  ]},
  { id:'comercial', titulo:'Comercial', tag:'Em desenvolvimento', filhos:[] },
  { id:'admin', titulo:'Administração', filhos:[
    { view:'pessoas', titulo:'Pessoas e acessos', tela:'pessoas' },
  ]},
];
// view -> tela de permissão (views sem tela são livres)
const TELA_DA_VIEW = { separados:'produtividade', pessoas:'pessoas', volume:'produtividade', full:'full' };
const viewLiberada = v => !TELA_DA_VIEW[v] || pode(TELA_DA_VIEW[v]);
const PREF_KEY = 'valenro_menu';
function lerPref(){ try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch(e) { return state._pref || {}; } }
function gravarPref(p){ state._pref = p; try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch(e) {} }
const telaPequena = () => matchMedia('(max-width:900px)').matches;

function renderMenu(){
  const $m = document.getElementById('menu');
  if (!$m) return;
  const pref = lerPref(), fechados = pref.fechados || [];
  const item = it => {
    const ativo = it.view && (it.view === state.view);
    if (it.soDemo && !DEMO) return '';
    if (it.tela && !pode(it.tela)) return '';
    const ok = !!it.view;
    return `<button class="m-item ${ativo ? 'ativo' : ''} ${ok ? '' : 'off'}" ${ok ? `data-view="${it.view}"` : 'disabled'}>${esc(it.titulo)}${!ok && it.tag ? `<span class="m-tag">${esc(it.tag)}</span>` : ''}</button>`;
  };
  const grupo = (g, sub) => {
    const vazio = !g.filhos.length;
    const visivel = f => f.filhos ? (f.tag || f.filhos.some(visivel)) : (!f.tela || pode(f.tela)) && (!f.soDemo || DEMO);
    if (!g.tag && !g.filhos.some(visivel)) return '';
    return `<div class="m-grupo ${sub ? 'm-sub' : ''} ${fechados.includes(g.id) ? 'fechado' : ''}" data-grupo="${g.id}">
      <button class="m-cab ${vazio ? 'off' : ''}" ${vazio ? 'disabled' : `data-alterna="${g.id}"`}>${esc(g.titulo)}${g.tag ? `<span class="m-tag">${esc(g.tag)}</span>` : `<span class="seta">▼</span>`}</button>
      <div class="m-filhos">${g.filhos.map(f => f.filhos ? grupo(f, true) : item(f)).join('')}</div>
    </div>`;
  };
  $m.innerHTML = MENU.map(g => grupo(g, false)).join('');
  $m.hidden = false;
  $m.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { irPara(el.dataset.view); if (telaPequena()) alternarMenu(false); });
  $m.querySelectorAll('[data-alterna]').forEach(el => el.onclick = () => {
    const id = el.dataset.alterna, p = lerPref(), f = new Set(p.fechados || []);
    f.has(id) ? f.delete(id) : f.add(id); p.fechados = [...f]; gravarPref(p); renderMenu();
  });
}
function alternarMenu(abrir){
  const fechar = abrir === undefined ? !document.body.classList.contains('menu-fechado') : !abrir;
  document.body.classList.toggle('menu-fechado', fechar);
  if (!telaPequena()) { const p = lerPref(); p.oculto = fechar; gravarPref(p); }
}
document.getElementById('btn-menu').onclick = () => alternarMenu();
document.getElementById('veu').onclick = () => alternarMenu(false);
if (telaPequena() || lerPref().oculto) document.body.classList.add('menu-fechado');

function irPara(view){
  if (!['separados', 'volume', 'pessoas', 'full'].includes(view) || (view === 'volume' && !DEMO)) view = 'separados';   // "prod" foi unificado em "separados"
  if (!viewLiberada(view)) view = ['separados', 'full', 'pessoas'].find(viewLiberada) || 'nada';
  document.body.classList.remove('gaveta-aberta');
  state.view = view;
  clearInterval(state.timer);
  renderMenu();
  if (view === 'nada') { $app.innerHTML = `<div class="painel"><h3>Bem-vindo(a)</h3><p class="info">Seu acesso ainda não tem telas liberadas. Fale com a Gerência de Operações.</p></div>`; return; }
  if (view === 'pessoas') return telaPessoas();
  if (view === 'full') return telaFull();
  if (view === 'prod') return telaProd();
  if (view === 'separados') { telaSep(); state.timer = setInterval(() => carregarSep(true), 15*60e3); return; }
  if (view === 'volume') { telaVolume(); state.timer = setInterval(() => { if (state.data === hojeBRT()) carregarVolume(false); }, ATUALIZA_MIN*60e3); }
}

function telaVolume(){

async function carregarVolume(forcar){
  const $v = document.getElementById('vol'); if (!$v) return;
  const d = state.data, hoje = hojeBRT(), ehHoje = d === hoje;
  const alvo = state.cnpj === 'todos' ? state.cnpjs : state.cnpjs.filter(c => c.id === state.cnpj);
  const btn = document.getElementById('f-atualizar'); if (btn) { btn.disabled = true; btn.textContent = 'Atualizando…'; }
  try {
    const res = await Promise.all(alvo.map(c => DEMO ? demoPedidos(c, d)
      : api(ehHoje ? `/api/pedidos?cnpj=${c.id}${forcar ? '&forcar=1' : ''}` : `/api/pedidos?cnpj=${c.id}&ini=${d}&fim=${d}`)));
    const vz = ehHoje ? await Promise.all(alvo.map(c => DEMO ? demoVazao(c, d)
      : api(`/api/vazao?cnpj=${c.id}&data=${d}`).catch(() => ({ horas:{}, coletas:0 })))) : [];
    renderVolume($v, res, vz, d, ehHoje);
  } catch (e) {
    if (e instanceof SemSessao) return telaLogin('Sua sessão expirou. Entre novamente.');
    $v.innerHTML = `<div class="erro"><b>Não foi possível carregar os pedidos.</b><br>${esc(e.message)}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Atualizar agora'; }
  }
}

function renderVolume($v, res, vzs, d, ehHoje){
  const todos = res.flatMap(r => r.pedidos.map(p => ({ ...p, cnpjNome: r.nome })));
  const doDia = todos.filter(p => p.dia === d);
  const validos = doDia.filter(p => p.st !== CANCELADO);
  const proprios = validos.filter(p => !p.full);
  const fulls = validos.filter(p => p.full);
  const cancel = doDia.filter(p => p.st === CANCELADO);
  const fat = validos.reduce((s, p) => s + (p.valor || 0), 0);
  const ate11 = proprios.filter(p => p.aprov && +p.aprov.slice(11,13) < 11).length;
  const pendAnt = ehHoje ? todos.filter(p => !p.full && PENDENTE.has(p.st) && p.dia < d) : [];
  const pendHoje = proprios.filter(p => PENDENTE.has(p.st));
  const geradoEm = res.map(r => r.geradoEm).sort()[0];

  // ---- Cartões
  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="rot">Pedidos no dia</div><div class="val">${fmtN(doDia.length)}</div><div class="det">${fmtR(fat)} · ticket ${fmtR(validos.length ? fat/validos.length : 0)}</div></div>
      <div class="kpi destaque"><div class="rot">Operação própria</div><div class="val">${fmtN(proprios.length)}</div><div class="det">${fmtP(proprios.length, validos.length)} dos válidos · passam pelo CD</div></div>
      <div class="kpi"><div class="rot">Full</div><div class="val">${fmtN(fulls.length)}</div><div class="det">${fmtP(fulls.length, validos.length)} · saem do CD do marketplace</div></div>
      <div class="kpi"><div class="rot">Cancelados</div><div class="val">${fmtN(cancel.length)}</div><div class="det">${fmtP(cancel.length, doDia.length)} do total</div></div>
      ${ehHoje ? `<div class="kpi"><div class="rot">Fila pendente</div><div class="val">${fmtN(pendHoje.length + pendAnt.length)}</div><div class="det">${fmtN(pendHoje.length)} de hoje + ${fmtN(pendAnt.length)} de dias anteriores</div></div>` : ''}
    </div>`;

  // ---- Funil (operação própria do dia)
  const maxF = Math.max(1, proprios.length);
  const outros = proprios.filter(p => !FUNIL.some(f => f.cods.includes(p.st)));
  const funil = `
    <div class="painel funil">
      <h3>Funil da operação própria</h3>
      <div class="leg">Status atual dos pedidos do dia ${dataBR(d)} que passam pelo CD (sem Full e sem cancelados)</div>
      ${FUNIL.map(f => { const n = proprios.filter(p => f.cods.includes(p.st)).length; return `
        <div class="linha ${f.cls}"><span>${f.rot}</span><div class="trilho"><div class="enche" style="width:${n/maxF*100}%"></div></div><span class="num">${fmtN(n)}</span></div>`; }).join('')}
      ${outros.length ? `<div class="linha"><span>Outros status</span><div class="trilho"><div class="enche" style="width:${outros.length/maxF*100}%;background:var(--full)"></div></div><span class="num">${fmtN(outros.length)}</span></div>
        <div class="info">${esc([...new Set(outros.map(p => p.status))].join(', '))}</div>` : ''}
    </div>`;

  // ---- Pendências de dias anteriores
  const porDiaAnt = {};
  pendAnt.forEach(p => { (porDiaAnt[p.dia] ||= { 3:0, 18:0, 12:0 })[p.st]++; });
  const pend = ehHoje ? `
    <div class="painel">
      <h3>Pendências de dias anteriores</h3>
      <div class="leg">Pedidos da operação própria vendidos antes de hoje e ainda não enviados (últimos 3 dias)</div>
      ${pendAnt.length ? `<table><thead><tr><th>Dia da venda</th><th class="n">Pgto aprovado</th><th class="n">Ag. separação</th><th class="n">Ag. envio</th><th class="n">Total</th></tr></thead><tbody>
        ${Object.keys(porDiaAnt).sort().map(k => { const o = porDiaAnt[k]; return `<tr><td>${dataBR(k)}</td><td class="n">${fmtN(o[3])}</td><td class="n">${fmtN(o[18])}</td><td class="n">${fmtN(o[12])}</td><td class="n"><b>${fmtN(o[3]+o[18]+o[12])}</b></td></tr>`; }).join('')}
        </tbody></table>` : `<div class="vazio">Nenhuma pendência de dias anteriores.</div>`}
    </div>` : `
    <div class="painel"><h3>Pendências de dias anteriores</h3><div class="vazio">Disponível apenas para o dia de hoje.</div></div>`;

  // ---- Pedidos por hora
  const porHora = Array.from({ length:24 }, () => ({ p:0, f:0 }));
  validos.forEach(p => { if (!p.aprov) return; const h = +p.aprov.slice(11,13); porHora[h][p.full ? 'f' : 'p']++; });
  const maxH = Math.max(1, ...porHora.map(x => x.p + x.f));
  const grafHora = `
    <div class="painel">
      <h3>Pedidos aprovados por hora</h3>
      <div class="leg">Horário de Brasília · ${fmtN(ate11)} pedidos da operação própria aprovados antes do corte das 11h (${fmtP(ate11, proprios.length)})</div>
      <div class="horas">${porHora.map((x, h) => `
        <div class="hcol ${h===11?'corte':''}" data-dica="${h}h · própria ${x.p} · Full ${x.f}">
          <div class="seg p" style="height:${x.p/maxH*100}%"></div><div class="seg f" style="height:${x.f/maxH*100}%"></div>
        </div>`).join('')}</div>
      <div class="eixo">${porHora.map((_, h) => `<span>${h}</span>`).join('')}</div>
      <div class="legenda"><span><i style="background:var(--acc)"></i>Operação própria</span><span><i style="background:var(--full)"></i>Full</span></div>
    </div>`;

  // ---- Vazão do CD (fotos do Worker)
  let vazao = '';
  if (ehHoje) {
    const sep = Array(24).fill(0), exp = Array(24).fill(0);
    let coletas = 0, aviso = '';
    vzs.forEach(v => {
      coletas += v.coletas || 0; if (v.aviso) aviso = v.aviso;
      Object.entries(v.horas || {}).forEach(([h, mov]) => Object.entries(mov).forEach(([k, n]) => {
        const [a, b] = k.split('>').map(Number);
        if (SEP_DE.has(a) && SEP_PARA.has(b)) sep[h] += n;
        if (EXP_DE.has(a) && EXP_PARA.has(b)) exp[h] += n;
      }));
    });
    const maxV = Math.max(1, ...sep, ...exp);
    const totS = sep.reduce((a,b)=>a+b,0), totE = exp.reduce((a,b)=>a+b,0);
    const horasAtivas = sep.filter(n => n > 0).length;
    vazao = `
      <div class="painel">
        <h3>Vazão do CD por hora</h3>
        <div class="leg">Pedidos que saíram da separação e pedidos que foram enviados, hora a hora · ${fmtN(totS)} separados e ${fmtN(totE)} enviados hoje${horasAtivas ? ` · média de ${fmtN(Math.round(totS/horasAtivas))} separados/hora` : ''}</div>
        ${aviso ? `<div class="aviso">${esc(aviso)}. Configure o KV e o Cron no Worker para ativar.</div>`
          : !coletas ? `<div class="aviso">Ainda não há fotos suficientes hoje. A vazão aparece a partir da segunda coleta do Worker (a cada 5 a 15 minutos).</div>`
          : `<div class="duplas">${sep.map((s, h) => `
              <div class="hcol ${h===11?'corte':''}" data-dica="${h}h · separados ${s} · enviados ${exp[h]}">
                <div class="seg s" style="height:${s/maxV*100}%"></div><div class="seg e" style="height:${exp[h]/maxV*100}%"></div>
              </div>`).join('')}</div>
            <div class="eixo">${sep.map((_, h) => `<span>${h}</span>`).join('')}</div>
            <div class="legenda"><span><i style="background:var(--acc)"></i>Saíram da separação</span><span><i style="background:var(--ok)"></i>Enviados</span><span>Medição do time, não individual. Precisão de 5 a 15 minutos.</span></div>`}
      </div>`;
  }

  // ---- Canal x forma de entrega
  const grupos = {};
  validos.forEach(p => { const k = p.canal + '|' + p.entrega; (grupos[k] ||= { canal:p.canal, entrega:p.entrega, full:p.full, n:0, v:0 }); grupos[k].n++; grupos[k].v += p.valor || 0; });
  const linhas = Object.values(grupos).sort((a, b) => b.n - a.n);
  const tabCanal = `
    <div class="painel">
      <h3>Canal e forma de entrega</h3>
      <div class="leg">Pedidos válidos do dia (sem cancelados)</div>
      ${linhas.length ? `<table><thead><tr><th>Canal</th><th>Forma de entrega</th><th>Tipo</th><th class="n">Pedidos</th><th class="n">%</th><th class="n">Valor</th></tr></thead><tbody>
        ${linhas.map(l => `<tr><td>${esc(l.canal)}</td><td>${esc(l.entrega)}</td><td>${l.full ? 'Full' : 'Própria'}</td><td class="n">${fmtN(l.n)}</td><td class="n">${fmtP(l.n, validos.length)}</td><td class="n">${fmtR(l.v)}</td></tr>`).join('')}
        <tr class="tot"><td colspan="3">Total</td><td class="n">${fmtN(validos.length)}</td><td class="n">100%</td><td class="n">${fmtR(fat)}</td></tr>
        </tbody></table>` : `<div class="vazio">Sem pedidos neste dia.</div>`}
    </div>`;

  // ---- Por CNPJ (só quando "Todos")
  const tabCnpj = res.length > 1 ? `
    <div class="painel">
      <h3>Por CNPJ</h3>
      <table><thead><tr><th>CNPJ</th><th class="n">Pedidos</th><th class="n">Própria</th><th class="n">Full</th><th class="n">Cancelados</th><th class="n">Fila pendente</th><th class="n">Valor</th></tr></thead><tbody>
      ${res.map(r => { const dd = r.pedidos.filter(p => p.dia === d), vv = dd.filter(p => p.st !== CANCELADO);
        const pf = r.pedidos.filter(p => !p.full && PENDENTE.has(p.st) && (ehHoje ? p.dia <= d : p.dia === d)).length;
        return `<tr><td>${esc(r.nome)}</td><td class="n">${fmtN(dd.length)}</td><td class="n">${fmtN(vv.filter(p=>!p.full).length)}</td><td class="n">${fmtN(vv.filter(p=>p.full).length)}</td><td class="n">${fmtN(dd.length - vv.length)}</td><td class="n">${fmtN(pf)}</td><td class="n">${fmtR(vv.reduce((s,p)=>s+(p.valor||0),0))}</td></tr>`; }).join('')}
      </tbody></table>
    </div>` : '';

  $v.innerHTML = `
    <div class="info" style="margin:-6px 0 12px">Dados de ${horaBR(geradoEm)}${ehHoje ? ` · atualização automática a cada ${ATUALIZA_MIN} min` : ''}</div>
    ${kpis}
    ${tabCnpj}
    <div class="grade2">${funil}${pend}</div>
    ${grafHora}
    ${vazao}
    ${tabCanal}`;
  ligarDicas($v);
}

/* =================== PRODUTIVIDADE =================== */
const FERIADOS_DEMO = ['2026-01-01','2026-02-16','2026-02-17','2026-04-03','2026-04-21','2026-05-01','2026-06-04','2026-09-07','2026-10-12'];
const PESO_DEMO = { DIGOS:.74, DROSA:.16, CACAL:.10 };
function demoPerf(ini, fim, cnpj = 'todos'){
  const nomes = ['Operador 01','Operador 02','Operador 03','Operador 04','Operador 05','Operador 06','Operador 07','Líder Entrada','Líder Saída'];
  const hoje = hojeBRT(), dias = {};
  const agora = new Date(Date.now() - 3*3600e3), fracHoje = Math.min(1, Math.max(0, (agora.getUTCHours() + agora.getUTCMinutes()/60 - 7) / 11));
  for (let d = ini; d <= fim && d <= hoje; d = addDias(d, 1)) {
    const dow = new Date(d + 'T12:00:00Z').getUTCDay();
    if (dow === 0 || FERIADOS_DEMO.includes(d)) { dias[d] = []; continue; }
    const r = rng(Number(d.replaceAll('-', '')));
    const mes = +d.slice(5, 7), cresc = .75 + mes * .035, sab = dow === 6 ? .45 : dow === 1 ? 1.15 : 1;
    const f = cresc * sab * (d === hoje ? fracHoje : 1);
    dias[d] = nomes.filter(() => r() > .12).map((u, i) => ({ usuario:u,
        sep: Math.round((u.startsWith('Líder') ? r()*180 : 80 + r()*(i===6?400:150)) * f),
        conf: Math.round(r()*12*f), inv: r()<.2 ? Math.round(r()*6*f) : 0, aloc: Math.round(r()*14*f) }))
      .concat([{ usuario:'Expedição I', sep:0, conf: Math.round((90 + r()*40)*f), inv:0, aloc:0 }, { usuario:'Expedição II', sep:0, conf: Math.round((90 + r()*40)*f), inv:0, aloc:0 }, { usuario:'Administrador', sep:0, conf: Math.round(r()*10*f), inv: Math.round(r()*6*f), aloc:0 }]);
  }
  const porCnpj = {};
  const fator = cnpj === 'todos' ? 1 : (PESO_DEMO[cnpj] || 0);
  for (const [d, l] of Object.entries(dias)) {
    l.forEach(u => { u.sep = Math.round(u.sep * fator); u.conf = Math.round(u.conf * fator); u.aloc = Math.round(u.aloc * fator); u.inv = Math.round(u.inv * fator); });
    const tot = l.reduce((t, u) => t + u.sep, 0);
    porCnpj[d] = cnpj === 'todos' ? Object.fromEntries(Object.entries(PESO_DEMO).map(([k, w]) => [k, Math.round(tot * w)])) : { [cnpj]: tot };
  }
  // demo: ontem sem a coleta do Digos, para mostrar o aviso de dia incompleto
  const lojasOk = {}; Object.keys(dias).forEach(d => { if (d < hoje) lojasOk[d] = d === addDias(hoje, -1) ? ['DROSA','CACAL'] : ['DIGOS','DROSA','CACAL']; });
  return Promise.resolve({ ini, fim, hoje, hojeEm: new Date().toISOString(), inicioHistorico:'2026-01-01', dias, porCnpj, lojasEsperadas:['DIGOS','DROSA','CACAL'], lojasOk,
    funcoes: { 'líder entrada':'lider', 'líder saída':'lider' }, faltando: 0, ultimoErro: null });
}

function renderProd($p, r){
  const dias = Object.keys(r.dias).sort();

  let confTotal = 0, confGen = 0;
  dias.forEach(d => r.dias[d].forEach(u => {
    if (ehExcluido(u.usuario)) return;
    const alvo = ehGenerico(u.usuario) ? genericos : pessoas;
    const p = (alvo[u.usuario] ||= { usuario:u.usuario, dias:0, horas:0, sep:0, conf:0, inv:0, aloc:0, porDia:{} });
    const ativo = (u.sep + u.conf + u.inv + u.aloc) > 0;
    if (ativo) { p.dias++; p.horas += horasDia(d); }
    p.sep += u.sep; p.conf += u.conf; p.inv += u.inv; p.aloc += u.aloc;
    p.porDia[d] = u.sep;
    confTotal += u.conf; if (ehGenerico(u.usuario)) confGen += u.conf;

  const lista = Object.values(pessoas).sort((a, b) => b.sep - a.sep || a.usuario.localeCompare(b.usuario, 'pt-BR'));
  const sepTot = lista.reduce((s, p) => s + p.sep, 0);

  const pessoaHoras = lista.filter(p => p.sep > 0).reduce((s, p) => s + p.horas, 0);   // só quem separou entra na base do "por hora"
  const diasComDado = dias.filter(d => r.dias[d].length).length;

  const faltam = r.faltando ? avisoColeta(r, 'p-coletar') : '';

      <div class="kpi"><div class="rot">Conferência sem dono</div><div class="val">${fmtP(confGen, confTotal)}</div><div class="det">${fmtN(confGen)} de ${fmtN(confTotal)} conferências em logins genéricos</div></div>
    </div>`;

  const maxCel = Math.max(1, ...lista.flatMap(p => Object.values(p.porDia)));
  const tabela = `
    <div class="painel">

      ${lista.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Usuário</th><th class="n">Dias</th><th class="n">Horas disp.</th><th class="n">Separações</th><th class="n">Por dia</th><th class="n">Por hora</th><th class="n">Conferências</th><th class="n">Alocações</th><th class="n">Inventários</th></tr></thead><tbody>
        ${lista.map(p => `<tr><td>${esc(p.usuario)}</td><td class="n">${p.dias}</td><td class="n">${fmtN(p.horas)}</td><td class="n">${fmtN(p.sep)}</td><td class="n">${p.dias ? fmtN(Math.round(p.sep/p.dias)) : '–'}</td><td class="n"><b>${p.horas ? fmtH(p.sep / p.horas) : '–'}</b></td><td class="n">${fmtN(p.conf)}</td><td class="n">${fmtN(p.aloc)}</td><td class="n">${fmtN(p.inv)}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="n">${fmtN(pessoaDias)}</td><td class="n">${fmtN(pessoaHoras)}</td><td class="n">${fmtN(sepTot)}</td><td class="n"></td><td class="n">${pessoaHoras ? fmtH(sepTot / pessoaHoras) : '–'}</td><td class="n">${fmtN(lista.reduce((s,p)=>s+p.conf,0))}</td><td class="n">${fmtN(lista.reduce((s,p)=>s+p.aloc,0))}</td><td class="n">${fmtN(lista.reduce((s,p)=>s+p.inv,0))}</td></tr>
      </tbody></table></div>` : `<div class="vazio">Sem dados no período.</div>`}
    </div>`;

  const matriz = lista.length && dias.length ? `
    <div class="painel">
      <h3>Separações por dia</h3>
      <div class="leg">Quanto mais escuro, mais pedidos separados no dia. Célula vazia = sem atividade.</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Usuário</th>${dias.map(d => `<th class="n">${d.slice(8)}/${d.slice(5,7)}</th>`).join('')}</tr></thead><tbody>

          return `<td class="n" style="background:rgba(42,125,225,${a});${a > .5 ? 'color:#fff' : ''}">${v ? fmtN(v) : ''}</td>`; }).join('')}</tr>`).join('')}
        <tr class="tot"><td>Total</td>${dias.map(d => `<td class="n">${fmtN(lista.reduce((s, p) => s + (p.porDia[d] || 0), 0))}</td>`).join('')}</tr>
      </tbody></table></div>

  const gens = Object.values(genericos);
  const tabGen = gens.length ? `

      <h3>Logins genéricos</h3>

        ${gens.map(g => `<tr><td>${esc(g.usuario)}</td><td class="n">${fmtN(g.sep)}</td><td class="n">${fmtN(g.conf)}</td><td class="n">${fmtN(g.aloc)}</td><td class="n">${fmtN(g.inv)}</td></tr>`).join('')}
      </tbody></table>
    </div>` : '';

  $p.innerHTML = faltam + kpis + tabela + matriz + tabGen +
    `<div class="info">Fonte: Seenc WMS (users/performance), uma consulta por CNPJ; em "Todos" a produção de cada pessoa é somada. Separações contam o dia em que o pedido foi separado, não o dia da venda. Excluídos dos indicadores: ${esc(USUARIOS_EXCLUIDOS.join(', ') || 'nenhum')}.</div>`;

  ligarColeta('p-coletar', carregarProd);
}

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

async function carregarSep(recarregar){
