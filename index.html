async function carregarVolume(forcar){
  const $v = document.getElementById('vol'); if (!$v) return;
  const d = state.data, hoje = hojeBRT(), ehHoje = d === hoje;
  const alvo = state.cnpj === 'todos' ? state.cnpjs : state.cnpjs.filter(c => c.id === state.cnpj);
  const btn = document.getElementById('f-atualizar'); if (btn) { btn.disabled = true; btn.textContent = 'Atualizando…'; }
  try {
    const res = await Promise.all(alvo.map(c => DEMO ? demoPedidos(c, d)
      : api(ehHoje ? `/api/pedidos?cnpj=${c.id}${forcar ? '&forcar=1' : ''}` : `/api/pedidos?cnpj=${c.id}&ini=${d}&fim=${d}`)));
    const vz = ehHoje ? await Promise.all(alvo.map(c => DEMO ? demoVazao(c, d)
      : api(`/api/vazao?cnpj=${c.id}&data=${d}`).catch(() => ({ horas:{}, coletas:0 })))) : [];
    renderVolume($v, res, vz, d, ehHoje);
  } catch (e) {
    if (e instanceof SemSessao) return telaLogin('Sua sessão expirou. Entre novamente.');
    $v.innerHTML = `<div class="erro"><b>Não foi possível carregar os pedidos.</b><br>${esc(e.message)}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Atualizar agora'; }
  }
}

function renderVolume($v, res, vzs, d, ehHoje){
  const todos = res.flatMap(r => r.pedidos.map(p => ({ ...p, cnpjNome: r.nome })));
  const doDia = todos.filter(p => p.dia === d);
  const validos = doDia.filter(p => p.st !== CANCELADO);
  const proprios = validos.filter(p => !p.full);
  const fulls = validos.filter(p => p.full);
  const cancel = doDia.filter(p => p.st === CANCELADO);
  const fat = validos.reduce((s, p) => s + (p.valor || 0), 0);
  const ate11 = proprios.filter(p => p.aprov && +p.aprov.slice(11,13) < 11).length;
  const pendAnt = ehHoje ? todos.filter(p => !p.full && PENDENTE.has(p.st) && p.dia < d) : [];
  const pendHoje = proprios.filter(p => PENDENTE.has(p.st));
  const geradoEm = res.map(r => r.geradoEm).sort()[0];

  // ---- Cartões
  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="rot">Pedidos no dia</div><div class="val">${fmtN(doDia.length)}</div><div class="det">${fmtR(fat)} · ticket ${fmtR(validos.length ? fat/validos.length : 0)}</div></div>
      <div class="kpi destaque"><div class="rot">Operação própria</div><div class="val">${fmtN(proprios.length)}</div><div class="det">${fmtP(proprios.length, validos.length)} dos válidos · passam pelo CD</div></div>
      <div class="kpi"><div class="rot">Full</div><div class="val">${fmtN(fulls.length)}</div><div class="det">${fmtP(fulls.length, validos.length)} · saem do CD do marketplace</div></div>
      <div class="kpi"><div class="rot">Cancelados</div><div class="val">${fmtN(cancel.length)}</div><div class="det">${fmtP(cancel.length, doDia.length)} do total</div></div>
      ${ehHoje ? `<div class="kpi"><div class="rot">Fila pendente</div><div class="val">${fmtN(pendHoje.length + pendAnt.length)}</div><div class="det">${fmtN(pendHoje.length)} de hoje + ${fmtN(pendAnt.length)} de dias anteriores</div></div>` : ''}
    </div>`;

  // ---- Funil (operação própria do dia)
  const maxF = Math.max(1, proprios.length);
  const outros = proprios.filter(p => !FUNIL.some(f => f.cods.includes(p.st)));
  const funil = `
    <div class="painel funil">
      <h3>Funil da operação própria</h3>
      <div class="leg">Status atual dos pedidos do dia ${dataBR(d)} que passam pelo CD (sem Full e sem cancelados)</div>
      ${FUNIL.map(f => { const n = proprios.filter(p => f.cods.includes(p.st)).length; return `
        <div class="linha ${f.cls}"><span>${f.rot}</span><div class="trilho"><div class="enche" style="width:${n/maxF*100}%"></div></div><span class="num">${fmtN(n)}</span></div>`; }).join('')}
      ${outros.length ? `<div class="linha"><span>Outros status</span><div class="trilho"><div class="enche" style="width:${outros.length/maxF*100}%;background:var(--full)"></div></div><span class="num">${fmtN(outros.length)}</span></div>
        <div class="info">${esc([...new Set(outros.map(p => p.status))].join(', '))}</div>` : ''}
    </div>`;

  // ---- Pendências de dias anteriores
  const porDiaAnt = {};
  pendAnt.forEach(p => { (porDiaAnt[p.dia] ||= { 3:0, 18:0, 12:0 })[p.st]++; });
  const pend = ehHoje ? `
    <div class="painel">
      <h3>Pendências de dias anteriores</h3>
      <div class="leg">Pedidos da operação própria vendidos antes de hoje e ainda não enviados (últimos 3 dias)</div>
      ${pendAnt.length ? `<table><thead><tr><th>Dia da venda</th><th class="n">Pgto aprovado</th><th class="n">Ag. separação</th><th class="n">Ag. envio</th><th class="n">Total</th></tr></thead><tbody>
        ${Object.keys(porDiaAnt).sort().map(k => { const o = porDiaAnt[k]; return `<tr><td>${dataBR(k)}</td><td class="n">${fmtN(o[3])}</td><td class="n">${fmtN(o[18])}</td><td class="n">${fmtN(o[12])}</td><td class="n"><b>${fmtN(o[3]+o[18]+o[12])}</b></td></tr>`; }).join('')}
        </tbody></table>` : `<div class="vazio">Nenhuma pendência de dias anteriores.</div>`}
    </div>` : `
    <div class="painel"><h3>Pendências de dias anteriores</h3><div class="vazio">Disponível apenas para o dia de hoje.</div></div>`;

  // ---- Pedidos por hora
  const porHora = Array.from({ length:24 }, () => ({ p:0, f:0 }));
  validos.forEach(p => { if (!p.aprov) return; const h = +p.aprov.slice(11,13); porHora[h][p.full ? 'f' : 'p']++; });
  const maxH = Math.max(1, ...porHora.map(x => x.p + x.f));
  const grafHora = `
    <div class="painel">
      <h3>Pedidos aprovados por hora</h3>
      <div class="leg">Horário de Brasília · ${fmtN(ate11)} pedidos da operação própria aprovados antes do corte das 11h (${fmtP(ate11, proprios.length)})</div>
      <div class="horas">${porHora.map((x, h) => `
        <div class="hcol ${h===11?'corte':''}" data-dica="${h}h · própria ${x.p} · Full ${x.f}">
          <div class="seg p" style="height:${x.p/maxH*100}%"></div><div class="seg f" style="height:${x.f/maxH*100}%"></div>
        </div>`).join('')}</div>
      <div class="eixo">${porHora.map((_, h) => `<span>${h}</span>`).join('')}</div>
      <div class="legenda"><span><i style="background:var(--acc)"></i>Operação própria</span><span><i style="background:var(--full)"></i>Full</span></div>
    </div>`;

  // ---- Vazão do CD (fotos do Worker)
  let vazao = '';
  if (ehHoje) {
    const sep = Array(24).fill(0), exp = Array(24).fill(0);
    let coletas = 0, aviso = '';
    vzs.forEach(v => {
      coletas += v.coletas || 0; if (v.aviso) aviso = v.aviso;
      Object.entries(v.horas || {}).forEach(([h, mov]) => Object.entries(mov).forEach(([k, n]) => {
        const [a, b] = k.split('>').map(Number);
        if (SEP_DE.has(a) && SEP_PARA.has(b)) sep[h] += n;
        if (EXP_DE.has(a) && EXP_PARA.has(b)) exp[h] += n;
      }));
    });
    const maxV = Math.max(1, ...sep, ...exp);
    const totS = sep.reduce((a,b)=>a+b,0), totE = exp.reduce((a,b)=>a+b,0);
    const horasAtivas = sep.filter(n => n > 0).length;
    vazao = `
      <div class="painel">
        <h3>Vazão do CD por hora</h3>
        <div class="leg">Pedidos que saíram da separação e pedidos que foram enviados, hora a hora · ${fmtN(totS)} separados e ${fmtN(totE)} enviados hoje${horasAtivas ? ` · média de ${fmtN(Math.round(totS/horasAtivas))} separados/hora` : ''}</div>
        ${aviso ? `<div class="aviso">${esc(aviso)}. Configure o KV e o Cron no Worker para ativar.</div>`
          : !coletas ? `<div class="aviso">Ainda não há fotos suficientes hoje. A vazão aparece a partir da segunda coleta do Worker (a cada 5 a 15 minutos).</div>`
          : `<div class="duplas">${sep.map((s, h) => `
              <div class="hcol ${h===11?'corte':''}" data-dica="${h}h · separados ${s} · enviados ${exp[h]}">
                <div class="seg s" style="height:${s/maxV*100}%"></div><div class="seg e" style="height:${exp[h]/maxV*100}%"></div>
              </div>`).join('')}</div>
            <div class="eixo">${sep.map((_, h) => `<span>${h}</span>`).join('')}</div>
            <div class="legenda"><span><i style="background:var(--acc)"></i>Saíram da separação</span><span><i style="background:var(--ok)"></i>Enviados</span><span>Medição do time, não individual. Precisão de 5 a 15 minutos.</span></div>`}
      </div>`;
  }

  // ---- Canal x forma de entrega
  const grupos = {};
  validos.forEach(p => { const k = p.canal + '|' + p.entrega; (grupos[k] ||= { canal:p.canal, entrega:p.entrega, full:p.full, n:0, v:0 }); grupos[k].n++; grupos[k].v += p.valor || 0; });
  const linhas = Object.values(grupos).sort((a, b) => b.n - a.n);
  const tabCanal = `
    <div class="painel">
      <h3>Canal e forma de entrega</h3>
      <div class="leg">Pedidos válidos do dia (sem cancelados)</div>
      ${linhas.length ? `<table><thead><tr><th>Canal</th><th>Forma de entrega</th><th>Tipo</th><th class="n">Pedidos</th><th class="n">%</th><th class="n">Valor</th></tr></thead><tbody>
        ${linhas.map(l => `<tr><td>${esc(l.canal)}</td><td>${esc(l.entrega)}</td><td>${l.full ? 'Full' : 'Própria'}</td><td class="n">${fmtN(l.n)}</td><td class="n">${fmtP(l.n, validos.length)}</td><td class="n">${fmtR(l.v)}</td></tr>`).join('')}
        <tr class="tot"><td colspan="3">Total</td><td class="n">${fmtN(validos.length)}</td><td class="n">100%</td><td class="n">${fmtR(fat)}</td></tr>
        </tbody></table>` : `<div class="vazio">Sem pedidos neste dia.</div>`}
    </div>`;

  // ---- Por CNPJ (só quando "Todos")
  const tabCnpj = res.length > 1 ? `
    <div class="painel">
      <h3>Por CNPJ</h3>
      <table><thead><tr><th>CNPJ</th><th class="n">Pedidos</th><th class="n">Própria</th><th class="n">Full</th><th class="n">Cancelados</th><th class="n">Fila pendente</th><th class="n">Valor</th></tr></thead><tbody>
      ${res.map(r => { const dd = r.pedidos.filter(p => p.dia === d), vv = dd.filter(p => p.st !== CANCELADO);
        const pf = r.pedidos.filter(p => !p.full && PENDENTE.has(p.st) && (ehHoje ? p.dia <= d : p.dia === d)).length;
        return `<tr><td>${esc(r.nome)}</td><td class="n">${fmtN(dd.length)}</td><td class="n">${fmtN(vv.filter(p=>!p.full).length)}</td><td class="n">${fmtN(vv.filter(p=>p.full).length)}</td><td class="n">${fmtN(dd.length - vv.length)}</td><td class="n">${fmtN(pf)}</td><td class="n">${fmtR(vv.reduce((s,p)=>s+(p.valor||0),0))}</td></tr>`; }).join('')}
      </tbody></table>
    </div>` : '';

  $v.innerHTML = `
    <div class="info" style="margin:-6px 0 12px">Dados de ${horaBR(geradoEm)}${ehHoje ? ` · atualização automática a cada ${ATUALIZA_MIN} min` : ''}</div>
    ${kpis}
    ${tabCnpj}
    <div class="grade2">${funil}${pend}</div>
    ${grafHora}
    ${vazao}
    ${tabCanal}`;
  ligarDicas($v);
}

/* =================== PRODUTIVIDADE =================== */
const FERIADOS_DEMO = ['2026-01-01','2026-02-16','2026-02-17','2026-04-03','2026-04-21','2026-05-01','2026-06-04','2026-09-07','2026-10-12'];
const PESO_DEMO = { DIGOS:.74, DROSA:.16, CACAL:.10 };
function demoPerf(ini, fim, cnpj = 'todos'){
  const nomes = ['Operador 01','Operador 02','Operador 03','Operador 04','Operador 05','Operador 06','Operador 07','Líder Entrada','Líder Saída'];
  const hoje = hojeBRT(), dias = {};
  const agora = new Date(Date.now() - 3*3600e3), fracHoje = Math.min(1, Math.max(0, (agora.getUTCHours() + agora.getUTCMinutes()/60 - 7) / 11));
  for (let d = ini; d <= fim && d <= hoje; d = addDias(d, 1)) {
    const dow = new Date(d + 'T12:00:00Z').getUTCDay();
    if (dow === 0 || FERIADOS_DEMO.includes(d)) { dias[d] = []; continue; }
    const r = rng(Number(d.replaceAll('-', '')));
    const mes = +d.slice(5, 7), cresc = .75 + mes * .035, sab = dow === 6 ? .45 : dow === 1 ? 1.15 : 1;
    const f = cresc * sab * (d === hoje ? fracHoje : 1);
    dias[d] = nomes.filter(() => r() > .12).map((u, i) => ({ usuario:u,
        sep: Math.round((u.startsWith('Líder') ? r()*180 : 80 + r()*(i===6?400:150)) * f),
        conf: Math.round(r()*12*f), inv: r()<.2 ? Math.round(r()*6*f) : 0, aloc: Math.round(r()*14*f) }))
      .concat([{ usuario:'Expedição I', sep:0, conf: Math.round((90 + r()*40)*f), inv:0, aloc:0 }, { usuario:'Expedição II', sep:0, conf: Math.round((90 + r()*40)*f), inv:0, aloc:0 }, { usuario:'Administrador', sep:0, conf: Math.round(r()*10*f), inv: Math.round(r()*6*f), aloc:0 }]);
  }
  const porCnpj = {};
  const fator = cnpj === 'todos' ? 1 : (PESO_DEMO[cnpj] || 0);
  for (const [d, l] of Object.entries(dias)) {
    l.forEach(u => { u.sep = Math.round(u.sep * fator); u.conf = Math.round(u.conf * fator); u.aloc = Math.round(u.aloc * fator); u.inv = Math.round(u.inv * fator); });
    const tot = l.reduce((t, u) => t + u.sep, 0);
    porCnpj[d] = cnpj === 'todos' ? Object.fromEntries(Object.entries(PESO_DEMO).map(([k, w]) => [k, Math.round(tot * w)])) : { [cnpj]: tot };
  }
  // demo: ontem sem a coleta do Digos, para mostrar o aviso de dia incompleto
  const lojasOk = {}; Object.keys(dias).forEach(d => { if (d < hoje) lojasOk[d] = d === addDias(hoje, -1) ? ['DROSA','CACAL'] : ['DIGOS','DROSA','CACAL']; });
  return Promise.resolve({ ini, fim, hoje, hojeEm: new Date().toISOString(), inicioHistorico:'2026-01-01', dias, porCnpj, lojasEsperadas:['DIGOS','DROSA','CACAL'], lojasOk,
    funcoes: { 'líder entrada':'lider', 'líder saída':'lider' }, faltando: 0, ultimoErro: null });
}

/* Aviso de histórico incompleto + botão de coleta manual (compartilhado pelas telas de produtividade) */
function avisoColeta(r, idBtn){
  return `<div class="aviso" style="margin-bottom:16px">
      ${fmtN(r.faltando)} CNPJ-dia(s) do período ainda não foram coletados da Weesu. A carga roda sozinha à noite (19h às 6h), até 8 dias a cada 5 minutos.
      ${r.ultimoErro ? `<br>Última falha: ${esc(r.ultimoErro.cnpj || '')} ${dataBR(r.ultimoErro.dia)} · ${esc(String(r.ultimoErro.erro).slice(0,90))}` : ''}
      <br><button class="btn" id="${idBtn}" style="margin-top:8px">Buscar até 3 dias agora</button> <span class="info">a tela recarrega sozinha em 1 min e meio</span>
    </div>`;
}
function ligarColeta(idBtn, recarregar){
  const b = document.getElementById(idBtn); if (!b) return;
  b.onclick = async () => {
    b.disabled = true; b.textContent = 'Buscando… (pode levar alguns minutos)';
    try { const x = await api('/produtividade/coletar', { metodo:'POST' }); b.textContent = x.msg || 'Coleta iniciada'; }
    catch (e) { b.textContent = 'Falhou: ' + e.message.slice(0, 60); return; }
    state.sepDados = null;
    setTimeout(recarregar, 90e3);
  };
}

function telaProd(){
  const ontem = addDias(hojeBRT(), -1);
  state.pIni ||= addDias(ontem, -6); state.pFim ||= ontem;
  $app.innerHTML = `
    <div class="barra">
      <h2 style="margin-right:0">Produtividade</h2><span id="p-chip">${chipLoja(state.pCnpj)}</span><span style="flex:1"></span>
      <label>De <input type="date" id="p-ini" value="${state.pIni}" max="${ontem}"></label>
      <label>Até <input type="date" id="p-fim" value="${state.pFim}" max="${ontem}"></label>
      <select id="p-cnpj">
        ${opcoesLojas(state.pCnpj)}
      </select>

    </div>
    <div id="prod"><div class="carregando">Carregando…</div></div>`;
  document.getElementById('p-ini').onchange = e => { state.pIni = e.target.value; carregarProd(); };
  document.getElementById('p-fim').onchange = e => { state.pFim = e.target.value; carregarProd(); };
  document.getElementById('p-cnpj').onchange = e => { state.pCnpj = e.target.value; document.getElementById('p-chip').innerHTML = chipLoja(state.pCnpj); carregarProd(); };

  carregarProd();
}

async function carregarProd(){
  const $p = document.getElementById('prod'); if (!$p) return;
  if (state.pIni > state.pFim) { $p.innerHTML = `<div class="erro">A data inicial é maior que a final.</div>`; return; }
  try {
    const r = DEMO ? await demoPerf(state.pIni, state.pFim, state.pCnpj || 'todos') : await api(`/produtividade?cnpj=${state.pCnpj || 'todos'}&ini=${state.pIni}&fim=${state.pFim}`);
    renderProd($p, r);
  } catch (e) {
    if (e instanceof SemSessao) return telaLogin('Sua sessão expirou. Entre novamente.');
    $p.innerHTML = `<div class="erro"><b>Não foi possível carregar a produtividade.</b><br>${esc(e.message)}</div>`;
  }
}

function renderProd($p, r){
  const dias = Object.keys(r.dias).sort();
  const pessoas = {}, genericos = {};
  let confTotal = 0, confGen = 0;
  dias.forEach(d => r.dias[d].forEach(u => {
    if (ehExcluido(u.usuario)) return;
    const alvo = ehGenerico(u.usuario) ? genericos : pessoas;
    const p = (alvo[u.usuario] ||= { usuario:u.usuario, dias:0, horas:0, sep:0, conf:0, inv:0, aloc:0, porDia:{} });
    const ativo = (u.sep + u.conf + u.inv + u.aloc) > 0;
    if (ativo) { p.dias++; p.horas += horasDia(d); }
    p.sep += u.sep; p.conf += u.conf; p.inv += u.inv; p.aloc += u.aloc;
    p.porDia[d] = u.sep;
    confTotal += u.conf; if (ehGenerico(u.usuario)) confGen += u.conf;
  }));
  const lista = Object.values(pessoas).sort((a, b) => b.sep - a.sep || a.usuario.localeCompare(b.usuario, 'pt-BR'));
  const sepTot = lista.reduce((s, p) => s + p.sep, 0);
  const pessoaDias = lista.reduce((s, p) => s + p.dias, 0);
  const pessoaHoras = lista.filter(p => p.sep > 0).reduce((s, p) => s + p.horas, 0);   // só quem separou entra na base do "por hora"
  const diasComDado = dias.filter(d => r.dias[d].length).length;

  const faltam = r.faltando ? avisoColeta(r, 'p-coletar') : '';
  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="rot">Separações no período</div><div class="val">${fmtN(sepTot)}</div><div class="det">${diasComDado} dia(s) com dados</div></div>
      <div class="kpi destaque"><div class="rot">Separações por hora</div><div class="val">${pessoaHoras ? fmtH(sepTot / pessoaHoras) : '–'}</div><div class="det">por hora disponível · ${fmtN(pessoaHoras)} h de jornada no período</div></div>
      <div class="kpi"><div class="rot">Separações por pessoa-dia</div><div class="val">${pessoaDias ? fmtN(Math.round(sepTot/pessoaDias)) : '–'}</div><div class="det">${fmtN(pessoaDias)} pessoa-dias com atividade</div></div>
      <div class="kpi"><div class="rot">Conferência sem dono</div><div class="val">${fmtP(confGen, confTotal)}</div><div class="det">${fmtN(confGen)} de ${fmtN(confTotal)} conferências em logins genéricos</div></div>
    </div>`;

  const maxCel = Math.max(1, ...lista.flatMap(p => Object.values(p.porDia)));
  const tabela = `
    <div class="painel">
      <h3>Por pessoa</h3>
      <div class="leg">Do maior para o menor número de separações. Separações = pedidos separados. "Dias" conta só os dias com atividade registrada. Por hora = separações ÷ horas disponíveis da jornada nesses dias (${JORNADA_TXT}).</div>
      ${lista.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Usuário</th><th class="n">Dias</th><th class="n">Horas disp.</th><th class="n">Separações</th><th class="n">Por dia</th><th class="n">Por hora</th><th class="n">Conferências</th><th class="n">Alocações</th><th class="n">Inventários</th></tr></thead><tbody>
        ${lista.map(p => `<tr><td>${esc(p.usuario)}</td><td class="n">${p.dias}</td><td class="n">${fmtN(p.horas)}</td><td class="n">${fmtN(p.sep)}</td><td class="n">${p.dias ? fmtN(Math.round(p.sep/p.dias)) : '–'}</td><td class="n"><b>${p.horas ? fmtH(p.sep / p.horas) : '–'}</b></td><td class="n">${fmtN(p.conf)}</td><td class="n">${fmtN(p.aloc)}</td><td class="n">${fmtN(p.inv)}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="n">${fmtN(pessoaDias)}</td><td class="n">${fmtN(pessoaHoras)}</td><td class="n">${fmtN(sepTot)}</td><td class="n"></td><td class="n">${pessoaHoras ? fmtH(sepTot / pessoaHoras) : '–'}</td><td class="n">${fmtN(lista.reduce((s,p)=>s+p.conf,0))}</td><td class="n">${fmtN(lista.reduce((s,p)=>s+p.aloc,0))}</td><td class="n">${fmtN(lista.reduce((s,p)=>s+p.inv,0))}</td></tr>
      </tbody></table></div>` : `<div class="vazio">Sem dados no período.</div>`}
    </div>`;

  const matriz = lista.length && dias.length ? `
    <div class="painel">
      <h3>Separações por dia</h3>
      <div class="leg">Quanto mais escuro, mais pedidos separados no dia. Célula vazia = sem atividade.</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Usuário</th>${dias.map(d => `<th class="n">${d.slice(8)}/${d.slice(5,7)}</th>`).join('')}</tr></thead><tbody>
        ${lista.map(p => `<tr><td>${esc(p.usuario)}</td>${dias.map(d => { const v = p.porDia[d] || 0; const a = v ? .12 + .7 * v / maxCel : 0;
          return `<td class="n" style="background:rgba(42,125,225,${a});${a > .5 ? 'color:#fff' : ''}">${v ? fmtN(v) : ''}</td>`; }).join('')}</tr>`).join('')}
        <tr class="tot"><td>Total</td>${dias.map(d => `<td class="n">${fmtN(lista.reduce((s, p) => s + (p.porDia[d] || 0), 0))}</td>`).join('')}</tr>
      </tbody></table></div>
    </div>` : '';

  const gens = Object.values(genericos);
  const tabGen = gens.length ? `
    <div class="painel">
      <h3>Logins genéricos</h3>
      <div class="leg">Atividade registrada em usuários compartilhados. Não é possível saber quem executou. Fica fora dos indicadores por pessoa.</div>
      <table><thead><tr><th>Usuário</th><th class="n">Separações</th><th class="n">Conferências</th><th class="n">Alocações</th><th class="n">Inventários</th></tr></thead><tbody>
        ${gens.map(g => `<tr><td>${esc(g.usuario)}</td><td class="n">${fmtN(g.sep)}</td><td class="n">${fmtN(g.conf)}</td><td class="n">${fmtN(g.aloc)}</td><td class="n">${fmtN(g.inv)}</td></tr>`).join('')}
      </tbody></table>
    </div>` : '';

  $p.innerHTML = faltam + kpis + tabela + matriz + tabGen +
    `<div class="info">Fonte: Seenc WMS (users/performance), uma consulta por CNPJ; em "Todos" a produção de cada pessoa é somada. Separações contam o dia em que o pedido foi separado, não o dia da venda. Excluídos dos indicadores: ${esc(USUARIOS_EXCLUIDOS.join(', ') || 'nenhum')}.</div>`;

  ligarColeta('p-coletar', carregarProd);
}

/* =================== PEDIDOS SEPARADOS (macro → micro) =================== */
const HIST_INICIO = '2026-01-01';
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const SEMANA_LONGO = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const diaSem = d => new Date(d + 'T12:00:00Z').getUTCDay();
const fmtD = n => (n ?? 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const varPct = (a, b) => b ? ((a / b - 1) * 100) : null;
const fmtVar = v => v == null ? '–' : `${v > 0 ? '+' : ''}${v.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;

function telaSep(){
  const s = state.sep ||= { cnpj:'todos', colab:'todos', nivel:null, ano:null, mes:null, sel:null, modo:'periodo' };
  $app.innerHTML = `
    <div class="barra">
      <h2 style="margin-right:0">Produtividade · Pedidos Separados</h2><span id="s-chip"></span><span style="flex:1"></span>
      <select id="s-cnpj">
        ${opcoesLojas(s.cnpj)}
      </select>
      <select id="s-colab"><option value="todos">Todos os colaboradores</option></select>
      <button class="btn" id="s-atualizar">Atualizar</button>
    </div>
    <div id="sep"><div class="carregando">Carregando histórico…</div></div>`;
  const chip = () => { document.getElementById('s-chip').innerHTML = chipLoja(s.cnpj); };
  chip();
  document.getElementById('s-cnpj').onchange = e => { s.cnpj = e.target.value; state.sepDados = null; chip(); carregarSep(); };
  document.getElementById('s-colab').onchange = e => { s.colab = e.target.value; carregarSep(); };
  document.getElementById('s-atualizar').onclick = () => { state.sepDados = null; carregarSep(); };
  carregarSep();
}

async function carregarSep(recarregar){
  const $s = document.getElementById('sep'); if (!$s) return;
  const s = state.sep, hoje = hojeBRT();
  try {
    if (recarregar || !state.sepDados || state.sepDados.cnpj !== s.cnpj) {
      const r = DEMO ? await demoPerf(HIST_INICIO, hoje, s.cnpj) : await api(`/produtividade?cnpj=${s.cnpj}&ini=${HIST_INICIO}&fim=${hoje}`);
      state.sepDados = { cnpj: s.cnpj, r };
    }
    renderSep($s, state.sepDados.r);
  } catch (e) {
    if (e instanceof SemSessao) return telaLogin('Sua sessão expirou. Entre novamente.');
    $s.innerHTML = `<div class="erro"><b>Não foi possível carregar o histórico.</b><br>${esc(e.message)}</div>`;
  }
}

/* Série diária para o filtro atual: d -> { v: separações, ativo: trabalhou? } */
function serieSep(r, colab){
  const out = {};
  for (const [d, lista] of Object.entries(r.dias)) {
    if (colab === 'todos') {
      const v = lista.reduce((t, u) => t + (u.sep || 0), 0);
      out[d] = { v, ativo: v > 0 };
    } else {
      const u = lista.find(x => x.usuario === colab);
      const v = u ? u.sep : 0;
      out[d] = { v, ativo: !!u && (u.sep + u.conf + u.inv + u.aloc) > 0 };
    }
  }
  return out;
}

function agrega(serie, filtro){
  let v = 0, dias = 0;
  for (const [d, x] of Object.entries(serie)) if (filtro(d)) { v += x.v; if (x.ativo) dias++; }
  return { v, dias, media: dias ? v / dias : 0 };
}

function renderSep($s, r){
  const _d = document.getElementById('dica'); if (_d) _d.style.display = 'none';
  const s = state.sep, hoje = r.hoje || hojeBRT(), ontem = addDias(hoje, -1);
  // função de cada colaborador (tabela operacoes.colaboradores); sem cadastro = operacional
  const funcaoDe = u => ehGenerico(u) ? 'generico' : ((r.funcoes || {})[String(u).toLowerCase().trim()] || 'operacional');
  const ROT_FUNCAO = { lider:'líder', apoio:'apoio', gestao:'gestão', generico:'login genérico' };
  // cobertura: dias fechados em que alguma loja esperada ainda não foi coletada
  const esperadas = s.cnpj === 'todos' ? (r.lojasEsperadas || []) : [s.cnpj];
  const faltasDia = d => (!r.lojasOk || d >= (r.hoje || hojeBRT()) || d < (r.inicioHistorico || HIST_INICIO)) ? [] : esperadas.filter(id => !(r.lojasOk[d] || []).includes(id));
  const faltasPeriodo = (ini, fim) => {
    const lim = addDias(r.hoje || hojeBRT(), -1); let dias = 0; const lojas = new Set();
    for (let d = ini; d <= fim && d <= lim; d = addDias(d, 1)) { const f = faltasDia(d); if (f.length) { dias++; f.forEach(x => lojas.add(x)); } }
    return { dias, lojas:[...lojas] };
  };

  // ---- lista de colaboradores (só quem separou ou trabalhou no período)
  const nomes = new Set();
  Object.values(r.dias).forEach(l => l.forEach(u => { if (u.sep + u.conf + u.inv + u.aloc > 0) nomes.add(u.usuario); }));
  const $c = document.getElementById('s-colab');
  if ($c) {
    const lista = [...nomes].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    if (s.colab !== 'todos' && !nomes.has(s.colab)) lista.push(s.colab);
    $c.innerHTML = `<option value="todos">Todos os colaboradores</option>` +
      lista.map(n => `<option value="${esc(n)}" ${s.colab===n?'selected':''}>${esc(n)}${ehGenerico(n) ? ' (login genérico)' : ''}</option>`).join('');
  }

  const serie = serieSep(r, s.colab);
  const anos = [...new Set(Object.keys(serie).map(d => d.slice(0, 4)))].sort();
  if (!s.nivel) { s.nivel = anos.length > 1 ? 'anos' : 'ano'; s.ano = hoje.slice(0, 4); }
  s.ano ||= hoje.slice(0, 4);

  // ---- cartões
  const vHoje = serie[hoje]?.v;
  const ultFechado = Object.keys(serie).filter(d => d < hoje && serie[d].ativo).sort().at(-1);
  const mesAtual = hoje.slice(0, 7);
  const mesAnt = addDias(mesAtual + '-01', -1).slice(0, 7);
  const aMes = agrega(serie, d => d.startsWith(mesAtual) && d < hoje);
  const aMesAnt = agrega(serie, d => d.startsWith(mesAnt));
  const aAno = agrega(serie, d => d.startsWith(hoje.slice(0, 4)));
  const totMes = aMes.v + (vHoje || 0);
  const vMedia = varPct(aMes.media, aMesAnt.media);
  // produtividade do mês (dias fechados): separações por hora disponível e conferência sem dono
  let sepH = 0, hrsH = 0, confTot = 0, confGen = 0;
  for (const [d, l] of Object.entries(r.dias)) {
    if (!d.startsWith(mesAtual) || d >= hoje) continue;
    for (const u of l) {
      if (s.colab !== 'todos' && u.usuario !== s.colab) continue;
      confTot += u.conf; if (ehGenerico(u.usuario)) confGen += u.conf;
      if (u.sep > 0 && funcaoDe(u.usuario) === 'operacional') { sepH += u.sep; hrsH += horasDia(d); }
    }
  }
  const kpis = `
    <div class="kpis">
      <div class="kpi destaque"><div class="rot">Hoje</div><div class="val">${vHoje != null ? fmtN(vHoje) : '–'}</div><div class="det">${r.hojeEm ? `parcial, até ${horaBR(r.hojeEm)}` : 'ainda sem leitura hoje'}</div></div>
      <div class="kpi"><div class="rot">Último dia trabalhado</div><div class="val">${ultFechado ? fmtN(serie[ultFechado].v) : '–'}</div><div class="det">${ultFechado ? `${dataBR(ultFechado)} (${SEMANA_LONGO[diaSem(ultFechado)]})` : 'sem dados'}</div></div>
      <div class="kpi"><div class="rot">${MESES_LONGO[+mesAtual.slice(5) - 1]} até agora</div><div class="val">${fmtN(totMes)}</div><div class="det">média ${fmtN(Math.round(aMes.media))}/dia em ${aMes.dias} dia(s) fechados</div></div>
      <div class="kpi"><div class="rot">Média diária vs ${MESES[+mesAnt.slice(5) - 1].toLowerCase()}</div><div class="val">${fmtVar(vMedia)}</div><div class="det">${aMesAnt.dias ? `${fmtN(Math.round(aMes.media))} x ${fmtN(Math.round(aMesAnt.media))} por dia trabalhado` : `sem dados de ${MESES_LONGO[+mesAnt.slice(5) - 1].toLowerCase()} ainda`}</div></div>
      <div class="kpi destaque"><div class="rot">Separações por hora · ${MESES[+mesAtual.slice(5) - 1].toLowerCase()}</div><div class="val">${hrsH ? fmtH(sepH / hrsH) : '–'}</div><div class="det">só função operacional · pedidos por hora disponível${s.colab !== 'todos' ? ` · ${esc(s.colab)}` : ''}</div></div>
      ${s.colab === 'todos' ? `<div class="kpi"><div class="rot">Conferência sem dono · ${MESES[+mesAtual.slice(5) - 1].toLowerCase()}</div><div class="val">${fmtP(confGen, confTot)}</div><div class="det">${fmtN(confGen)} de ${fmtN(confTot)} conferências em logins genéricos</div></div>` : ''}
    </div>`;

  // ---- barras do nível atual
  let barras = [], titulo = '', rotulos = true, escopo = () => true, escopoNome = '';
  if (s.modo === 'periodo') {
    if (s.nivel === 'anos') {
      titulo = 'Pedidos separados por ano';
      barras = anos.map(a => { const x = agrega(serie, d => d.startsWith(a)); return { k:a, rot:a, ...x, f: d => d.startsWith(a), nome: a, abrir:() => { s.nivel = 'ano'; s.ano = a; s.sel = null; } }; });
    } else if (s.nivel === 'ano') {
      titulo = `Pedidos separados por mês · ${s.ano}`;
      barras = MESES.map((m, i) => {
        const mm = `${s.ano}-${String(i + 1).padStart(2, '0')}`;
        const x = agrega(serie, d => d.startsWith(mm));
        const futuro = mm > mesAtual;
        return { k:mm, rot:m, ...x, f: d => d.startsWith(mm), vazio: futuro, parcial: mm === mesAtual, nome: `${MESES_LONGO[i]} ${s.ano}`, abrir: futuro ? null : () => { s.nivel = 'mes'; s.mes = mm; s.sel = null; } };
      });
    } else {
      const [a, m] = s.mes.split('-').map(Number);
      const nDias = new Date(Date.UTC(a, m, 0)).getUTCDate();
      titulo = `Pedidos separados por dia · ${MESES_LONGO[m - 1]} ${a}`;
      rotulos = false;
      barras = Array.from({ length: nDias }, (_, i) => {
        const d = `${s.mes}-${String(i + 1).padStart(2, '0')}`;
        const x = serie[d] || { v: 0, ativo: false };
        return { k:d, rot:String(i + 1), v:x.v, dias:x.ativo ? 1 : 0, media:x.v, f: dd => dd === d, vazio: d > hoje, parcial: d === hoje, nome: `${dataBR(d)} (${SEMANA_LONGO[diaSem(d)]})`,
          dica: `${dataBR(d)} (${SEMANA_LONGO[diaSem(d)]}) · ${fmtN(x.v)} separados${d === hoje ? ' · parcial' : ''}`,
        };
      });
    }
  } else {
    // dia da semana: média por dia trabalhado dentro do escopo atual
    if (s.nivel === 'mes') { escopo = d => d.startsWith(s.mes); escopoNome = `${MESES_LONGO[+s.mes.slice(5) - 1]} ${s.mes.slice(0, 4)}`; }
    else if (s.nivel === 'ano') { escopo = d => d.startsWith(s.ano); escopoNome = s.ano; }
    else { escopoNome = 'todo o histórico'; }
    titulo = `Média de pedidos separados por dia da semana · ${escopoNome}`;
    barras = [1, 2, 3, 4, 5, 6, 0].map(w => {
      const x = agrega(serie, d => escopo(d) && d < hoje && diaSem(d) === w);
      return { k:'w' + w, rot:SEMANA[w], v:Math.round(x.media), dias:x.dias, media:x.media, total:x.v, f: d => escopo(d) && d < hoje && diaSem(d) === w, nome: `${SEMANA_LONGO[w]} · ${escopoNome}`,
        dica: `${SEMANA_LONGO[w]} · média ${fmtN(Math.round(x.media))} por dia · ${x.dias} dia(s) trabalhados · total ${fmtN(x.v)}` };
    }).filter(b => b.k !== 'w0' || b.dias > 0);
  }

  // ---- dados incompletos (alguma loja ainda sem o dia coletado)
  barras.forEach(b => {
    let fp = null;
    if (s.modo === 'periodo' && s.nivel === 'mes') fp = faltasPeriodo(b.k, b.k);
    else if (s.modo === 'periodo' && s.nivel === 'ano') fp = faltasPeriodo(b.k + '-01', b.k + '-31');
    if (fp && fp.dias) { b.incompleto = fp; b.dica = (b.dica || `${b.rot} · ${fmtN(b.v)} separados`) + ` · ⚠ incompleto: falta ${fp.lojas.map(nomeLoja).join(', ')}${s.nivel === 'ano' ? ` em ${fp.dias} dia(s)` : ''}`; }
  });

  // ---- clique seleciona a barra (detalhe por colaborador abaixo); duplo clique ou botão "Abrir" desce o nível
  barras.forEach(b => { b.sel = s.sel === b.k; b.acao = (b.vazio || !(b.v || b.dias)) ? null : () => { s.sel = s.sel === b.k ? null : b.k; }; });
  const selBarra = barras.find(b => b.sel);
  const alvoDescer = (selBarra && selBarra.abrir) ? selBarra : [...barras].reverse().find(b => b.abrir && (b.v || b.dias));
  const podeSubir = s.modo === 'periodo' && (s.nivel === 'mes' || (s.nivel === 'ano' && anos.length > 1));

  // ---- visão geral sem filtro de colaborador: empilha por loja
  const lojasVis = ORDEM_LOJAS.filter(id => state.cnpjs.some(c => c.id === id));
  const empilhar = s.cnpj === 'todos' && s.colab === 'todos' && r.porCnpj && lojasVis.length > 1;
  if (empilhar) barras.forEach(b => {
    if (!b.f) return;
    const tot = {};
    for (const [d, o] of Object.entries(r.porCnpj)) if (b.f(d)) for (const [id, v] of Object.entries(o)) tot[id] = (tot[id] || 0) + v;
    const div = s.modo === 'semana' ? (b.dias || 1) : 1;
    b.seg = lojasVis.map(id => ({ id, v: (tot[id] || 0) / div })).filter(x => x.v > 0);
    const somaSeg = b.seg.reduce((t, x) => t + x.v, 0);
    if (somaSeg) b.dica = (b.dica || `${b.rot} · ${fmtN(b.v)} separados${b.parcial ? ' · em andamento' : ''}`) + ' — ' +
      b.seg.map(x => `${nomeLoja(x.id)} ${fmtN(Math.round(x.v))} (${fmtP(x.v, somaSeg)})`).join(' · ');
  });
  const maxV = Math.max(1, ...barras.map(b => b.v || 0));
  const n = barras.length;
  const serieUnica = s.cnpj !== 'todos' ? estiloSerie(s.cnpj) : 'background-color:var(--pri);';
  const grafico = `
    <div class="dgraf" style="grid-template-columns:repeat(${n},1fr)">
      ${barras.map((b, i) => `
        <div class="dcol ${b.acao ? '' : 'nao'} ${b.sel ? 'sel' : ''}" data-i="${i}" data-dica="${esc(b.dica || `${b.rot} · ${fmtN(b.v)} separados · ${b.dias} dia(s) trabalhados · média ${fmtN(Math.round(b.media))}/dia${b.parcial ? ' · em andamento' : ''}`)}">
          ${rotulos && b.v ? `<span class="rotv" style="bottom:calc(${b.v / maxV * 100}% + 3px)">${b.incompleto ? '⚠ ' : ''}${fmtN(b.v)}</span>` : (b.incompleto ? `<span class="rotv aviso-barra" style="bottom:calc(${(b.v || 0) / maxV * 100}% + 3px)">⚠</span>` : '')}
          ${b.seg && b.seg.length
            ? `<div class="pilha" style="height:${(b.v || 0) / maxV * 100}%">${[...b.seg].reverse().map(x => `<div class="seg ${b.parcial ? 'parcial' : ''}" style="flex:${x.v} 1 0;${estiloSerie(x.id)}"></div>`).join('')}</div>`
            : b.v ? `<div class="bar ${b.parcial ? 'parcial' : ''}" style="height:${b.v / maxV * 100}%;${serieUnica}"></div>` : ''}
        </div>`).join('')}
    </div>
    <div class="deixo" style="grid-template-columns:repeat(${n},1fr)">${barras.map(b => `<span>${b.rot}</span>`).join('')}</div>`;

  // ---- trilha (breadcrumb) e abas
  const trilha = [];
  if (anos.length > 1) trilha.push(s.nivel === 'anos' ? `<b>Todos os anos</b>` : `<a data-ir="anos">Todos os anos</a>`);
  trilha.push(s.nivel === 'ano' ? `<b>${s.ano}</b>` : s.nivel === 'mes' ? `<a data-ir="ano">${s.mes.slice(0, 4)}</a>` : '');
  const comDia = s.nivel === 'mes' && selBarra && s.modo === 'periodo';
  if (s.nivel === 'mes') trilha.push(comDia ? `<a data-ir="mes">${MESES_LONGO[+s.mes.slice(5) - 1]}</a>` : `<b>${MESES_LONGO[+s.mes.slice(5) - 1]}</b>`);
  if (comDia) trilha.push(`<b>${dataBR(selBarra.k)}</b>`);
  const dicaNivel = s.modo === 'semana' ? 'Média por dia trabalhado, sem contar o dia de hoje.'
    : 'Clique numa barra para ver por colaborador · duplo clique abre o nível abaixo.';

  const painel = `
    <div class="painel">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <h3 style="margin:0;flex:1">${titulo}</h3>
        ${s.modo === 'periodo' ? `<div class="nivel">
          <button class="btn" id="n-subir" ${podeSubir ? '' : 'disabled'} title="Voltar ao nível acima">▲ Subir nível</button>
          <button class="btn" id="n-descer" ${alvoDescer ? '' : 'disabled'} title="Abrir o período selecionado (ou o mais recente)">▼ ${alvoDescer ? `Abrir ${esc(alvoDescer.nome)}` : 'Descer nível'}</button>
        </div>` : ''}
        <div class="abas"><button data-modo="periodo" class="${s.modo==='periodo'?'on':''}">Por período</button><button data-modo="semana" class="${s.modo==='semana'?'on':''}">Por dia da semana</button></div>
      </div>
      <div class="trilha">${trilha.filter(Boolean).join('<span class="sep">›</span>')}<span class="info" style="margin-left:auto">${dicaNivel}${s.colab !== 'todos' ? ` · Filtro: ${esc(s.colab)}` : ''}</span></div>
      ${grafico}
      <div class="legenda">${empilhar
        ? lojasVis.map(id => `<span><i style="${estiloSerie(id)}"></i>${esc(nomeLoja(id))}</span>`).join('')
        : `<span><i style="${serieUnica}"></i>Pedidos separados${s.cnpj !== 'todos' ? ` · ${esc(nomeLoja(s.cnpj))}` : ''}</span>`}
        <span><i style="background:#9aa4b5;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)"></i>Em andamento (parcial)</span>
        ${barras.some(b => b.incompleto) ? `<span>⚠ Dados incompletos: alguma loja ainda não foi coletada nesse período</span>` : ''}</div>
    </div>`;

  // ---- tabela do nível
  let tabela = '';
  if (s.modo === 'periodo' && s.nivel !== 'mes') {
    const linhas = barras.filter(b => !b.vazio && (b.v || b.dias));
    tabela = `
      <div class="painel">
        <h3>${s.nivel === 'anos' ? 'Por ano' : 'Por mês'}</h3>
        <div class="leg">Variação da média diária contra o período anterior (compara ritmo, não total, para meses com nº de dias diferente)</div>
        <div style="overflow-x:auto"><table><thead><tr><th>Período</th><th class="n">Separados</th>${empilhar ? lojasVis.map(id => `<th class="n">${esc(nomeLoja(id))}</th>`).join('') : ''}<th class="n">Dias trabalhados</th><th class="n">Média/dia</th><th class="n">Var. média/dia</th></tr></thead><tbody>
        ${linhas.map((b, i) => `<tr><td>${s.nivel === 'ano' ? MESES_LONGO[+b.k.slice(5) - 1] : b.k}${b.parcial ? ' <span class="info">(em andamento)</span>' : ''}</td><td class="n">${fmtN(b.v)}</td>${empilhar ? lojasVis.map(id => { const v = (b.seg || []).find(x => x.id === id)?.v || 0; return `<td class="n">${fmtN(Math.round(v))} <span class="info">${fmtP(v, b.v)}</span></td>`; }).join('') : ''}<td class="n">${b.dias}</td><td class="n">${fmtN(Math.round(b.media))}</td><td class="n">${i ? fmtVar(varPct(b.media, linhas[i - 1].media)) : '–'}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="n">${fmtN(linhas.reduce((t, b) => t + b.v, 0))}</td>${empilhar ? lojasVis.map(id => { const v = linhas.reduce((t, b) => t + ((b.seg || []).find(x => x.id === id)?.v || 0), 0); const tt = linhas.reduce((t, b) => t + b.v, 0); return `<td class="n">${fmtN(Math.round(v))} <span class="info">${fmtP(v, tt)}</span></td>`; }).join('') : ''}<td class="n">${linhas.reduce((t, b) => t + b.dias, 0)}</td><td class="n"></td><td class="n"></td></tr>
        </tbody></table></div>
      </div>`;
  } else if (s.modo === 'semana') {
    tabela = `
      <div class="painel">
        <h3>Por dia da semana · ${escopoNome}</h3>
        <div class="leg">Dia da semana com menos de 4 dias trabalhados no período tem média pouco confiável. Para comparar ritmo, prefira o ano inteiro.</div>
        <table><thead><tr><th>Dia</th><th class="n">Dias trabalhados</th><th class="n">Total separado</th><th class="n">Média/dia</th></tr></thead><tbody>
        ${barras.map(b => `<tr><td>${SEMANA_LONGO[+b.k.slice(1)]}</td><td class="n">${b.dias}</td><td class="n">${fmtN(b.total)}</td><td class="n">${fmtN(Math.round(b.media))}</td></tr>`).join('')}
        </tbody></table>
      </div>`;
  }

  // ---- detalhe por colaborador (micro): da barra selecionada ou de todo o período em tela
  let fDet, nomeDet;
  if (selBarra) { fDet = selBarra.f; nomeDet = selBarra.nome; }
  else if (s.modo === 'semana') { fDet = d => escopo(d) && d < hoje; nomeDet = escopoNome; }
  else if (s.nivel === 'mes') { fDet = d => d.startsWith(s.mes); nomeDet = `${MESES_LONGO[+s.mes.slice(5) - 1]} ${s.mes.slice(0, 4)}`; }
  else if (s.nivel === 'ano') { fDet = d => d.startsWith(s.ano); nomeDet = s.ano; }
  else { fDet = () => true; nomeDet = 'todo o histórico'; }
  const porPessoa = {};
  for (const [d, l] of Object.entries(r.dias)) {
    if (!fDet(d)) continue;
    for (const u of l) {
      if (s.colab !== 'todos' && u.usuario !== s.colab) continue;
      const ativo = (u.sep + u.conf + u.inv + u.aloc) > 0;
      if (!ativo) continue;
      const p = (porPessoa[u.usuario] ||= { usuario:u.usuario, dias:0, horas:0, sep:0, conf:0, aloc:0, inv:0 });
      p.dias++; p.horas += horasDia(d); p.sep += u.sep; p.conf += u.conf; p.aloc += u.aloc; p.inv += u.inv;
    }
  }
  Object.values(porPessoa).forEach(p => { p.funcao = funcaoDe(p.usuario); });
  const opDet = Object.values(porPessoa).filter(p => p.funcao === 'operacional' && p.sep > 0);
  const hsOp = opDet.reduce((x, u) => x + u.horas, 0), sepOp = opDet.reduce((x, u) => x + u.sep, 0);
  let fpDet = { dias:0, lojas:[] };
  if (selBarra && s.modo === 'periodo' && s.nivel === 'mes') fpDet = faltasPeriodo(selBarra.k, selBarra.k);
  else if (selBarra && s.modo === 'periodo' && s.nivel === 'ano') fpDet = faltasPeriodo(selBarra.k + '-01', selBarra.k + '-31');
  else if (!selBarra && s.modo === 'periodo' && s.nivel === 'mes') fpDet = faltasPeriodo(s.mes + '-01', s.mes + '-31');
  else if (!selBarra && s.modo === 'periodo' && s.nivel === 'ano') fpDet = faltasPeriodo(s.ano + '-01-01', s.ano + '-12-31');
  const listaDet = Object.values(porPessoa).sort((a, b) => b.sep - a.sep || b.conf - a.conf || a.usuario.localeCompare(b.usuario, 'pt-BR'));
  const tDet = k => listaDet.reduce((x, u) => x + (u[k] || 0), 0);
  const sepDet = tDet('sep');
  const detalhe = `
    <div class="painel">
      <h3>Por colaborador · ${esc(nomeDet)}${selBarra?.parcial ? ' · parcial' : ''}</h3>
      ${fpDet.dias ? `<div class="aviso" style="margin:6px 0 10px">⚠ Período incompleto: ainda faltam dados de <b>${esc(fpDet.lojas.map(nomeLoja).join(', '))}</b>${fpDet.dias > 1 ? ` em ${fpDet.dias} dias` : ''}. Os números vão mudar quando a coleta terminar.</div>` : ''}
      <div class="leg">${selBarra ? 'Barra selecionada no gráfico. Clique nela de novo para voltar ao período inteiro.' : 'Período inteiro em tela. Clique numa barra do gráfico para filtrar.'} Do maior para o menor número de separações (pedidos separados); "Dias" conta só os dias com atividade; "Por hora" usa as horas disponíveis da jornada nesses dias. A média por hora do time (linha Operacional) considera só a função operacional: líderes, apoio, gestão e logins genéricos ficam fora.</div>
      ${listaDet.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Colaborador</th><th>Função</th><th class="n">Dias</th><th class="n">Horas disp.</th><th class="n">Separações</th><th class="n">Média/dia</th><th class="n">Por hora</th><th class="n">% das separações</th><th class="n">Conferências</th><th class="n">Alocações</th><th class="n">Inventários</th></tr></thead><tbody>
        ${listaDet.map(u => `<tr${u.funcao !== 'operacional' ? ' style="color:var(--mute)"' : ''}><td>${esc(u.usuario)}</td><td>${u.funcao === 'operacional' ? 'operacional' : `<span class="info">${ROT_FUNCAO[u.funcao] || u.funcao}</span>`}</td><td class="n">${u.dias}</td><td class="n">${fmtN(u.horas)}</td><td class="n">${fmtN(u.sep)}</td><td class="n">${u.dias ? fmtN(Math.round(u.sep / u.dias)) : '–'}</td><td class="n"><b>${u.horas && u.sep ? fmtH(u.sep / u.horas) : '–'}</b></td><td class="n">${fmtP(u.sep, sepDet)}</td><td class="n">${fmtN(u.conf)}</td><td class="n">${fmtN(u.aloc)}</td><td class="n">${fmtN(u.inv)}</td></tr>`).join('')}
        <tr class="tot"><td>Operacional</td><td>${opDet.length} pessoa(s)</td><td class="n"></td><td class="n">${fmtN(hsOp)}</td><td class="n">${fmtN(sepOp)}</td><td class="n"></td><td class="n">${hsOp ? fmtH(sepOp / hsOp) : '–'}</td><td class="n">${fmtP(sepOp, sepDet)}</td><td class="n"></td><td class="n"></td><td class="n"></td></tr>
        <tr class="tot"><td>Total geral</td><td></td><td class="n"></td><td class="n">${fmtN(tDet('horas'))}</td><td class="n">${fmtN(sepDet)}</td><td class="n"></td><td class="n"></td><td class="n">100%</td><td class="n">${fmtN(tDet('conf'))}</td><td class="n">${fmtN(tDet('aloc'))}</td><td class="n">${fmtN(tDet('inv'))}</td></tr>
        </tbody></table></div>` : `<div class="vazio">Sem atividade registrada neste período.</div>`}
    </div>`;

  // mapa de calor pessoa x dia (só no nível de mês)
  let mapa = '';
  if (s.modo === 'periodo' && s.nivel === 'mes') {
    const diasMes = Object.keys(r.dias).filter(d => d.startsWith(s.mes) && r.dias[d].some(u => u.sep > 0)).sort();
    const pess = {};
    diasMes.forEach(d => r.dias[d].forEach(u => {
      if (u.sep <= 0 || (s.colab !== 'todos' && u.usuario !== s.colab)) return;
      (pess[u.usuario] ||= { usuario:u.usuario, tot:0, d:{} }); pess[u.usuario].d[d] = u.sep; pess[u.usuario].tot += u.sep;
    }));
    const lp = Object.values(pess).sort((a, b) => b.tot - a.tot);
    const mx = Math.max(1, ...lp.flatMap(p => Object.values(p.d)));
    if (lp.length && diasMes.length) mapa = `
    <div class="painel">
      <h3>Separações por dia · ${MESES_LONGO[+s.mes.slice(5) - 1]} ${s.mes.slice(0, 4)}</h3>
      <div class="leg">Pedidos separados por pessoa em cada dia trabalhado. Quanto mais escuro, mais pedidos. Célula vazia = sem separação no dia.</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Colaborador</th>${diasMes.map(d => `<th class="n">${d.slice(8)}<br><span class="info">${SEMANA[diaSem(d)]}</span></th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
        ${lp.map(p => `<tr><td style="white-space:nowrap">${esc(p.usuario)}</td>${diasMes.map(d => { const v = p.d[d] || 0; const a = v ? .12 + .7 * v / mx : 0;
          return `<td class="n" style="background:rgba(2,40,90,${a});${a > .45 ? 'color:#fff' : ''}">${v ? fmtN(v) : ''}</td>`; }).join('')}<td class="n"><b>${fmtN(p.tot)}</b></td></tr>`).join('')}
        <tr class="tot"><td>Total</td>${diasMes.map(d => `<td class="n">${fmtN(lp.reduce((t, p) => t + (p.d[d] || 0), 0))}</td>`).join('')}<td class="n">${fmtN(lp.reduce((t, p) => t + p.tot, 0))}</td></tr>
      </tbody></table></div>
    </div>`;
  }

  $s.innerHTML = (r.faltando ? avisoColeta(r, 's-coletar') : '') + kpis + painel + detalhe + mapa + tabela +
    `<div class="info">Fonte: Seenc WMS (users/performance). Conta o dia em que o pedido foi separado, não o dia da venda: dias após feriado tendem a ser maiores. Histórico desde ${dataBR(r.inicioHistorico || HIST_INICIO)}.</div>`;

  $s.querySelectorAll('.dcol').forEach(el => {
    const b = barras[+el.dataset.i];
    if (b?.acao) el.onclick = () => { b.acao(); renderSep($s, r); };
    if (b?.abrir) el.ondblclick = () => { b.abrir(); renderSep($s, r); };
  });
  const subir = () => { if (s.nivel === 'mes') s.nivel = 'ano'; else if (s.nivel === 'ano' && anos.length > 1) s.nivel = 'anos'; s.sel = null; renderSep($s, r); };
  const bS = document.getElementById('n-subir'); if (bS) bS.onclick = subir;
  const bD = document.getElementById('n-descer'); if (bD && alvoDescer) bD.onclick = () => { alvoDescer.abrir(); renderSep($s, r); };
  $s.querySelectorAll('[data-ir]').forEach(el => el.onclick = () => { const ir = el.dataset.ir; if (ir === 'anos') { s.nivel = 'anos'; } else if (ir === 'ano') { s.nivel = 'ano'; } s.sel = null; renderSep($s, r); });
  $s.querySelectorAll('[data-modo]').forEach(el => el.onclick = () => { s.modo = el.dataset.modo; s.sel = null; renderSep($s, r); });
  ligarColeta('s-coletar', () => carregarSep(true));
  ligarDicas($s);
}

function ligarDicas(raiz){
  const dica = document.getElementById('dica');
  raiz.querySelectorAll('[data-dica]').forEach(el => {
    el.onmousemove = e => {
      dica.textContent = el.dataset.dica; dica.style.display = 'block';
      const w = dica.offsetWidth, x = e.clientX + 12 + w > innerWidth - 8 ? Math.max(8, e.clientX - 12 - w) : e.clientX + 12;
      dica.style.left = x + 'px'; dica.style.top = (e.clientY + 14) + 'px';
    };
    el.onmouseleave = () => { dica.style.display = 'none'; };
  });
}

/* =================== INÍCIO =================== */
document.getElementById('btn-home').onclick = () => irPara('separados');
async function iniciar(){
  document.getElementById('logo-topo').src = LOGOS.VALENRO;
  document.getElementById('selo-demo').hidden = !DEMO;
  if (DEMO) {
    state.cnpjs = [{ id:'DIGOS', nome:'Digos' }, { id:'CACAL', nome:'Cacal' }, { id:'DROSA', nome:"D'Rosa" }];
    state.usuario ||= { nome:'Demonstração', login:'demonstracao', foto:null }; mostrarUsuario(state.usuario);
    return irPara(params.get('tela') || 'separados');
  }
  if (!lerSessao()) return telaLogin();
  try {
    const me = await api('/me');
    state.usuario = me.usuario;
    mostrarUsuario(me.usuario);
    if (me.usuario.foto && !me.usuario.foto_mini) miniDe(me.usuario.foto).then(m => api('/me/foto', { metodo:'POST', corpo:{ foto:me.usuario.foto, foto_mini:m } })).catch(() => {});
    state.cnpjs = (await api('/cnpjs')).cnpjs;
    irPara(params.get('tela') || 'separados');
  } catch (e) {
    if (e instanceof SemSessao) return telaLogin();
    $app.innerHTML = `<div class="erro"><b>Não foi possível conectar ao servidor.</b><br>${esc(e.message)}</div>`;
  }
}
iniciar();
window.addEventListener('unhandledrejection', ev => { if (ev.reason instanceof SemSessao) { ev.preventDefault(); telaLogin('Sua sessão expirou. Entre novamente.'); } });
</script>
