/* Série diária para o filtro atual: d -> { v: separações, ativo: trabalhou? } */
function serieSep(r, colab){
  const out = {};
  for (const [d, lista] of Object.entries(r.dias)) {
    if (colab === 'todos') {
      const v = lista.reduce((t, u) => t + (u.sep || 0), 0);
      out[d] = { v, ativo: v > 0 };
    } else {
      const u = lista.find(x => x.usuario === colab);
      const v = u ? u.sep : 0;
      out[d] = { v, ativo: !!u && (u.sep + u.conf + u.inv + u.aloc) > 0 };
    }
  }
  return out;
}

function agrega(serie, filtro){
  let v = 0, dias = 0;
  for (const [d, x] of Object.entries(serie)) if (filtro(d)) { v += x.v; if (x.ativo) dias++; }
  return { v, dias, media: dias ? v / dias : 0 };
}

function renderSep($s, r){
  const _d = document.getElementById('dica'); if (_d) _d.style.display = 'none';
  const s = state.sep, hoje = r.hoje || hojeBRT(), ontem = addDias(hoje, -1);
  // função de cada colaborador (tabela operacoes.colaboradores); sem cadastro = operacional
  const funcaoDe = u => ehGenerico(u) ? 'generico' : ((r.funcoes || {})[String(u).toLowerCase().trim()] || 'operacional');
  const ROT_FUNCAO = { lider:'líder', apoio:'apoio', gestao:'gestão', generico:'login genérico' };
  // cobertura: dias fechados em que alguma loja esperada ainda não foi coletada
  const esperadas = s.cnpj === 'todos' ? (r.lojasEsperadas || []) : [s.cnpj];
  const faltasDia = d => (!r.lojasOk || d >= (r.hoje || hojeBRT()) || d < (r.inicioHistorico || HIST_INICIO)) ? [] : esperadas.filter(id => !(r.lojasOk[d] || []).includes(id));
  const faltasPeriodo = (ini, fim) => {
    const lim = addDias(r.hoje || hojeBRT(), -1); let dias = 0; const lojas = new Set();
    for (let d = ini; d <= fim && d <= lim; d = addDias(d, 1)) { const f = faltasDia(d); if (f.length) { dias++; f.forEach(x => lojas.add(x)); } }
    return { dias, lojas:[...lojas] };
  };

  // ---- lista de colaboradores (só quem separou ou trabalhou no período)
  const nomes = new Set();
  Object.values(r.dias).forEach(l => l.forEach(u => { if (u.sep + u.conf + u.inv + u.aloc > 0) nomes.add(u.usuario); }));
  const $c = document.getElementById('s-colab');
  if ($c) {
    const lista = [...nomes].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    if (s.colab !== 'todos' && !nomes.has(s.colab)) lista.push(s.colab);
    $c.innerHTML = `<option value="todos">Todos os colaboradores</option>` +
      lista.map(n => `<option value="${esc(n)}" ${s.colab===n?'selected':''}>${esc(n)}${ehGenerico(n) ? ' (login genérico)' : ''}</option>`).join('');
  }

  const serie = serieSep(r, s.colab);
  const anos = [...new Set(Object.keys(serie).map(d => d.slice(0, 4)))].sort();
  if (!s.nivel) { s.nivel = anos.length > 1 ? 'anos' : 'ano'; s.ano = hoje.slice(0, 4); }
  s.ano ||= hoje.slice(0, 4);

  // ---- cartões
  const vHoje = serie[hoje]?.v;
  const ultFechado = Object.keys(serie).filter(d => d < hoje && serie[d].ativo).sort().at(-1);
  const mesAtual = hoje.slice(0, 7);
  const mesAnt = addDias(mesAtual + '-01', -1).slice(0, 7);
  const aMes = agrega(serie, d => d.startsWith(mesAtual) && d < hoje);
  const aMesAnt = agrega(serie, d => d.startsWith(mesAnt));
  const aAno = agrega(serie, d => d.startsWith(hoje.slice(0, 4)));
  const totMes = aMes.v + (vHoje || 0);
  const vMedia = varPct(aMes.media, aMesAnt.media);
  // produtividade do mês (dias fechados): separações por hora disponível e conferência sem dono
  let sepH = 0, hrsH = 0, confTot = 0, confGen = 0;
  for (const [d, l] of Object.entries(r.dias)) {
    if (!d.startsWith(mesAtual) || d >= hoje) continue;
    for (const u of l) {
      if (s.colab !== 'todos' && u.usuario !== s.colab) continue;
      confTot += u.conf; if (ehGenerico(u.usuario)) confGen += u.conf;
      if (u.sep > 0 && funcaoDe(u.usuario) === 'operacional') { sepH += u.sep; hrsH += horasDia(d); }
    }
  }
  const kpis = `
    <div class="kpis">
      <div class="kpi destaque"><div class="rot">Hoje</div><div class="val">${vHoje != null ? fmtN(vHoje) : '–'}</div><div class="det">${r.hojeEm ? `parcial, até ${horaBR(r.hojeEm)}` : 'ainda sem leitura hoje'}</div></div>
      <div class="kpi"><div class="rot">Último dia trabalhado</div><div class="val">${ultFechado ? fmtN(serie[ultFechado].v) : '–'}</div><div class="det">${ultFechado ? `${dataBR(ultFechado)} (${SEMANA_LONGO[diaSem(ultFechado)]})` : 'sem dados'}</div></div>
      <div class="kpi"><div class="rot">${MESES_LONGO[+mesAtual.slice(5) - 1]} até agora</div><div class="val">${fmtN(totMes)}</div><div class="det">média ${fmtN(Math.round(aMes.media))}/dia em ${aMes.dias} dia(s) fechados</div></div>
      <div class="kpi"><div class="rot">Média diária vs ${MESES[+mesAnt.slice(5) - 1].toLowerCase()}</div><div class="val">${fmtVar(vMedia)}</div><div class="det">${aMesAnt.dias ? `${fmtN(Math.round(aMes.media))} x ${fmtN(Math.round(aMesAnt.media))} por dia trabalhado` : `sem dados de ${MESES_LONGO[+mesAnt.slice(5) - 1].toLowerCase()} ainda`}</div></div>
      <div class="kpi destaque"><div class="rot">Separações por hora · ${MESES[+mesAtual.slice(5) - 1].toLowerCase()}</div><div class="val">${hrsH ? fmtH(sepH / hrsH) : '–'}</div><div class="det">só função operacional · pedidos por hora disponível${s.colab !== 'todos' ? ` · ${esc(s.colab)}` : ''}</div></div>
      ${s.colab === 'todos' ? `<div class="kpi"><div class="rot">Conferência sem dono · ${MESES[+mesAtual.slice(5) - 1].toLowerCase()}</div><div class="val">${fmtP(confGen, confTot)}</div><div class="det">${fmtN(confGen)} de ${fmtN(confTot)} conferências em logins genéricos</div></div>` : ''}
    </div>`;

  // ---- barras do nível atual
  let barras = [], titulo = '', rotulos = true, escopo = () => true, escopoNome = '';
  if (s.modo === 'periodo') {
    if (s.nivel === 'anos') {
      titulo = 'Pedidos separados por ano';
      barras = anos.map(a => { const x = agrega(serie, d => d.startsWith(a)); return { k:a, rot:a, ...x, f: d => d.startsWith(a), nome: a, abrir:() => { s.nivel = 'ano'; s.ano = a; s.sel = null; } }; });
    } else if (s.nivel === 'ano') {
      titulo = `Pedidos separados por mês · ${s.ano}`;
      barras = MESES.map((m, i) => {
        const mm = `${s.ano}-${String(i + 1).padStart(2, '0')}`;
        const x = agrega(serie, d => d.startsWith(mm));
        const futuro = mm > mesAtual;
        return { k:mm, rot:m, ...x, f: d => d.startsWith(mm), vazio: futuro, parcial: mm === mesAtual, nome: `${MESES_LONGO[i]} ${s.ano}`, abrir: futuro ? null : () => { s.nivel = 'mes'; s.mes = mm; s.sel = null; } };
      });
    } else {
      const [a, m] = s.mes.split('-').map(Number);
      const nDias = new Date(Date.UTC(a, m, 0)).getUTCDate();
      titulo = `Pedidos separados por dia · ${MESES_LONGO[m - 1]} ${a}`;
      rotulos = false;
      barras = Array.from({ length: nDias }, (_, i) => {
        const d = `${s.mes}-${String(i + 1).padStart(2, '0')}`;
        const x = serie[d] || { v: 0, ativo: false };
        return { k:d, rot:String(i + 1), v:x.v, dias:x.ativo ? 1 : 0, media:x.v, f: dd => dd === d, vazio: d > hoje, parcial: d === hoje, nome: `${dataBR(d)} (${SEMANA_LONGO[diaSem(d)]})`,
          dica: `${dataBR(d)} (${SEMANA_LONGO[diaSem(d)]}) · ${fmtN(x.v)} separados${d === hoje ? ' · parcial' : ''}`,
        };
      });
    }
  } else {
    // dia da semana: média por dia trabalhado dentro do escopo atual
    if (s.nivel === 'mes') { escopo = d => d.startsWith(s.mes); escopoNome = `${MESES_LONGO[+s.mes.slice(5) - 1]} ${s.mes.slice(0, 4)}`; }
    else if (s.nivel === 'ano') { escopo = d => d.startsWith(s.ano); escopoNome = s.ano; }
    else { escopoNome = 'todo o histórico'; }
    titulo = `Média de pedidos separados por dia da semana · ${escopoNome}`;
    barras = [1, 2, 3, 4, 5, 6, 0].map(w => {
      const x = agrega(serie, d => escopo(d) && d < hoje && diaSem(d) === w);
      return { k:'w' + w, rot:SEMANA[w], v:Math.round(x.media), dias:x.dias, media:x.media, total:x.v, f: d => escopo(d) && d < hoje && diaSem(d) === w, nome: `${SEMANA_LONGO[w]} · ${escopoNome}`,
        dica: `${SEMANA_LONGO[w]} · média ${fmtN(Math.round(x.media))} por dia · ${x.dias} dia(s) trabalhados · total ${fmtN(x.v)}` };
    }).filter(b => b.k !== 'w0' || b.dias > 0);
  }

  // ---- dados incompletos (alguma loja ainda sem o dia coletado)
  barras.forEach(b => {
    let fp = null;
    if (s.modo === 'periodo' && s.nivel === 'mes') fp = faltasPeriodo(b.k, b.k);
    else if (s.modo === 'periodo' && s.nivel === 'ano') fp = faltasPeriodo(b.k + '-01', b.k + '-31');
    if (fp && fp.dias) { b.incompleto = fp; b.dica = (b.dica || `${b.rot} · ${fmtN(b.v)} separados`) + ` · ⚠ incompleto: falta ${fp.lojas.map(nomeLoja).join(', ')}${s.nivel === 'ano' ? ` em ${fp.dias} dia(s)` : ''}`; }
  });

  // ---- clique seleciona a barra (detalhe por colaborador abaixo); duplo clique ou botão "Abrir" desce o nível
  barras.forEach(b => { b.sel = s.sel === b.k; b.acao = (b.vazio || !(b.v || b.dias)) ? null : () => { s.sel = s.sel === b.k ? null : b.k; }; });
  const selBarra = barras.find(b => b.sel);
  const alvoDescer = (selBarra && selBarra.abrir) ? selBarra : [...barras].reverse().find(b => b.abrir && (b.v || b.dias));
  const podeSubir = s.modo === 'periodo' && (s.nivel === 'mes' || (s.nivel === 'ano' && anos.length > 1));

  // ---- visão geral sem filtro de colaborador: empilha por loja
  const lojasVis = ORDEM_LOJAS.filter(id => state.cnpjs.some(c => c.id === id));
  const empilhar = s.cnpj === 'todos' && s.colab === 'todos' && r.porCnpj && lojasVis.length > 1;
  if (empilhar) barras.forEach(b => {
    if (!b.f) return;
    const tot = {};
    for (const [d, o] of Object.entries(r.porCnpj)) if (b.f(d)) for (const [id, v] of Object.entries(o)) tot[id] = (tot[id] || 0) + v;
    const div = s.modo === 'semana' ? (b.dias || 1) : 1;
    b.seg = lojasVis.map(id => ({ id, v: (tot[id] || 0) / div })).filter(x => x.v > 0);
    const somaSeg = b.seg.reduce((t, x) => t + x.v, 0);
    if (somaSeg) b.dica = (b.dica || `${b.rot} · ${fmtN(b.v)} separados${b.parcial ? ' · em andamento' : ''}`) + ' — ' +
      b.seg.map(x => `${nomeLoja(x.id)} ${fmtN(Math.round(x.v))} (${fmtP(x.v, somaSeg)})`).join(' · ');
  });
  const maxV = Math.max(1, ...barras.map(b => b.v || 0));
  const n = barras.length;
  const serieUnica = s.cnpj !== 'todos' ? estiloSerie(s.cnpj) : 'background-color:var(--pri);';
  const grafico = `
    <div class="dgraf" style="grid-template-columns:repeat(${n},1fr)">
      ${barras.map((b, i) => `
        <div class="dcol ${b.acao ? '' : 'nao'} ${b.sel ? 'sel' : ''}" data-i="${i}" data-dica="${esc(b.dica || `${b.rot} · ${fmtN(b.v)} separados · ${b.dias} dia(s) trabalhados · média ${fmtN(Math.round(b.media))}/dia${b.parcial ? ' · em andamento' : ''}`)}">
          ${rotulos && b.v ? `<span class="rotv" style="bottom:calc(${b.v / maxV * 100}% + 3px)">${b.incompleto ? '⚠ ' : ''}${fmtN(b.v)}</span>` : (b.incompleto ? `<span class="rotv aviso-barra" style="bottom:calc(${(b.v || 0) / maxV * 100}% + 3px)">⚠</span>` : '')}
          ${b.seg && b.seg.length
            ? `<div class="pilha" style="height:${(b.v || 0) / maxV * 100}%">${[...b.seg].reverse().map(x => `<div class="seg ${b.parcial ? 'parcial' : ''}" style="flex:${x.v} 1 0;${estiloSerie(x.id)}"></div>`).join('')}</div>`
            : b.v ? `<div class="bar ${b.parcial ? 'parcial' : ''}" style="height:${b.v / maxV * 100}%;${serieUnica}"></div>` : ''}
        </div>`).join('')}
    </div>
    <div class="deixo" style="grid-template-columns:repeat(${n},1fr)">${barras.map(b => `<span>${b.rot}</span>`).join('')}</div>`;

  // ---- trilha (breadcrumb) e abas
  const trilha = [];
  if (anos.length > 1) trilha.push(s.nivel === 'anos' ? `<b>Todos os anos</b>` : `<a data-ir="anos">Todos os anos</a>`);
  trilha.push(s.nivel === 'ano' ? `<b>${s.ano}</b>` : s.nivel === 'mes' ? `<a data-ir="ano">${s.mes.slice(0, 4)}</a>` : '');
  const comDia = s.nivel === 'mes' && selBarra && s.modo === 'periodo';
  if (s.nivel === 'mes') trilha.push(comDia ? `<a data-ir="mes">${MESES_LONGO[+s.mes.slice(5) - 1]}</a>` : `<b>${MESES_LONGO[+s.mes.slice(5) - 1]}</b>`);
  if (comDia) trilha.push(`<b>${dataBR(selBarra.k)}</b>`);
  const dicaNivel = s.modo === 'semana' ? 'Média por dia trabalhado, sem contar o dia de hoje.'
    : 'Clique numa barra para ver por colaborador · duplo clique abre o nível abaixo.';

  const painel = `
    <div class="painel">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <h3 style="margin:0;flex:1">${titulo}</h3>
        ${s.modo === 'periodo' ? `<div class="nivel">
          <button class="btn" id="n-subir" ${podeSubir ? '' : 'disabled'} title="Voltar ao nível acima">▲ Subir nível</button>
          <button class="btn" id="n-descer" ${alvoDescer ? '' : 'disabled'} title="Abrir o período selecionado (ou o mais recente)">▼ ${alvoDescer ? `Abrir ${esc(alvoDescer.nome)}` : 'Descer nível'}</button>
        </div>` : ''}
        <div class="abas"><button data-modo="periodo" class="${s.modo==='periodo'?'on':''}">Por período</button><button data-modo="semana" class="${s.modo==='semana'?'on':''}">Por dia da semana</button></div>
      </div>
      <div class="trilha">${trilha.filter(Boolean).join('<span class="sep">›</span>')}<span class="info" style="margin-left:auto">${dicaNivel}${s.colab !== 'todos' ? ` · Filtro: ${esc(s.colab)}` : ''}</span></div>
      ${grafico}
      <div class="legenda">${empilhar
        ? lojasVis.map(id => `<span><i style="${estiloSerie(id)}"></i>${esc(nomeLoja(id))}</span>`).join('')
        : `<span><i style="${serieUnica}"></i>Pedidos separados${s.cnpj !== 'todos' ? ` · ${esc(nomeLoja(s.cnpj))}` : ''}</span>`}
        <span><i style="background:#9aa4b5;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)"></i>Em andamento (parcial)</span>
        ${barras.some(b => b.incompleto) ? `<span>⚠ Dados incompletos: alguma loja ainda não foi coletada nesse período</span>` : ''}</div>
    </div>`;

  // ---- tabela do nível
  let tabela = '';
  if (s.modo === 'periodo' && s.nivel !== 'mes') {
    const linhas = barras.filter(b => !b.vazio && (b.v || b.dias));
    tabela = `
      <div class="painel">
        <h3>${s.nivel === 'anos' ? 'Por ano' : 'Por mês'}</h3>
        <div class="leg">Variação da média diária contra o período anterior (compara ritmo, não total, para meses com nº de dias diferente)</div>
        <div style="overflow-x:auto"><table><thead><tr><th>Período</th><th class="n">Separados</th>${empilhar ? lojasVis.map(id => `<th class="n">${esc(nomeLoja(id))}</th>`).join('') : ''}<th class="n">Dias trabalhados</th><th class="n">Média/dia</th><th class="n">Var. média/dia</th></tr></thead><tbody>
        ${linhas.map((b, i) => `<tr><td>${s.nivel === 'ano' ? MESES_LONGO[+b.k.slice(5) - 1] : b.k}${b.parcial ? ' <span class="info">(em andamento)</span>' : ''}</td><td class="n">${fmtN(b.v)}</td>${empilhar ? lojasVis.map(id => { const v = (b.seg || []).find(x => x.id === id)?.v || 0; return `<td class="n">${fmtN(Math.round(v))} <span class="info">${fmtP(v, b.v)}</span></td>`; }).join('') : ''}<td class="n">${b.dias}</td><td class="n">${fmtN(Math.round(b.media))}</td><td class="n">${i ? fmtVar(varPct(b.media, linhas[i - 1].media)) : '–'}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="n">${fmtN(linhas.reduce((t, b) => t + b.v, 0))}</td>${empilhar ? lojasVis.map(id => { const v = linhas.reduce((t, b) => t + ((b.seg || []).find(x => x.id === id)?.v || 0), 0); const tt = linhas.reduce((t, b) => t + b.v, 0); return `<td class="n">${fmtN(Math.round(v))} <span class="info">${fmtP(v, tt)}</span></td>`; }).join('') : ''}<td class="n">${linhas.reduce((t, b) => t + b.dias, 0)}</td><td class="n"></td><td class="n"></td></tr>
        </tbody></table></div>
      </div>`;
  } else if (s.modo === 'semana') {
    tabela = `
      <div class="painel">
        <h3>Por dia da semana · ${escopoNome}</h3>
        <div class="leg">Dia da semana com menos de 4 dias trabalhados no período tem média pouco confiável. Para comparar ritmo, prefira o ano inteiro.</div>
        <table><thead><tr><th>Dia</th><th class="n">Dias trabalhados</th><th class="n">Total separado</th><th class="n">Média/dia</th></tr></thead><tbody>
        ${barras.map(b => `<tr><td>${SEMANA_LONGO[+b.k.slice(1)]}</td><td class="n">${b.dias}</td><td class="n">${fmtN(b.total)}</td><td class="n">${fmtN(Math.round(b.media))}</td></tr>`).join('')}
        </tbody></table>
      </div>`;
  }

  // ---- detalhe por colaborador (micro): da barra selecionada ou de todo o período em tela
  let fDet, nomeDet;
  if (selBarra) { fDet = selBarra.f; nomeDet = selBarra.nome; }
  else if (s.modo === 'semana') { fDet = d => escopo(d) && d < hoje; nomeDet = escopoNome; }
  else if (s.nivel === 'mes') { fDet = d => d.startsWith(s.mes); nomeDet = `${MESES_LONGO[+s.mes.slice(5) - 1]} ${s.mes.slice(0, 4)}`; }
  else if (s.nivel === 'ano') { fDet = d => d.startsWith(s.ano); nomeDet = s.ano; }
  else { fDet = () => true; nomeDet = 'todo o histórico'; }
  const porPessoa = {};
  for (const [d, l] of Object.entries(r.dias)) {
    if (!fDet(d)) continue;
    for (const u of l) {
      if (s.colab !== 'todos' && u.usuario !== s.colab) continue;
      const ativo = (u.sep + u.conf + u.inv + u.aloc) > 0;
      if (!ativo) continue;
      const p = (porPessoa[u.usuario] ||= { usuario:u.usuario, dias:0, horas:0, sep:0, conf:0, aloc:0, inv:0 });
      p.dias++; p.horas += horasDia(d); p.sep += u.sep; p.conf += u.conf; p.aloc += u.aloc; p.inv += u.inv;
    }
  }
  Object.values(porPessoa).forEach(p => { p.funcao = funcaoDe(p.usuario); });
  const opDet = Object.values(porPessoa).filter(p => p.funcao === 'operacional' && p.sep > 0);
  const hsOp = opDet.reduce((x, u) => x + u.horas, 0), sepOp = opDet.reduce((x, u) => x + u.sep, 0);
  let fpDet = { dias:0, lojas:[] };
  if (selBarra && s.modo === 'periodo' && s.nivel === 'mes') fpDet = faltasPeriodo(selBarra.k, selBarra.k);
  else if (selBarra && s.modo === 'periodo' && s.nivel === 'ano') fpDet = faltasPeriodo(selBarra.k + '-01', selBarra.k + '-31');
  else if (!selBarra && s.modo === 'periodo' && s.nivel === 'mes') fpDet = faltasPeriodo(s.mes + '-01', s.mes + '-31');
  else if (!selBarra && s.modo === 'periodo' && s.nivel === 'ano') fpDet = faltasPeriodo(s.ano + '-01-01', s.ano + '-12-31');
  const listaDet = Object.values(porPessoa).sort((a, b) => b.sep - a.sep || b.conf - a.conf || a.usuario.localeCompare(b.usuario, 'pt-BR'));
  const tDet = k => listaDet.reduce((x, u) => x + (u[k] || 0), 0);
  const sepDet = tDet('sep');
  const detalhe = `
    <div class="painel">
      <h3>Por colaborador · ${esc(nomeDet)}${selBarra?.parcial ? ' · parcial' : ''}</h3>
      ${fpDet.dias ? `<div class="aviso" style="margin:6px 0 10px">⚠ Período incompleto: ainda faltam dados de <b>${esc(fpDet.lojas.map(nomeLoja).join(', '))}</b>${fpDet.dias > 1 ? ` em ${fpDet.dias} dias` : ''}. Os números vão mudar quando a coleta terminar.</div>` : ''}
      <div class="leg">${selBarra ? 'Barra selecionada no gráfico. Clique nela de novo para voltar ao período inteiro.' : 'Período inteiro em tela. Clique numa barra do gráfico para filtrar.'} Do maior para o menor número de separações (pedidos separados); "Dias" conta só os dias com atividade; "Por hora" usa as horas disponíveis da jornada nesses dias. A média por hora do time (linha Operacional) considera só a função operacional: líderes, apoio, gestão e logins genéricos ficam fora.</div>
      ${listaDet.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Colaborador</th><th>Função</th><th class="n">Dias</th><th class="n">Horas disp.</th><th class="n">Separações</th><th class="n">Média/dia</th><th class="n">Por hora</th><th class="n">% das separações</th><th class="n">Conferências</th><th class="n">Alocações</th><th class="n">Inventários</th></tr></thead><tbody>
        ${listaDet.map(u => `<tr${u.funcao !== 'operacional' ? ' style="color:var(--mute)"' : ''}><td>${esc(u.usuario)}</td><td>${u.funcao === 'operacional' ? 'operacional' : `<span class="info">${ROT_FUNCAO[u.funcao] || u.funcao}</span>`}</td><td class="n">${u.dias}</td><td class="n">${fmtN(u.horas)}</td><td class="n">${fmtN(u.sep)}</td><td class="n">${u.dias ? fmtN(Math.round(u.sep / u.dias)) : '–'}</td><td class="n"><b>${u.horas && u.sep ? fmtH(u.sep / u.horas) : '–'}</b></td><td class="n">${fmtP(u.sep, sepDet)}</td><td class="n">${fmtN(u.conf)}</td><td class="n">${fmtN(u.aloc)}</td><td class="n">${fmtN(u.inv)}</td></tr>`).join('')}
        <tr class="tot"><td>Operacional</td><td>${opDet.length} pessoa(s)</td><td class="n"></td><td class="n">${fmtN(hsOp)}</td><td class="n">${fmtN(sepOp)}</td><td class="n"></td><td class="n">${hsOp ? fmtH(sepOp / hsOp) : '–'}</td><td class="n">${fmtP(sepOp, sepDet)}</td><td class="n"></td><td class="n"></td><td class="n"></td></tr>
        <tr class="tot"><td>Total geral</td><td></td><td class="n"></td><td class="n">${fmtN(tDet('horas'))}</td><td class="n">${fmtN(sepDet)}</td><td class="n"></td><td class="n"></td><td class="n">100%</td><td class="n">${fmtN(tDet('conf'))}</td><td class="n">${fmtN(tDet('aloc'))}</td><td class="n">${fmtN(tDet('inv'))}</td></tr>
        </tbody></table></div>` : `<div class="vazio">Sem atividade registrada neste período.</div>`}
    </div>`;

  // mapa de calor pessoa x dia (só no nível de mês)
  let mapa = '';
  if (s.modo === 'periodo' && s.nivel === 'mes') {
    const diasMes = Object.keys(r.dias).filter(d => d.startsWith(s.mes) && r.dias[d].some(u => u.sep > 0)).sort();
    const pess = {};
    diasMes.forEach(d => r.dias[d].forEach(u => {
      if (u.sep <= 0 || (s.colab !== 'todos' && u.usuario !== s.colab)) return;
      (pess[u.usuario] ||= { usuario:u.usuario, tot:0, d:{} }); pess[u.usuario].d[d] = u.sep; pess[u.usuario].tot += u.sep;
    }));
    const lp = Object.values(pess).sort((a, b) => b.tot - a.tot);
    const mx = Math.max(1, ...lp.flatMap(p => Object.values(p.d)));
    if (lp.length && diasMes.length) mapa = `
    <div class="painel">
      <h3>Separações por dia · ${MESES_LONGO[+s.mes.slice(5) - 1]} ${s.mes.slice(0, 4)}</h3>
      <div class="leg">Pedidos separados por pessoa em cada dia trabalhado. Quanto mais escuro, mais pedidos. Célula vazia = sem separação no dia.</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Colaborador</th>${diasMes.map(d => `<th class="n">${d.slice(8)}<br><span class="info">${SEMANA[diaSem(d)]}</span></th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
        ${lp.map(p => `<tr><td style="white-space:nowrap">${esc(p.usuario)}</td>${diasMes.map(d => { const v = p.d[d] || 0; const a = v ? .12 + .7 * v / mx : 0;
          return `<td class="n" style="background:rgba(2,40,90,${a});${a > .45 ? 'color:#fff' : ''}">${v ? fmtN(v) : ''}</td>`; }).join('')}<td class="n"><b>${fmtN(p.tot)}</b></td></tr>`).join('')}
        <tr class="tot"><td>Total</td>${diasMes.map(d => `<td class="n">${fmtN(lp.reduce((t, p) => t + (p.d[d] || 0), 0))}</td>`).join('')}<td class="n">${fmtN(lp.reduce((t, p) => t + p.tot, 0))}</td></tr>
      </tbody></table></div>
    </div>`;
  }

  $s.innerHTML = (r.faltando ? avisoColeta(r, 's-coletar') : '') + kpis + painel + detalhe + mapa + tabela +
    `<div class="info">Fonte: Seenc WMS (users/performance). Conta o dia em que o pedido foi separado, não o dia da venda: dias após feriado tendem a ser maiores. Histórico desde ${dataBR(r.inicioHistorico || HIST_INICIO)}.</div>`;

  $s.querySelectorAll('.dcol').forEach(el => {
    const b = barras[+el.dataset.i];
    if (b?.acao) el.onclick = () => { b.acao(); renderSep($s, r); };
    if (b?.abrir) el.ondblclick = () => { b.abrir(); renderSep($s, r); };
  });
  const subir = () => { if (s.nivel === 'mes') s.nivel = 'ano'; else if (s.nivel === 'ano' && anos.length > 1) s.nivel = 'anos'; s.sel = null; renderSep($s, r); };
  const bS = document.getElementById('n-subir'); if (bS) bS.onclick = subir;
  const bD = document.getElementById('n-descer'); if (bD && alvoDescer) bD.onclick = () => { alvoDescer.abrir(); renderSep($s, r); };
  $s.querySelectorAll('[data-ir]').forEach(el => el.onclick = () => { const ir = el.dataset.ir; if (ir === 'anos') { s.nivel = 'anos'; } else if (ir === 'ano') { s.nivel = 'ano'; } s.sel = null; renderSep($s, r); });
  $s.querySelectorAll('[data-modo]').forEach(el => el.onclick = () => { s.modo = el.dataset.modo; s.sel = null; renderSep($s, r); });
  ligarColeta('s-coletar', () => carregarSep(true));
  ligarDicas($s);
}

function ligarDicas(raiz){
  const dica = document.getElementById('dica');
  raiz.querySelectorAll('[data-dica]').forEach(el => {
    el.onmousemove = e => {
      dica.textContent = el.dataset.dica; dica.style.display = 'block';
      const w = dica.offsetWidth, x = e.clientX + 12 + w > innerWidth - 8 ? Math.max(8, e.clientX - 12 - w) : e.clientX + 12;
      dica.style.left = x + 'px'; dica.style.top = (e.clientY + 14) + 'px';
    };
    el.onmouseleave = () => { dica.style.display = 'none'; };
  });
}

/* =================== INÍCIO =================== */
document.getElementById('btn-home').onclick = () => irPara('separados');
async function iniciar(){
  document.getElementById('logo-topo').src = LOGOS.VALENRO;
  document.getElementById('selo-demo').hidden = !DEMO;
  if (DEMO) {
    state.cnpjs = [{ id:'DIGOS', nome:'Digos' }, { id:'CACAL', nome:'Cacal' }, { id:'DROSA', nome:"D'Rosa" }];
    mostrarUsuario({ nome:'Demonstração' });
    return irPara(params.get('tela') || 'separados');
  }
  if (!lerSessao()) return telaLogin();
  try {
    const me = await api('/me');
    state.usuario = me.usuario;
    mostrarUsuario(me.usuario);
    state.cnpjs = (await api('/cnpjs')).cnpjs;
    irPara(params.get('tela') || 'separados');
  } catch (e) {
    if (e instanceof SemSessao) return telaLogin();
    $app.innerHTML = `<div class="erro"><b>Não foi possível conectar ao servidor.</b><br>${esc(e.message)}</div>`;
  }
}
iniciar();
window.addEventListener('unhandledrejection', ev => { if (ev.reason instanceof SemSessao) { ev.preventDefault(); telaLogin('Sua sessão expirou. Entre novamente.'); } });
</script>
